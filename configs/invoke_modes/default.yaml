# InvokeConfig for the NES query engine (read by --worker.query_engine.invoke_mode_configuration).
# The worker parses `global_mode` / `global_fn_attr`; see nes-query-engine/interface/InvokeConfiguration.cpp.
# NOTE: the old `invoke_mode: {name: ...}` schema here was a silent no-op — the worker found no
# `global_mode` key and fell back to default, so "fnattr" never actually applied.
global_mode: default  # "default", "fnattr", or "inline"
