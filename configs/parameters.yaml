worker_params:
  worker.query_engine.number_of_worker_threads:
    type: int
    description: "Processing threads"
    range: [1, 128]

  worker.query_engine.number_of_io_threads:
    type: int
    description: "IO-dedicated threads"
    range: [1, 64]

  worker.query_engine.pin_threads:
    type: bool
    description: "Pin threads to cores"

  worker.query_engine.invoke_mode_configuration:
    type: string
    description: "Path to invoke mode YAML (or name: default, fnattr, inline)"
    values: [default, fnattr, inline]

  worker.query_engine.admission_queue_size:
    type: int
    description: "Admission queue size"

  worker.query_engine.ccx_aware_task_queues:
    type: bool
    description: "Per-CCX admission-queue sharding: emitters enqueue into their own CCX's shard, workers prefer own-CCX tasks, steal when idle (needs pin_threads)"

  worker.query_engine.ccx_topology:
    type: string
    description: "CCX topology override for ccx_aware_task_queues, e.g. '0-5,24-29;6-11,30-35'; empty = sysfs auto-detect"

  worker.ccx_shared_source_pools:
    type: bool
    description: "One shared source buffer pool per CCX cell (caps ring working set at numCcx x pool size; needs ccx_aware_task_queues + pin_threads)"

  worker.ccx_source_pool_buffers:
    type: int
    description: "Buffers per CCX-cell source pool (default 128 = 16 MB/cell at 128 KiB)"

  worker.default_query_execution.operator_buffer_size:
    type: int
    description: "Buffer size per operator (power of 2)"
    values: [1024, 2048, 4096, 8192, 16384, 32768, 65536]

  worker.default_query_execution.execution_mode:
    type: string
    values: [COMPILER, INTERPRETER]

  worker.number_of_buffers_in_global_buffer_manager:
    type: int
    description: "Number of buffers in global pool"

  worker.dump_compilation_result:
    type: string
    values: [NONE, IR, ASM]

query_params:
  source_type:
    type: string
    values: [File, BlockingFile, IoUringFile, IoUringFileAsync, InMemory, TCP, BlockingTCP, IoUringTCP]
    description: "Physical source type"

  sink_type:
    type: string
    values: [File, Checksum, Void, Monitoring, CodecMonitoring]
    description: "Sink type"

  input_formatter.type:
    type: string
    values: [CSV, SIMDCSV, JSON, UncompiledCSV, UncompiledJSON,
             SequentialCSV, SequentialJSON,
             SequentialUncompiledCSV, SequentialUncompiledJSON,
             SystemNative]
    description: "Input formatter type"

  input_formatter.string_length:
    type: string
    description: >
      SystemNative only, and REQUIRED there (no engine default): comma-separated max byte lengths
      (e.g. '16,32,32,16,4,256') consumed by VARSIZED fields in schema order. Each VARSIZED field
      occupies exactly that many bytes in the .nes file (UTF-8 + \x00 padding; content must fit in
      N-1 bytes). Extra entries are ignored and no-VARSIZED schemas still need the key set, so one
      global value is safe for multi-source queries. Must match the lengths the .nes file was
      generated with (nes-systests/testdata/small/csv_to_binary.py), else fields misalign.

  input_formatter.threading_mode:
    type: string
    values: [sequential, parallel]
    description: "Threading mode for input formatter"

  input_formatter.allow_commas_in_strings:
    type: bool
    values: [true, false]
    description: >
      CSV indexer quote-awareness. TRUE = ignore field delimiters inside quoted strings (the engine
      default). FALSE = treat every comma as a delimiter -- correct AND ~22% cheaper on index CPU
      (skips the prefixXor quote-parity pass + quote SIMD compare) for quote-free numeric data.
      The renderer DEFAULTS this to FALSE for all CSV formatters (all pbench data is quote-free);
      set it TRUE explicitly for any dataset with quoted strings that contain commas.

  output_formatter.type:
    type: string
    values: [CSV, JSON, CSVUncompiled, JSONUncompiled, NATIVE]
    description: "Output formatter type"

  input_parser:
    type: map
    description: "Per-datatype input parser overrides"

  output_parser:
    type: map
    description: "Per-datatype output parser overrides"

setup_params:
  num_queries:
    type: int
    description: "Number of concurrent queries (worker-cli mode)"
    range: [1, 10000]

  duration_seconds:
    type: int
    description: "Duration of streaming run in seconds (worker-cli mode)"

  branch:
    type: string
    description: "NebulaStream branch to use"
    values: [benchmark-piparse-base, benchmark-piparse-lazyparse, benchmark-piparse-codecs]

  source_codec:
    type: string
    description: "Codec for encoded source data (benchmark-piparse-codecs branch)"
    values: [None, ZSTD, LZ4, Snappy]

  sink_codec:
    type: string
    description: "Codec for encoded sink data (benchmark-piparse-codecs branch)"
    values: [None, ZSTD, LZ4, Snappy]

  overload:
    type: bool
    description: "Enable LazyValue overloaded comparisons"

dependencies:
  - if: { source_type: [TCP, BlockingTCP] }
    requires: [generator]
    mode: worker-cli

  - if: { source_codec: [None, ZSTD, LZ4, Snappy] }
    requires: { branch: benchmark-piparse-codecs }

  - if: { sink_codec: [None, ZSTD, LZ4, Snappy] }
    requires: { branch: benchmark-piparse-codecs }

  - if: { overload: true }
    requires: { branch: [benchmark-piparse-lazyparse, benchmark-piparse-lazyparse-fast-csv] }   # 2026-09-28: the knob lives on both

  - if: { input_formatter.type: [SequentialCSV, SequentialJSON,
                                  SequentialUncompiledCSV, SequentialUncompiledJSON] }
    requires: { source_type: [BlockingFile, IoUringFile, BlockingTCP, InMemory] }
    note: "Sequential formatters require a dedicated-thread BLOCKING source (the runner runs
           index+parse inline on the source thread). IoUringFile qualifies: it is a BlockingSource
           whose deep-QD O_DIRECT reads are consumed IN PLACE (zero-copy) by the sequential
           formatter's accumulator (no runner prepend) -- added 2026-07-03. InMemory qualifies too:
           it prefills TupleBuffers in its ctor and the sequential runner drains them via
           takePreFilledBuffer() -- zero I/O and zero copy in the timed window -- added 2026-07-04."
