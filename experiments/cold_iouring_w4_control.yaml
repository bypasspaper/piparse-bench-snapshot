experiment:
  name: cold_iouring_w4_control
  description: >
    CONTROL for cold_iouring_w16 (session 2026-07-03): reproduce the known-good ~6.8 GB/s cold
    blocking-io_uring config at W4/pool2048 BEFORE chasing the W16 deadlock. This is the exact
    §40b optimum (HANDOVER 2_engine_to_e2e): blocking IoUringFile + O_DIRECT + REGBUF + align512
    + QD64, W4/IO1, pool 2048 (256 MB), SIMDCSV, cold bid_6GB passthrough = 6.77 GB/s (§36 steady
    6.84 = 96% of the 7.03 GB/s NVMe device cap). The async IoUringFileAsync matched it within 0.2%.

    WHY: cold_iouring_w16 (same recipe, W16, pools 256/512) DEADLOCKED all 6 runs -- MonitoringSink
    no output in 120s, DIAG parse calls=0 (no data ever flowed = first-buffer stall). Hypothesis:
    at W16 the 16 workers' buffer reservations + the source's QD64 prefill (64 in-flight buffers)
    exceed the small pool -> source can't prefill -> stall. The pool floor scales with W x QD. This
    control isolates that: if W4/pool2048 gives ~6.8, the recipe is SOUND and the W16 failure is a
    pool-floor problem (not W16+regbuf broken). If this ALSO fails, the regbuf/O_DIRECT config
    itself regressed on this binary -- investigate before trusting any W16 number.

    PREDICTION: ~6.7-6.8 GB/s. If ~2-3, check for a "regbuf fallback"/alignment warning in the
    worker log and that DIRECT/QD env + source_type=IoUringFile actually reached the worker.

    GOTCHAS (same as cold_iouring_w16):
    - cold_read evicts bid_6GB before every rep (COLD line in the log); generator.repeat=1, single
      6.44 GB pass; NO generator process for file sources.
    - O_DIRECT+REGBUF need 512-alignment; global_buffer_alignment:512 + slab base rounded to 512.
      A fallback-to-buffered warning => throughput collapses to buffered (~2 GB/s).
    - Sandbox OFF (spawns worker, binds :8080); verify :8080 free + no stray worker/main first.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    global_buffer_alignment: 512
    number_of_buffers_in_global_buffer_manager: 2048
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_REGBUF: 1

variants:
  - name: cold_iouring_w4_control
    description: "COLD bid_6GB passthrough, W4/IO1, IoUringFile O_DIRECT+REGBUF QD64, pool 2048 -- known-good control"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "config"
        explicit:
          - name: "W4 pool2048 (256 MB)"
            baseline: true
            overrides: {}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
