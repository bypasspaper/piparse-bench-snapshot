experiment:
  name: stateful_join_smoke
  description: >
    First stateful nexmark queries through the piparse-bench production path
    (worker-cli + File source + MonitoringSink). Validates that JOIN + windowed
    queries with VARSIZED fields compile, run to EoS, and yield sane
    throughput/latency before the §15 pool sweep. Two varsized joins:
    q3 (auction JOIN person, tumbling 10s) and q8 (person JOIN auction,
    tumbling 10s). File source, single pass (repeat=1) for clean window
    semantics. Pool at the passthrough optimum (4096 = 512 MB). Companion:
    ~/Notes/nebulastream/benchmark/2_engine_to_e2e HANDOVER §15/§20.2.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node

  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 131072          # 128 KiB
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096   # 512 MB (passthrough optimum)

  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
    input_parser:                           # full fastest parser stack
      uint64: TracedUINT64
      int32: TracedINT32
      int64: TracedINT64
      f64: EiselFloatF64
    output_formatter:
      type: CSV                             # sink doesn't serialize -> measures the engine

  generator:
    repeat: 1                               # File: NES_FILE_REPEAT=1 (single pass, clean windows)
    mode: burst
    rate: 1000000

variants:
  - name: q3_auction_join_person
    description: "nexmark q3: auction JOIN person ON seller=personId, TUMBLING 10s, varsized person fields"
    query: nexmark/q3_join
    axes:
      x:
        label: "Worker Threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [16]
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: bar_chart

  - name: q8_person_join_auction
    description: "nexmark q8: person JOIN auction ON id=seller, TUMBLING 10s, varsized name"
    query: nexmark/q8_join
    axes:
      x:
        label: "Worker Threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [16]
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: bar_chart
