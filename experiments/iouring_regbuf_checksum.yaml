experiment:
  name: iouring_regbuf_checksum
  description: >
    CORRECTNESS gate for registered fixed buffers: a Checksum-sink A/B (baseline non-fixed vs regbuf fixed)
    must produce a BYTE-IDENTICAL checksum, proving io_uring_prep_read_fixed lands the same bytes as plain
    prep_read. Single pass (PASSES=1) so the checksum matches the known-good §26 value for bid_6GB
    passthrough: count 183,991,721, checksum 335920996194. regbuf arm sets NES_BUFFER_ALIGN=512 (required
    for fixed O_DIRECT 512-aligned payloads). Cold O_DIRECT QD64, W4/IO1. n=1 (checksum is deterministic).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Checksum
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_REGBUF: 0

variants:
  - name: iouring_regbuf_checksum
    description: "single-pass cold O_DIRECT QD64 Checksum: baseline vs regbuf (must match)"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "mode"
        explicit:
          - name: "baseline"
            baseline: true
            overrides: {}
          - name: "regbuf"
            overrides: {"worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
