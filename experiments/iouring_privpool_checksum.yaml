experiment:
  name: iouring_privpool_checksum
  description: >
    Verify the per-source private pool design: with the DEFAULT global pool (32768) -- which previously HALVED
    cold throughput to 3.3 GB/s (§41) -- the source now uses its OWN pool sized to default_max_inflight_buffers
    (256), so it should be FAST (~6.8) regardless of the global pool size. QD is AUTO-derived = clamp(256/2,1,64)
    = 64 (NES_IOURING_QD intentionally unset). global_buffer_alignment 512 so the private source pool inherits
    512 -> regbuf engages. Semaphore kept (harmless; private pool binds first). baseline vs regbuf. Checksum sink.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    default_max_inflight_buffers: 256
    global_buffer_alignment: 512
    query_engine: {number_of_worker_threads: 4, number_of_io_threads: 1, invoke_mode_configuration: fnattr, pin_threads: false}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    source_type: IoUringFile
    sink_type: Checksum
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 1, mode: burst, rate: 1000000}
  worker_env: {NES_IOURING_DIRECT: 1, NES_IOURING_REGBUF: 0}
variants:
  - name: iouring_privpool_checksum
    description: "default global pool + private source pool(256), QD auto: baseline vs regbuf"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: mode
        explicit:
          - {name: baseline, baseline: true, overrides: {}}
          - {name: regbuf, overrides: {"worker_env.NES_IOURING_REGBUF": 1}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
