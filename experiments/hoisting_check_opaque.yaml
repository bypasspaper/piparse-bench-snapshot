# SPDX-License-Identifier: Apache-2.0
experiment:
  name: hoisting_check_opaque
  description: >
    Quick convergence check: both arms OPAQUE (invoke_mode=default), differing ONLY in EAGER_PARSE.
    At 100% selectivity both parse every row with identical codegen, so they must converge (isolating
    pure hoisting); at 0% the lazy arm still skips all parsing (structural hoisting, independent of
    fnattr). sel_000 + sel_100 only.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON, disable_passthrough: true }
    input_parser: { uint64: FastUINT64, f64: EiselFloatF64 }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 5
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 5
    NES_INMEM_BUFSIZE: 131072

_arms: &arms
  label: "arm"
  explicit:
    - name: eager_opaque
      baseline: true
      overrides:
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false, eager_parse: true }
        query_config.output_formatter: { type: JSON, disable_passthrough: true }
        query_config.input_parser: { uint64: FastUINT64, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.invoke_mode_configuration: default
        generator.repeat: 5
    - name: lazy_opaque
      overrides:
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON, disable_passthrough: true }
        query_config.input_parser: { uint64: FastUINT64, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.invoke_mode_configuration: default
        generator.repeat: 5

_noop_x: &noop_x { label: "config", parameter: topology, values: [single-node] }
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: sel_000
    description: "0% selectivity"
    query: hoisting/bid_sel000
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: sel_100
    description: "100% selectivity"
    query: hoisting/bid_sel100
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
