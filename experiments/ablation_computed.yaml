experiment:
  name: ablation_computed
  description: >
    writeRawBytes value-write inline A/B. Isolates the effect of splicing the JSON plugin's own
    NAUTILUS_INLINE value-write helper (writeRawBytes), enabled by adding nautilus_inline(
    json_output_formatter_plugin) to the plugin CMakeLists. The two binaries (OLD = writeRawBytes
    opaque proxy, NEW = writeRawBytes spliced) are swapped in place by run_writeRawBytes_ab.sh; this
    experiment defines the query/config both arms share.

    Config = full-opt W1 (compiled SequentialCSV -> JSON, fnattr + inline + tcb, single worker
    thread). W1 on purpose: passthrough at W16 pins the ~11 GB/s read wall and MASKS a per-row
    output saving. Monitoring sink (NOT Checksum -- Checksum defeats lazy elision, which would parse
    the values and bypass writeRawBytes entirely).

    Two variants probe the 1-vs-4 value-writes/row scaling (the mechanistic tell that the delta is
    really writeRawBytes):
      bid_ts_projection : SELECT timestamp        -> 1 writeRawBytes / row
      bid_star          : SELECT *  (4 numeric)   -> 4 writeRawBytes / row (float text copied raw too)
    Expect the NEW-vs-OLD gain to scale ~4x from the 1-field to the star query if it is genuinely
    writeRawBytes.
    RUN: bash ~/Notes/.../ir_tcb_study/run_writeRawBytes_ab.sh
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 600
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 6

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

_fullopt_w1: &fullopt_w1
  label: "cell"
  explicit:
    - name: fullopt_w1
      baseline: true
      overrides:
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true

variants:
  - name: pricecalc
    description: "SELECT price*908/1000 -- 1 computed FLOAT64/row (ZMIJ serialize)"
    query: nexmark/pricecalc
    axes: { x: *noop_x, series: *fullopt_w1 }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q1_price
    description: "SELECT timestamp,auctionId,bidder,price*908/1000 -- 3 lazy + 1 computed float (mixed)"
    query: nexmark/q1_price
    axes: { x: *noop_x, series: *fullopt_w1 }
    y: *tput_y
    visualization: { type: grouped_bar }
