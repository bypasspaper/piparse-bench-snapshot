# SPDX-License-Identifier: Apache-2.0
experiment:
  name: repro_shredder_scaling_n1_n8
  description: >
    Reproduction check (2026-07-15): re-run the fragment-shredder file-source scaling GREEN CURVE
    (CCX cells + fragment shredder, bid passthrough) at N=1 and N=8 only, to confirm this
    environment matches the recorded shredder_fragments_source_scaling / lock_free_fragments
    results before building the fair Flink latency comparison.
    EXPECTED (from the stored run): N=1 p50 0.049 / p99 0.151 / p999 1.245 ms, ~9.7 GB/s;
    N=8 p50 1.41 / p99 2.13 / p999 3.34 ms, ~38.8 GB/s. Config copied verbatim from
    shredder_fragments_source_scaling (8io+16w striped CCX cells, shared source pools 128 KiB x
    192/cell, LOCK_FREE_FRAGMENTS, generator repeat 6, warm page cache, bid_1GB medium).
    RUN: pbench run experiments/repro_shredder_scaling_n1_n8.yaml \
           --build-dir <repo>/cmake-build-release --worker-port 8085
  primary_metric: p99_latency_us
  higher_is_better: false
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 600
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 192
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  worker_env:
    NES_TASKQUEUE_STATS: 1
  generator:
    repeat: 6

variants:
  - name: repro
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "Concurrent Queries (= Concurrent Sources)"
        parameter: num_queries
        values: [1, 8]
      series:
        label: "sequence shredder"
        explicit:
          - name: lock_free_fragments
            baseline: true
            overrides:
              query_config.input_formatter.sequence_shredder_mode: LOCK_FREE_FRAGMENTS
    y: { metric: p99_latency_us, label: "p99 latency (us)" }
    visualization: { type: line_chart, x_scale: log }
