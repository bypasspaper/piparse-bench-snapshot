experiment:
  name: pin_profile
  description: >
    Long single run (IO=1/W=4 pinned, pool 128, File passthrough, repeat 40 ~ long
    steady window) to profile per-thread CPU (pidstat -t) and localize the ~8.9 GB/s
    pinned ceiling. Expectation: IOThread ~100% (kernel read-copy _copy_to_iter is the
    limiter), workers <100% (drained, supply-starved) => io-thread-bound. Run pidstat/
    perf SEPARATELY against the worker during this.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine: {pin_threads: true, number_of_io_threads: 1, number_of_worker_threads: 4, invoke_mode_configuration: fnattr}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 128
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 120, mode: burst, rate: 1000000}
variants:
  - name: pin_profile
    description: "IO1/W4 pinned pool128 long run"
    query: nexmark/bid_passthrough
    axes:
      x: {label: "config", parameter: worker.query_engine.number_of_worker_threads, values: [4]}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
