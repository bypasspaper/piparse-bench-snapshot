# SPDX-License-Identifier: Apache-2.0
experiment:
  name: shredder_spanning_probe
  description: >
    Stress the SequenceShredder via LARGE SPANNING TUPLES instead of small buffers (user idea):
    ~80 KB strings span ~2.4x 32 KiB buffers -> heavy cross-buffer coordination (incl. no-delimiter
    middle buffers) at a MODERATE buffer size (16K buffers = low per-buffer overhead). If LOCKING
    collapses vs LOCK_FREE here, the shredder synchronization is exposed cleanly (decoupled from the
    tiny-buffer per-buffer wall). InMemory prefill, CSV->CSV passthrough, 32 KiB input buffers,
    128 KiB operator buffer (holds the 80 KB rows). x=threads, series = LOCK_FREE vs LOCKING.
    Check throughput gap + DIAG_SHREDDER (calls, cpu) in worker.log. y=rows/s = 6553 x REPEAT(40)/proc_time.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_spanning_probe.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 8
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: false
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 40
    NES_INMEM_BUFSIZE: 32768
    NES_TASKQUEUE_STATS: 1

variants:
  - name: spanning
    description: "80KB spanning strings @32KiB: LOCK_FREE vs LOCKING, x=threads"
    query: formatter/bigstr_pass
    axes:
      x:
        label: "worker threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [1, 2, 4, 8, 16, 24]
      series:
        label: "shredder"
        explicit:
          - name: lock_free
            baseline: true
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
          - name: locking
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCKING }
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: line_chart
