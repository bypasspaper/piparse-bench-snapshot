experiment:
  name: pin_probe_file_n500
  description: >
    Follow-up to pin_probe_file_n100 (READ IT: pinning mechanism, CCX layout, N=100
    results): the LATENCY config (pin_threads=true, 18w/6io -- io@0-5 = exactly CCX0,
    workers@6-23 = CCX1-3) probed at N=500 sources, file async q1, ONE rep. Question:
    does the pinned tail STAY TIGHT as queue depth grows 5x, or does it re-fatten?

    BASELINES @N=500 (unpinned): 24w/6io tuned 13084 MB/s (p50 4.9 / p99 16.5);
    24w/4io 12006 (p50 5.4 / p99 16.7). Pinned 18w/6io @N=100: 12748 (p50 1.2 /
    p99 2.2 / p999 2.8 -- p99-p50 spread only ~1 ms).

    PREDICTIONS:
      - Throughput ~12.2-12.8 GB/s (source-count-independent like every async config).
      - p50 grows with queue depth roughly like the unpinned curves (~linear in N):
        1.2 @100 -> ~4-6 ms @500.
      - THE question is the SPREAD: if pinning's tail-tightness holds, p99 stays within
        ~1-3 ms of p50 (=> p99 ~6-9 ms vs unpinned 16.5) and p999 <= ~10. If instead
        p99 re-fattens toward ~16 ms, the N=100 tail win was a low-occupancy artifact
        and pinning does not protect the tail under deep queueing.

    RESULT (2026-07-07, 1 rep): 12390 MB/s, p50 5.3 / p99 12.9 / p999 16.1 ms.
      VERDICT -- IN BETWEEN the two hypotheses: p50 is queue-depth-driven exactly like
      unpinned (5.3 vs 4.9); the tail is STILL better than unpinned (p99 12.9 vs 16.5,
      -22%) but the p99-p50 spread re-fattens from ~1 ms (@100) to ~7.6 ms (@500) -- the
      spectacular 6-8x tail win at N=100 shrinks to ~1.3x at 500. Deep queueing
      dominates scheduler placement; pinning removes the SCHEDULING component of the
      tail, not the QUEUEING component. Throughput -5.3% vs unpinned tuned (consistent
      with -4.5% @100). Pinning's tail value is greatest at low-to-mid occupancy.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  num_queries: 500
  worker:
    query_engine:
      number_of_worker_threads: 18
      number_of_io_threads: 6
      pin_threads: true
      invoke_mode_configuration: fnattr
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 6

variants:
  - name: pin_n500
    description: "q1 file async, N=500, pin_threads=true, 18w/6io (CCX-aligned)"
    query: nexmark/q1_price
    axes:
      x:
        label: "Concurrent Queries"
        parameter: num_queries
        values: [500]
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: bar_chart }
