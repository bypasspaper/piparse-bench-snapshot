experiment:
  name: tcp_pin_pool_2src_rev
  description: >
    REVERSE-ORDER replica of tcp_pin_pool_2src.yaml (2 asio TCP sources, IO=2/W=4 = one CCX, cold
    bid_passthrough, per-source pool {4096,64} x pin {on,off}). Forward run executed pin_off FIRST
    (coolest) and pin_on LAST (hottest) -> the observed pin_on deficit (-23%) could be partly thermal/
    run-order bias (HANDOVER gotcha §48.MEASUREMENT). This run REVERSES the order: pin_on first/coolest,
    pin_off last/hottest, and x reversed (4096 before 64). Bracketing forward vs reverse isolates the
    thermal component: if pin_on < pin_off in BOTH orders, pinning genuinely hurts; the thermal-corrected
    effect = mean of the two orders. (Cleaner than a single sweep; the handover prescribes ALTERNATING,
    this reverse pass is the user-requested control.)
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  completion_timeout_s: 180
  worker:
    query_engine:
      number_of_io_threads: 2
      number_of_worker_threads: 4
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    source_type: TCP
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
    independent_per_query: true

variants:
  - name: tcp_pin_pool_2src_rev
    description: "REVERSE order: pin {on,off} x pool {4096,64}, 2 cold asio TCP sources, IO=2/W=4, aggregate"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "per-source private pool (buffers)"
        parameter: worker.default_max_inflight_buffers
        values: [4096, 64]
      series:
        label: "pin"
        explicit:
          - {name: "pin_on", baseline: true, overrides: {num_queries: 2, worker.query_engine.pin_threads: true}}
          - {name: "pin_off", overrides: {num_queries: 2, worker.query_engine.pin_threads: false}}
    y: {metric: throughput_mbps, label: "Aggregate Throughput (MB/s)"}
    visualization: {type: bar_chart}
