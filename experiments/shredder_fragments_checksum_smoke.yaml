experiment:
  name: shredder_fragments_checksum_smoke
  # CORRECTNESS SMOKE for the fragment-copy sequence shredder (LOCK_FREE_FRAGMENTS, session
  # 2026-07-12): same query, Checksum sink, series = sequence_shredder_mode LOCK_FREE (classic
  # buffer-pinning) vs LOCK_FREE_FRAGMENTS (boundary-byte copies, FragmentSequenceShredder).
  # Spanning tuples occur at every 128 KiB buffer boundary, so any fragment-byte corruption
  # (wrong offsets, publish-ordering bug, lazy-offset fallback miss) shifts row bytes and the
  # checksum diverges.
  # The [checksum] count,checksum lines must be IDENTICAL between the series arms per query AND
  # reproduce the recorded values from ccx_queue_checksum_smoke (2026-07-09):
  #   person_projection 4000000,1444868000 (recorded catalog checksum)
  #   q2_filter_proj    1511777,1499177125
  #   q1_price          183991721,431495796659
  # GOTCHAS: worker-cli mode needs the release build (--build-dir cmake-build-release);
  # SIMDCSV sets the last-delimiter offset eagerly, so the fragment path (not the pinned
  # fallback) is what runs here; DIAG_FRAGSHREDDER lines in worker.log confirm the fragment
  # shredder actually executed (calls > 0) -- if it prints 0, the mode did not reach the
  # InputFormatter and the A/B is vacuous.
  # RESULTS (2026-07-12, 6/6 ok): ALL THREE queries arm-EQUAL and matching the recorded values
  # (person_projection 4000000,1444868000; q2_filter_proj 1511777,1499177125; q1_price
  # 183991721,431495796659). Worker-side DIAG_FRAGSHREDDER calls>0 (and DIAG_SHREDDER=0) in the
  # fragments arms confirms the fragment path executed; shredder CPU comparable across arms
  # (0.021-0.025 s vs 0.016-0.023 s at ~102 k calls). Fragment-copy correctness validated e2e.
  description: "checksum equality smoke: LOCK_FREE vs LOCK_FREE_FRAGMENTS shredder, pinned W11"
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  completion_timeout_s: 600
  worker:
    query_engine:
      number_of_worker_threads: 11
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Checksum
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser: { uint64: TracedUINT64, int32: FastINT32, f64: EiselFloatF64 }
  generator:
    repeat: 1

_series: &shredder_series
  label: "sequence shredder"
  explicit:
    - name: lock_free
      baseline: true
      overrides:
        query_config.input_formatter.sequence_shredder_mode: LOCK_FREE
    - name: lock_free_fragments
      overrides:
        query_config.input_formatter.sequence_shredder_mode: LOCK_FREE_FRAGMENTS

_axes_x: &w11_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [11]

_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }

variants:
  - name: person_projection
    query: nexmark/person_projection
    axes: { x: *w11_x, series: *shredder_series }
    y: *time_y

  - name: q2_filter_proj
    query: nexmark/q2_filter_proj
    axes: { x: *w11_x, series: *shredder_series }
    y: *time_y

  - name: q1_price
    query: nexmark/q1_price
    axes: { x: *w11_x, series: *shredder_series }
    y: *time_y
