experiment:
  name: uncompiled_vs_compiled_fieldsweep
  description: 'Compiled vs uncompiled INPUT FORMATTER as source field count N grows
    1..10, projecting a single field (SELECT c0*FLOAT64(1)), csv->json, InMemory-prefill
    sequential W1, y=records/s. COMPILED (SequentialCSV) indexes all N delimiters
    but parses only c0 (projection pushdown); UNCOMPILED (SequentialUncompiledCSV)
    parses ALL N fields (no pushdown) -> the gap should WIDEN with N. FLOAT64 (.6f,
    Eisel parse). Extends the compiled-only multicol/gridsweep field sweeps with the
    uncompiled arm + JSON output. generator.repeat=20==NES_INMEM_REPEAT=20 -> records/s
    auto-corrected. GOTCHAS: pkill -x main + --worker-port 9099; InMemory prefill
    + 16384 pool; data nf{1..10}.csv from scratchpad/gen.c.

    '
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  completion_timeout_s: 300
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter:
      type: SequentialCSV
      threading_mode: sequential
    input_parser:
      f64: EiselFloatF64
    output_formatter:
      type: JSON
    output_parser:
      f64: ZMIJF64
  generator:
    repeat: 20
    mode: burst
    rate: 1000000
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072
variants:
- name: fieldsweep
  description: compiled vs uncompiled formatter across N=1..10 fields, project c0,
    csv->json
  queries:
  - multicol/projf_n1
  - multicol/projf_n2
  - multicol/projf_n3
  - multicol/projf_n4
  - multicol/projf_n5
  - multicol/projf_n6
  - multicol/projf_n7
  - multicol/projf_n8
  - multicol/projf_n9
  - multicol/projf_n10
  axes:
    x:
      label: source fields N
      explicit:
      - name: sweep
        baseline: true
        overrides: {}
    series:
      label: formatter
      explicit:
      - name: compiled
        baseline: true
        overrides: {}
      - name: uncompiled
        overrides:
          query_config.input_formatter:
            type: SequentialUncompiledCSV
            threading_mode: sequential
          query_config.output_formatter:
            type: JSONUncompiled
          query_config.input_parser: {}
          query_config.output_parser: {}
  y:
    metric: throughput_mrows_s
    label: records/s
  visualization:
    type: grouped_bar
