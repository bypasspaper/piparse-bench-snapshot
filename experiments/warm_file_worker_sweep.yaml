experiment:
  name: warm_file_worker_sweep
  description: >
    Fill the W1 gap: warm async File source (buffered QD1, page-cache reads) worker sweep at
    the EXACT config of the cold io_uring sweep so the only differences are warm-vs-cold and
    File-vs-IoUringFile. source_type File, warm_read: true (mincore-verified cache-resident),
    repeat 1 (single warm 6.44 GB pass, matching the cold sweep's repeat 1 — so these run a touch
    below §16's repeat-4 steady numbers W2 5.79/W4 6.64), pool 4096, IO=1, W in {1,2,3,4}, median n=3.

    COMPARE vs cold io_uring O_DIRECT (iouring_worker_sweep): W1 3.12 / W2 5.38 / W3 5.90 / W4 5.92.
    HYPOTHESIS: at W1/W2 throughput is CONSUMER(worker)-bound, so warm File ~= cold io_uring there
    (the source/cache barely matters); they diverge at W>=3 where the producer becomes the limit
    (warm File feeds from RAM, cold io_uring from disk at the single-producer-thread ceiling 5.9).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: warm_file_worker_sweep
    description: "warm async File QD1, sweep number_of_worker_threads"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "number_of_worker_threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [1, 2, 3, 4]
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart}
