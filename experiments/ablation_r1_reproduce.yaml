# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_r1_reproduce
  description: 'Reproduce ablation v4 r1 (old-uncompiled scalar-interpreted) on its
    OWN queries/datasets at TODAY''s build, W1, to isolate BUILD DRIFT from dataset.
    Compare throughput_mbps to the v4 table: bid_star 67 / q1_price 55 / q10_datetime
    27 (all bid_1GB numeric) / q22_concat 140 (bid_strings). xcheck arms = my naive-arm
    queries on bid_strings (expect ~465/505). Config byte-identical to the naive arm
    + the r1 rung.'
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter:
      type: SequentialUncompiledOldCSV
      threading_mode: SEQUENTIAL
    output_formatter:
      type: JSONUncompiled
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
variants:
- name: bid_star
  query: nexmark/bid_star
  overrides:
    data_size: medium
  axes:
    x:
      label: w
      parameter: worker.query_engine.number_of_worker_threads
      values:
      - 1
    series:
      label: arm
      explicit:
      - name: r1_naive
        baseline: true
        overrides:
          query_config.source_type: BlockingFile
          query_config.input_formatter: &id001
            type: SequentialUncompiledOldCSV
            threading_mode: SEQUENTIAL
          query_config.output_formatter: &id002
            type: JSONUncompiled
          query_config.input_parser: &id003 {}
          query_config.output_parser: &id004 {}
          worker.query_engine.number_of_worker_threads: 1
          generator.repeat: 1
          data_size: medium
  y:
    metric: throughput_mbps
    label: MB/s
  visualization:
    type: grouped_bar
- name: q1_price
  query: nexmark/q1_price
  overrides:
    data_size: medium
  axes:
    x:
      label: w
      parameter: worker.query_engine.number_of_worker_threads
      values:
      - 1
    series:
      label: arm
      explicit:
      - name: r1_naive
        baseline: true
        overrides:
          query_config.source_type: BlockingFile
          query_config.input_formatter: *id001
          query_config.output_formatter: *id002
          query_config.input_parser: *id003
          query_config.output_parser: *id004
          worker.query_engine.number_of_worker_threads: 1
          generator.repeat: 1
          data_size: medium
  y:
    metric: throughput_mbps
    label: MB/s
  visualization:
    type: grouped_bar
- name: q10_datetime
  query: nexmark/q10_datetime
