experiment:
  name: iouring_pin_smallpool
  description: >
    Does thread pinning help the io_uring O_DIRECT source at a SMALL pool? All prior io_uring runs were
    pin-off; §25's "pinning doesn't transfer to cold" was for the QD1 async File source (disk-latency-bound) --
    a different regime from the small-pool io_uring source, which is PRODUCER-CPU-bound (§41). pin_threads=true
    pins each WorkerThread-i to core cpuOffset+i (W4 -> cores 0-3, one CCD / shared L3); the DataSrc producer
    thread is NOT pinned (it roams). So this tests whether keeping the 4 workers L3-local helps when input
    buffers are DMA'd to DRAM (bypassing cache).

    Pool 4096 (512MB, the fast small-pool regime), 128 KiB buffers, single-pass cold O_DIRECT QD64, W4/IO1,
    n=3 median. 4 points: baseline/regbuf x pin off/on. regbuf points set global_buffer_alignment: 512 +
    NES_IOURING_REGBUF=1. Reference (pin off): baseline 5.78, regbuf 6.72 GB/s; device cap 7.03.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_REGBUF: 0

variants:
  - name: iouring_pin_smallpool
    description: "pool 4096 cold O_DIRECT QD64: baseline/regbuf x pin off/on"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "mode/pin"
        explicit:
          - name: "base_pinoff"
            baseline: true
            overrides: {}
          - name: "base_pinon"
            overrides: {"worker.query_engine.pin_threads": true}
          - name: "regbuf_pinoff"
            overrides: {"worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
          - name: "regbuf_pinon"
            overrides: {"worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1, "worker.query_engine.pin_threads": true}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
