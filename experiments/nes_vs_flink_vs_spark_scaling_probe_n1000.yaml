# SPDX-License-Identifier: Apache-2.0
experiment:
  name: nes_vs_flink_vs_spark_scaling_probe_n1000
  description: >
    MAX-SCALE stress probe at N=1000 concurrent sources/queries for the 3-engine many-source
    scaling head-to-head (10-query stateless PAPER_WORKLOAD heterogeneous mix, csv -> json).
    The point: confirm all three engines SURVIVE at the top of the intended sweep before
    committing to the full 1->1000 grid. NES is certified to 1024 (green curve); Flink ran 1024
    in the passthrough latency sweep; SPARK at 1000 concurrent Structured Streaming queries in one
    SparkSession is the WILDCARD (1000 driver StreamingExecution threads -- may OOM or thrash). If
    Spark caps below 1000, that ceiling IS the result. Spark now runs on all 24 cores (fair).
    Config identical to nes_vs_flink_vs_spark_scaling_probe.yaml (the N=128/256 probe) except the
    single N=1000 point and spark_parallelism 24. Same pre-flight (pkill -x main; jar built;
    pyspark; warm bid_strings_3GB.csv; --worker-port 9099; pbench run --detach;
    PBENCH_FLINK_TIMEOUT=3600 PBENCH_SPARK_TIMEOUT=3600 PBENCH_KEEP_LOGS=1). Expect NES ~2-3 min,
    Flink/Spark ~35 min each at their ~1.8 GB/s ceilings.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 3000
  query_mix:
    - nexmark/matrix/bidstr_q0
    - nexmark/matrix/bidstr_qproject
    - nexmark/matrix/bidstr_qroute
    - nexmark/matrix/bidstr_q1
    - nexmark/matrix/bidstr_q2og
    - nexmark/matrix/bidstr_q2mod
    - nexmark/matrix/bidstr_q10
    - nexmark/matrix/bidstr_q14
    - nexmark/matrix/bidstr_q22
    - nexmark/matrix/bidstr_qex
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 192
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_series_engines: &engines
  label: "engine"
  explicit:
    - name: NebulaStream
      baseline: true
    - name: Flink
      system: flink
      overrides:
        mode: flink
        flink_execution_mode: streaming
        flink_output_format: latency_json
    - name: Spark
      system: spark
      overrides:
        mode: spark
        spark_output_format: json_void_latency
        spark_single_reader: true
        spark_parallelism: 24
        spark_max_bytes_per_trigger: 67108864

_axis_n: &n_x
  label: "concurrent sources/queries"
  parameter: num_queries
  values: [1000]

_y: &mbps_y { metric: throughput_mbps, label: "Aggregate throughput (MB/s, csv input bytes)" }

variants:
  - name: mix
    description: "Heterogeneous 10-query mix, csv->json, N=1000 max-scale stress point"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *n_x, series: *engines }
    y: *mbps_y
    visualization: { type: line_chart }
