experiment:
  name: pin_pool_w4
  description: >
    Idea 2: reproduce the smaller-pool-is-better effect (§15) at LOW thread count,
    then layer thread pinning to test the interaction with CCX cache-sharing. W=4/IO=1
    => pinned, all 5 threads sit in CCX0 (cores 0-5) sharing one 32 MB L3 (see
    pin_w4.yaml for topology). HYPOTHESIS: the producer->worker handoff stays L3-
    resident only if the ACTIVE buffer working set fits the 32 MB L3, so pinning should
    help MOST at a SMALL pool and less at a large pool (working set spills to DRAM
    regardless). Pool x128 KiB: 128=16 MB, 256=32 MB(=CCX L3), 1024=128 MB, 4096=512 MB
    (§15 optimum), 16384=2 GB, 65536=8.59 GB(default, §15 worst).

    bid passthrough, File (warm, repeat 4). PREDICTIONS: (a) pin OFF reproduces the
    §15 curve (peak ~512 MB, falloff at 8.59 GB); (b) pin ON > OFF everywhere at W=4
    (idea-1 showed +13% at 512 MB), with the LARGEST pin gain at small pools (128/256
    fit CCX0 L3); (c) pin may shift the optimum SMALLER (small pool + pin = full L3
    residency). NOTE: pinned uses 1 of 4 CCX (single-source passthrough = one producer,
    not the multi-producer bandwidth-split that hurt pinning at W=16).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 4
    mode: burst
    rate: 1000000

variants:
  - name: pin_pool_w4
    description: "W=4 IO=1 passthrough, pool sweep x pin_threads"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "Buffer pool (buffers x 128 KiB)"
        parameter: worker.number_of_buffers_in_global_buffer_manager
        values: [128, 256, 1024, 4096, 16384, 65536]
      series:
        label: "pin_threads"
        explicit:
          - name: "off"
            baseline: true
            overrides: {worker.query_engine.pin_threads: false}
          - name: "on"
            overrides: {worker.query_engine.pin_threads: true}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart, x_scale: log}
