# SPDX-License-Identifier: Apache-2.0
experiment:
  name: json_csv_query_spectrum_smoke
  description: >
    Correctness gate + aggregation VIABILITY probe for json_csv_query_spectrum. Checksum sink (hashes
    tuple VALUES, format-independent) over all 5 queries x 4 arms, 1 rep. For each query the 4 arms
    (csv->csv, csv->json, sjson->csv, sjson->json) must agree -- value-identical across BOTH input and
    output. Also confirms the windowed agg (bid_json_agg, SUM(price)) actually runs on this branch (window
    aggs have crashed here before); if the agg arm errors/crashes, drop the agg_sum variant from the perf run.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_csv_query_spectrum_smoke.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Checksum
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "checksum smoke" }

_arm_series: &arm_series
  label: "arm"
  explicit:
    - name: csv_c2c
      baseline: true
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
    - name: csv_c2j
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
    - name: sjson_j2c
      overrides:
        data_size: large
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: CSV }
    - name: sjson_j2j
      overrides:
        data_size: large
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: JSON }

variants:
  - name: passthrough
    query: nexmark/bid_json_passthrough
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: star
    query: nexmark/bid_json_star
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2_filter
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q1_compute
    query: nexmark/bidstr_iso_q1
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: agg_sum
    query: nexmark/bid_json_agg
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
