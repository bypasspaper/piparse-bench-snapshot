experiment:
  name: compiled_pushdown_vs_materializeall_native
  description: 'Isolate projection pushdown: COMPILED formatter in BOTH arms (no JIT-vs-interpreted
    confound), NATIVE output (parse-only, no serialize artifact). x=fields accessed
    K=1..10 on fixed 10-FLOAT64 nf10.csv. ''pushdown'' = project K (LLVM DCEs unused
    -> parse K); ''materialize all'' = the K=10 point = project all 10 (parse 10,
    flat). Both compiled -> converge to EXACTLY 1x at K=10.'
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  completion_timeout_s: 300
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter:
      type: SequentialCSV
      threading_mode: sequential
    input_parser:
      f64: EiselFloatF64
    output_formatter:
      type: NATIVE
    output_parser:
      f64: ZMIJF64
  generator:
    repeat: 20
    mode: burst
    rate: 1000000
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072
variants:
- name: pushdown
  description: compiled vs uncompiled formatter across N=1..10 fields, project c0,
    csv->json
  queries:
  - multicol/projK_k1
  - multicol/projK_k2
  - multicol/projK_k3
  - multicol/projK_k4
  - multicol/projK_k5
  - multicol/projK_k6
  - multicol/projK_k7
  - multicol/projK_k8
  - multicol/projK_k9
  - multicol/projK_k10
  axes:
    x:
      label: source fields N
      explicit:
      - name: sweep
        baseline: true
        overrides: {}
    series:
      label: formatter
      explicit:
      - name: compiled
        baseline: true
        overrides: {}
  y:
    metric: throughput_mrows_s
    label: records/s
  visualization:
    type: grouped_bar
