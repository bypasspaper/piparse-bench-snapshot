# SPDX-License-Identifier: Apache-2.0
# Throwaway: W1 profiling pair for q2_original csv vs csv_overload (user challenge to the
# "parse is free" reading). 1 rep each, repeat 4 (~26s windows). perf attached externally.
experiment:
  name: _q2o_w1prof
  description: "probe: q2_original W1 profile pair"
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int32: FastINT32
      f64: EiselFloatF64
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 4
variants:
  - name: q2o_w1prof
    query: nexmark/q2_original
    axes:
      x:
        label: "worker threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [1]
      series:
        label: "arm"
        explicit:
          - name: csv_optimized
            baseline: true
            overrides: {}
          - name: csv_overload
            overrides:
              overload: true
    y: { metric: processing_time_s, label: "Processing time (s)" }
