# SPDX-License-Identifier: Apache-2.0
experiment:
  name: shredder_2k_multisource_recovery
  description: >
    Does the CCX-CELL design recover the 2KiB collapse? The single-source collapse is cross-CCX
    coherence of ONE shared shredder touched by workers on all 4 CCX. Fix hypothesis: stripe N
    sources across 4 CCX cells (pin_threads + ccx_aware_task_queues + shared source pools) so each
    source's shredder is touched ONLY by its cell's intra-CCX workers -> coordination stays on-CCX,
    no fabric bounce. bid CSV->CSV passthrough, InMemory prefill, 2KiB. x = num_queries (= N sources).
    Two series: ccx-cells ON vs OFF (both multi-source). If ON's AGGREGATE throughput scales with N
    while OFF plateaus, the CCX-cell localization is the recovery. W16 (leaves cores for N sources).
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_2k_multisource_recovery.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 128
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 10
    NES_TASKQUEUE_STATS: 1
    NES_INMEM_BUFSIZE: 2048

variants:
  - name: multisource
    description: "2KiB bypass: N sources striped across CCX cells (ON) vs no cells (OFF)"
    query: nexmark/bid_pass_scaling
    axes:
      x:
        label: "concurrent sources (num_queries)"
        parameter: num_queries
        values: [4]
      series:
        label: "placement"
        explicit:
          - name: ccx_cells_on
            baseline: true
            overrides:
              worker.query_engine.pin_threads: true
              worker.query_engine.ccx_aware_task_queues: true
              worker.ccx_shared_source_pools: true
    y:
      metric: throughput_mbps
      label: "Aggregate Throughput (MB/s)"
    visualization:
      type: line_chart
