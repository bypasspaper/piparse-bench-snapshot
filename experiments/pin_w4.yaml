experiment:
  name: pin_w4
  description: >
    Idea 1: does the engine's NAIVE pin_threads HELP at LOW thread count? The prior
    pinning test (handover memory) found pin_threads HURTS at high thread count
    (W=16: 8 producers packed onto ~1.3 CCX -> halves bandwidth). But at W=4/IO=1 the
    5 threads land within ONE CCX, fostering IO->worker cache-sharing instead of
    contention. TOPOLOGY (Threadripper PRO 5965WX): 4 CCX, each 32 MB L3 over 6 cores
    (CCX0=0-5, CCX1=6-11, CCX2=12-17, CCX3=18-23). pin_threads pins thread i to core i
    sequentially; workerOffset=numIOThreads. So IO=1/W=4 pinned => IO@core0 +
    workers@1-4 = ALL in CCX0 -> producer->worker buffer handoff stays in the shared
    32 MB L3 (no DRAM round-trip). Unpinned, the scheduler spreads them across CCX so
    the handoff round-trips through DRAM/Infinity-Fabric.

    bid passthrough, File (warm, repeat 4), pool 4096 (512 MB §15 optimum), 128 KiB.
    PREDICTION: pin ON >= OFF here (handoff L3-resident); effect may be modest because
    the 512 MB pool's working set exceeds the 32 MB L3 -- pin_pool_w4.yaml sweeps pool
    to find where pinning helps most (small pool that fits CCX L3). NOTE: pinned uses
    only 1 of 4 CCX (5 cores); fine for a single-source passthrough (one producer, not
    the multi-producer bandwidth-splitting case that hurt at W=16).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 4
    mode: burst
    rate: 1000000

variants:
  - name: pin_w4
    description: "W=4 IO=1 passthrough, pin_threads on/off"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "pin_threads"
        explicit:
          - name: "off"
            baseline: true
            overrides: {worker.query_engine.pin_threads: false}
          - name: "on"
            overrides: {worker.query_engine.pin_threads: true}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
