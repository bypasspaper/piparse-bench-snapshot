# SPDX-License-Identifier: Apache-2.0
experiment:
  name: batch_checksum_gate
  description: >
    CORRECTNESS gate for source-emit batching. Same query, Checksum sink, InMemory PREFILL @4K (so batching
    IS active -- File sources are non-prefill and gated to capacity 1, which would make the A/B vacuous),
    W24 (max concurrency stress), series = NES_SOURCE_EMIT_BATCH {1, 32}. The [checksum] count,checksum lines
    MUST be IDENTICAL between the two arms per query -- batching changes task-admission timing/order but NOT
    sequence numbers, so the sequence-ordered sink output must be byte-identical. Tested on varsized/spanning
    (bigstr_id_pass) AND numeric (bid_pass_scaling). Any divergence = a batching correctness bug
    (double-decrement, dropped/duplicated task, mis-ordered publish).
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/batch_checksum_gate.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Checksum
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 1
    NES_INMEM_BUFSIZE: 4096
    NES_LOG_LEVEL: WARNING

_series: &batch_series
  label: "source emit batch"
  explicit:
    - name: batch1
      baseline: true
      overrides:
        worker_env.NES_SOURCE_EMIT_BATCH: "1"
    - name: batch32
      overrides:
        worker_env.NES_SOURCE_EMIT_BATCH: "32"

_axes_x: &w24_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [24]

_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }

variants:
  - name: bigstr_id_varsized
    query: formatter/bigstr_id_pass
    axes: { x: *w24_x, series: *batch_series }
    y: *time_y
  - name: bid_numeric
    query: nexmark/bid_pass_scaling
    axes: { x: *w24_x, series: *batch_series }
    y: *time_y
