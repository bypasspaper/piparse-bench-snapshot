# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_r3eager_q2og_irdump
  description: >
    IR-DUMP probe (2026-10-05): does the JIT delete the EAGER parses of fields q2og never uses
    (timestamp, bidder, channel, url)? r3_eager (v7 ladder footing: SequentialCSV + eager_parse, JSON out,
    fast parsers, default invoke / no inline / no tcb, W1 InMemory, pin) and r3 (lazy) as the control, on
    bidstr_q2og, 1 rep each, dump_compilation_result FILE. Read: count surviving parse/materialise calls per
    field in the post-optimisation IR. If the unused fields are gone, r3_eager is NOT a parse-all rung and the
    r2->r3_eager bar bundles projection pushdown (-> add an eager sink knob and a true parse-all rung).
    RUN: cd ~/work/piparse-bench && pkill -9 -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_r3eager_q2og_irdump.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: FILE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      bool: TracedBOOL
      f64: EiselFloatF64
      f32: EiselFloatF32
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 1
    NES_INMEM_BUFSIZE: 131072
_x: &x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: ["1"]
_arms: &arms
  label: "rung"
  explicit:
    - name: r3_eager
      baseline: true
      overrides:
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false, eager_parse: true }
    - name: r3_lazy
      overrides:
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
variants:
  - name: q2og
    query: nexmark/matrix/bidstr_q2og
    axes: { x: *x, series: *arms }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: grouped_bar }
