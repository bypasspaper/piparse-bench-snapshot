# SPDX-License-Identifier: Apache-2.0
experiment:
  name: hl7_band_fif_bid
  description: >
    Post-optimization re-measure (session 2026-07-31) of the SIMDHL7 input rows of
    hl7_matrix_bid (passthrough) + hl7_matrix_bid_q1q2 (q2 filter, q1 compute) after the HL7
    single-band FIF landed: branchless simdjson-style event flatten into one position band +
    custom Hl7FieldIndex reading it in place with a fixed stride (replaces the pending-vector +
    FieldOffsets double-emit; profiled at 66% of the worker thread on q2).
    BASELINES (2026-07-30, same config, n=5 median, MB/s on input bytes . Mrows/s):
      passthrough: ->CSV 1641 . 9.0 | ->HL7 1584 . 8.7 | ->JSON 1508 . 8.2
      q2 filter:   ->CSV 1943 . 10.6 | ->HL7 1966 . 10.8 | ->JSON 1954 . 10.7
      q1 compute:  ->CSV 1477 . 8.1 | ->HL7 1410 . 7.7 | ->JSON 1466 . 8.0
    Reference rails (unchanged this session): SchemaJSON q2 15.2 Mrows/s, SIMDCSV q2 28.5.
    GOTCHA: bid URLs contain '&' -> subcomponent_delimiter '' (leaf arity 22). W1 fnattr
    fullopt, 128KiB, warm, Monitoring sink, n=5 median. 31.3M rows, hl7 file 5.72GB.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/hl7_band_fif_bid.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: hl7
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDHL7, subcomponent_delimiter: "" }
    output_formatter: { type: CSV }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s, input bytes)" }

_out_series: &out_series
  label: "output"
  explicit:
    - name: to_csv
      baseline: true
      overrides: { query_config.output_formatter: { type: CSV } }
    - name: to_json
      overrides: { query_config.output_formatter: { type: JSON } }
    - name: to_hl7
      overrides: { query_config.output_formatter: { type: HL7, segment_name: BID } }

variants:
  - name: pass_hl7_in
    description: "passthrough, SIMDHL7 band-FIF input -> {CSV,JSON,HL7} out"
    query: nexmark/bid_hl7_passthrough
    axes: { x: *noop_x, series: *out_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2_hl7_in
    description: "q2 filter, SIMDHL7 band-FIF input -> {CSV,JSON,HL7} out"
    query: nexmark/bid_hl7_q2
    axes: { x: *noop_x, series: *out_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q1_hl7_in
    description: "q1 compute, SIMDHL7 band-FIF input -> {CSV,JSON,HL7} out"
    query: nexmark/bid_hl7_q1
    axes: { x: *noop_x, series: *out_series }
    y: *tput_y
    visualization: { type: grouped_bar }
