experiment:
  name: cold_iouring_bufsize
  description: >
    Close the O_DIRECT cold gap 5.9 -> 6.7 via the FIRST remaining lever: bigger
    operator_buffer_size (fewer/bigger reads -> fewer per-buffer source-thread iterations,
    AND bigger O_DIRECT reads are more device-efficient). O_DIRECT IoUringFile, QD64 (the
    §29 plateau knee), cold bid_6GB passthrough, W=4/IO=1, median n=3. Sweep
    operator_buffer_size 128 KiB -> 1 MiB (the source's read size = bufferProvider->getBufferSize()).

    Context: §29 found O_DIRECT plateaus ~5.9 GB/s from QD32-128 = the SINGLE source thread's
    per-buffer reap/emit loop (~45k iters/s at 128 KiB), NOT the device (86% of the 6.9 cap).
    If that's a FIXED per-buffer cost, doubling the buffer halves the iteration rate and
    throughput should climb toward the device cap.

    PREDICTION:
    - RISES toward ~6.7 with buffer size -> confirms fixed-per-buffer thread overhead; pick the
      knee. (Then batched cqe reaping is unnecessary.)
    - FLAT ~5.9 -> the limit is NOT per-buffer iteration count (it's the device sequential
      O_DIRECT cap here, or the emit/pipeline) -> bigger buffers won't help and batched reaping
      won't either; 5.9 is the real single-thread O_DIRECT ceiling.
    - DROP at 1 MiB -> working-set/cache pressure on the workers (pool 4096 x 1 MiB = 4 GB).

    ⚠️ pool stays 4096 buffers, so total pool memory scales with buffer size (1 MiB -> 4 GB, fits
    64 GB). QD64 x bufsize in flight (1 MiB -> 64 MiB). Keeps the §15 large-pool caveat in mind but
    cold O_DIRECT reads aren't cache-resident anyway. Needs worker built with liburing+O_DIRECT.
    Sandbox OFF (:8080).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64

variants:
  - name: cold_iouring_bufsize
    description: "COLD O_DIRECT IoUringFile QD64, sweep operator_buffer_size"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "operator_buffer_size (bytes)"
        parameter: worker.default_query_execution.operator_buffer_size
        values: [131072, 262144, 524288, 1048576]
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart, x_scale: log}
