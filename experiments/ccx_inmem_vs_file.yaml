experiment:
  name: ccx_inmem_vs_file
  description: >
    Test "InMemory prefill should be strictly better than File" for the CCX-cell CSV projection
    passthrough. Same config as prof_ccx_cell_pools (bid_passthrough 4-int, 8io+16w striped CCX
    cells, pin+ccx_aware_task_queues, 128 KiB, TracedUINT64/INT32) but source_type=InMemory with
    NES_INMEM_PREFILL. Prefill sources are scoped OUT of the shared cell pools (preFillsBuffers())
    so they rely on pin + ccx-queue localization + pre-pinned reused buffers (no read copy). File
    baseline hit ~38-40 GB/s (cell_pools). InMemory should meet or exceed it (no _copy_to_iter).
    N in {8,16} only (prefill holds N copies of bid_1GB in RAM: N=16 ~17 GB). y = aggregate MB/s
    (multiply is NOT needed -- pbench sums; NES_INMEM_REPEAT=6 gives the window, reported/REPEAT).
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ccx_inmem_vs_file.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 180000
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 40
  worker_env:
    NES_TASKQUEUE_STATS: 1
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 40
    NES_INMEM_BUFSIZE: 131072

variants:
  - name: inmem_ccx
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "Concurrent Sources"
        parameter: num_queries
        values: [8, 16]
      series:
        label: "source"
        explicit:
          - name: inmem_prefill
            baseline: true
            overrides: {}
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }
    visualization: { type: line_chart }
