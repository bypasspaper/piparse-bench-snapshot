# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_q2o_parser
  description: >
    q2_original at FULL-OPT PARALLEL (W16, SIMDCSV, File, fnattr+inline+tcb, ccx-aware queues),
    JSON output. 2x2: {FastINT32, TracedINT32} x {overload on, off}, to answer "is the traced int
    parser faster here". CROSS-CHECK the expected mechanism:
      - overload ON: the INT filter is lazy constantEq (raw-byte memcmp vs rendered constant) and
        SELECT auctionId is passthrough -> the int PARSER is off the hot path, so fast==traced
        expected (this pair also tells us if we're at the ~11 GB/s read wall).
      - overload OFF: each of the 5 OR-terms PARSES auctionId. With input_parse DISABLED (shipped
        default) FastINT32 is an opaque fnattr-attributed call GVN-merges to ONE; TracedINT32 is
        inlined SWAR (5 un-mergeable loop nests). So FastINT32 predicted FASTER on q2o here despite
        traced being cheaper per-parse in the past -- q2o's 5 IDENTICAL parses reward the dedup.
    Output is JSON (output_formatter JSON + ZMIJF64/F32), matching the ladder's new target format.
    Medium bid_1GB, repeat 40, 3 reps, port 9099. overload in the RUNG override (validation trap:
    overload:true in defaults trips the stale 'requires branch benchmark-piparse-lazyparse' rule).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: {}
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 40

# int32 is the only knob that differs between the fast/traced parser sets; everything else identical.
_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_traced_parsers: &traced_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: TracedINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32

_arms: &arms
  label: "parser x overload"
  explicit:
    - name: fast_overload
      baseline: true
      overrides:
        query_config.input_parser: *fast_parsers
        overload: true
    - name: traced_overload
      overrides:
        query_config.input_parser: *traced_parsers
        overload: true
    - name: fast_noverload
      overrides:
        query_config.input_parser: *fast_parsers
        overload: false
    - name: traced_noverload
      overrides:
        query_config.input_parser: *traced_parsers
        overload: false

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

variants:
  - name: nx_q2_original
    description: "Q2 paper 5-way OR, full-opt parallel JSON, parser A/B"
    query: nexmark/q2_original
    axes: { x: *noop_x, series: *arms }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: grouped_bar }
