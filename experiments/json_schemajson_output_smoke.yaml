experiment:
  name: json_schemajson_output_smoke
  description: >
    CORRECTNESS GATE for json_schemajson_output_matrix. Checksum sink, reps=1. Same four arms
    (on-demand JSON vs SchemaJSON) x (JSON out, CSV out) x (passthrough, star). GATE: for EACH
    (query, output-format) pair the SchemaJSON checksum+count MUST equal the on-demand JSON one.
    This is the decisive test that SchemaJSON's LAZY varsized passthrough (raw JSON string interior,
    quotes stripped via ptr+1/size-2, escapes left literal) re-serialises byte-identically to
    on-demand JSON's materialised get_string path -- i.e. that the raw-forward fast-path handles the
    varsized fields correctly on this dataset (bid channel/url are escape-free, comma-free strings).
    A mismatch on j2j would flag double-quoting / escaping; a mismatch on j2c would flag stray quotes.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_schemajson_output_smoke.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Checksum
    input_formatter: { type: JSON }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_time_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }

_fmt_series: &fmt_series
  label: "in->out"
  explicit:
    - name: jin_j2j
      baseline: true
      overrides:
        query_config.input_formatter: { type: JSON }
        query_config.output_formatter: { type: JSON }
    - name: sjson_j2j
      overrides:
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: JSON }
    - name: jin_j2c
      overrides:
        query_config.input_formatter: { type: JSON }
        query_config.output_formatter: { type: CSV }
    - name: sjson_j2c
      overrides:
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: CSV }

variants:
  - name: passthrough
    description: "bid passthrough checksum, JSON in -> {JSON,CSV} out, on-demand vs SchemaJSON"
    query: nexmark/bid_json_passthrough
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: star
    description: "bid SELECT * checksum, JSON in -> {JSON,CSV} out, on-demand vs SchemaJSON"
    query: nexmark/bid_json_star
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
