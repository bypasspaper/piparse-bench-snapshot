# SPDX-License-Identifier: Apache-2.0
experiment:
  name: nes_naive_flink_spark_lowN_fine
  description: >
    FINE low-N sweep for the THREE remaining arms (Naive, Flink, Spark) on the user's chosen
    log-spaced 22-point grid N=[1,2,3,4,5,6,8,10,13,16,20,25,32,40,45,50,56,63,71,79,89,100] --
    dense on the ramp, spread over the plateau. Native + SIMD already have every one of these N
    (from their steps-of-1 runs nes_{native,simd}_scaling_lowN_fine) -> subset those for the 5-arm
    figure. Same 10-query stateless bidstr mix, round-robin over N sources (query_mix). Metric =
    aggregate throughput (records/s via bytes-per-row) + per-batch p99 latency.
      - NES-Naive: SequentialUncompiledOldCSV (interpreted) -> JSONUncompiled, W16, ccx OFF, no
        shared pools, BlockingFile, original stod/stringstream codecs.
      - Flink: latency_json (real JSON encoder + per-readBatch nanoTime), streaming, 1 slot/pipeline.
      - Spark: json_void_latency + custom file-microbatch-csv source @ 64 MiB (real per-batch
        latency), 24 cores, tmpfs checkpoint.
    PRE-FLIGHT: pkill -x main; flink-ext + spark-ext jars built; warm bid_strings_3GB.csv; pyspark;
    --worker-port 9099. RUN: PBENCH_FLINK_TIMEOUT=1800 PBENCH_SPARK_TIMEOUT=1800 PBENCH_KEEP_LOGS=1.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  query_mix:
    - nexmark/matrix/bidstr_q0
    - nexmark/matrix/bidstr_qproject
    - nexmark/matrix/bidstr_qroute
    - nexmark/matrix/bidstr_q1
    - nexmark/matrix/bidstr_q2og
    - nexmark/matrix/bidstr_q2mod
    - nexmark/matrix/bidstr_q10
    - nexmark/matrix/bidstr_q14
    - nexmark/matrix/bidstr_q22
    - nexmark/matrix/bidstr_qex
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 192
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_MMAP_POPULATE: '1'

_series_arms: &arms
  label: "engine"
  explicit:
    - name: NES-Naive
      baseline: true
      overrides:
        worker.query_engine.number_of_worker_threads: 16
        worker.query_engine.ccx_aware_task_queues: false
        worker.query_engine.pin_threads: false
        worker.ccx_shared_source_pools: false
        worker.number_of_buffers_in_global_buffer_manager: 65536
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: sequential }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker_env:
          NES_INPUT_CODEC: original
          NES_OUTPUT_CODEC: original
    - name: Flink
      system: flink
      overrides:
        mode: flink
        flink_execution_mode: streaming
        flink_output_format: latency_json
    - name: Spark
      system: spark
      overrides:
        mode: spark
        spark_output_format: json_void_latency
        spark_source: file-microbatch-csv
        spark_batch_bytes: 67108864
        spark_parallelism: 24

_axis_n: &n_x
  label: "concurrent sources/queries"
  parameter: num_queries
  values: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16, 20, 25, 32, 40, 45, 50, 56, 63, 71, 79, 89, 100]

_y: &tput_y { metric: throughput_mbps, label: "Aggregate throughput (MB/s)" }

variants:
  - name: mix
    description: "Naive + Flink + Spark, 10-query stateless mix, fine 22-pt low-N grid"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *n_x, series: *arms }
    y: *tput_y
    visualization: { type: line_chart }
