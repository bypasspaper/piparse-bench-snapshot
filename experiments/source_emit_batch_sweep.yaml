experiment:
  name: source_emit_batch_sweep
  description: >
    Source-emit BATCHING sweep. New knob NES_SOURCE_EMIT_BATCH=K: the single InMemory-prefill source queues
    K per-buffer tasks into the admission queue UNPUBLISHED, then one counting_semaphore.release(K) wakes K
    workers in a burst (vs K separate notifies). Goal: flip the 4 KiB single-source stream from EMITTER-bound
    (~3 GB/s, DataSrc pegged) to WORKER-bound so 4K throughput rises AND burst concurrency exposes the
    SequenceShredder. SELECT id (8-byte output, no varsized copy) so the shredder is isolated from output.
    Single-source InMem prefill, W24, 4 KiB. x = batch size K.
    SUCCESS = throughput rises with K (emitter no longer the wall). Cross-check NES_TASKQUEUE_STATS dtor line
    in worker.log: avgDepthOnFastAcquire ~1 = emitter-bound (K=1), >>1 = worker-bound (batching worked).
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/source_emit_batch_sweep.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 262144
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 200000
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 40
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 40
    NES_INMEM_BUFSIZE: 4096
    NES_LOG_LEVEL: WARNING
    NES_TASKQUEUE_STATS: 1
variants:
  - name: batch
    query: formatter/bigstr_id_pass
    axes:
      x:
        label: "source emit batch size (K)"
        parameter: worker_env.NES_SOURCE_EMIT_BATCH
        values: ["1", "4", "8", "16", "32"]
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: line_chart }
