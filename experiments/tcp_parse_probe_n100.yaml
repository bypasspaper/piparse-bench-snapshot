experiment:
  name: tcp_parse_probe_n100
  description: >
    CONFIG PROBES for the TCP edition of the source-parse scaling study (q1, async compiled
    vs blocking uncompiled-in-connection-thread). Purpose: settle the thread budget BEFORE
    the N=1..100 sweep, and smoke-test the never-run BlockingTCP + SequentialUncompiledCSV
    combination (sequential carry logic must survive TCP chunk framing).

    METHOD (TCP_COLLAPSE_MECHANISM.md core-budget recipe, PHYSICAL CORES ONLY, so numbers
    are comparable to its section-6 passthrough curve): ENGINE tasksetted to cores 0-13
    (14 cores), GENERATOR = async-tcp-generator with a FIXED 10-thread tokio pool
    tasksetted to cores 14-23 (10 cores). One SHARED generator process, one in-RAM copy of
    bid_1GB, -n N clients released together, -m 6 passes (repeat-6 window), chunk 128 KB,
    unthrottled. (independent per-query generators would need N x 1GB RAM -> OOM at 100.)

    ARMS (all N=100, 1 rep; plus a blocking N=1 smoke first):
      async_io8_w14 = source TCP (asio) + SIMDCSV + Traced/Eisel in + JIT CSV/ZMIJ out,
                      io=8, w=14 -- the EXACT section-6 async arm (22 threads on 14 cores).
      async_io6_w8  = same, io=6, w=8 -- the strict budget-matched arm (14 threads on 14
                      cores; section-5 proved it == io8/w14 for PASSTHROUGH, but q1 puts
                      real parse+output on the workers, so equivalence may break).
      blocking_w14  = source BlockingTCP (1 OS thread per connection) +
                      SequentialUncompiledCSV parsing INTERPRETED in the connection thread
                      + CSVUncompiled out, w=14 (downstream only).

    PREDICTIONS (write before running):
      - smoke (blocking N=1): ~0.35-0.5 GB/s -- the interpreted source-thread ceiling from
        the file study (444 MB/s), minus a little for the inline recv copy. If it CRASHES
        or corrupts, the sequential carry logic has a TCP-framing bug (file buffers are
        block-aligned, TCP recv chunks are arbitrary).
      - async_io8_w14 @100: ~8-10.5 GB/s. File q1 sustains ~0.7 GB/s/worker -> 14 workers
        ~= 10 GB/s ceiling; section-6 passthrough async @100 was 9.8. Latency p50 few ms.
      - async_io6_w8 @100: WORKER-BOUND ~5-6.5 GB/s (8 x 0.7) -- the passthrough
        equivalence should BREAK on q1. If it does NOT (also ~9-10), q1-over-TCP is
        recv/supply-bound, not worker-bound, and the cheaper budget is fine.
      - blocking_w14 @100: 100 parse-hungry connection threads + 14 workers on 14 cores =
        8x oversubscription of ALWAYS-RUNNABLE threads (unlike passthrough's parked recv
        threads which held 9.4 at 100). Expect degradation ALREADY at 100: ~2-5 GB/s, p50
        tens of ms, possibly TCP-backpressure flooring (generator CPUs go idle). The
        passthrough knee was at 150; interpreted parse should pull it to or below 100.

    GOTCHAS (load-bearing):
      - PIN BOTH SIDES (worker_cpus + generator.cpus, disjoint) -- unpinned TCP numbers
        are confounded by generator placement (cross-CCX skb transfer).
      - `pkill -x main` AND `pkill -x async-tcp-gener` (15-char comm truncation) between
        runs; never pkill -f with a self-matching pattern.
      - Generator loads the file BEFORE binding; runner syncs on "Listening on". Do NOT
        probe the port -- it consumes a client slot and the probe's connection steals data.
      - Loopback latency ABSOLUTES carry the recv-wait confound -- trust shape and the
        async-vs-blocking contrast, not the microseconds.
      - Arms run sequentially -> thermal drift possible between arms (alternate-arms
        gotcha); probes are short so exposure is small, but do not over-read <5% deltas.
      - Requires the uncompiled-formatter sourceCreationTimestamp fix (2026-07-06, in tree)
        and the pbench runner taskset/async-generator extension (same day).
      - Run with --generator-bin ~/work/piparse-bench/generator/target/release/async-tcp-generator

    RESULTS (2026-07-07, 1 rep each, 0 failures):
      smoke blocking N=1: 406.6 MB/s, p50 0.5 ms -- prediction hit (file ceiling 444 minus
        recv copy); SequentialUncompiledCSV survives TCP chunk framing. Combination WORKS.
      async_io8_w14 @100: 7843 MB/s, p50 16.9 / p99 24.6 / p999 45.1 ms. Slightly under the
        8-10.5 band; consistent with ~2 cores of recv leaving ~12 effective worker-cores
        (12 x ~0.65 GB/s). p50 milliseconds not sub-ms like file -- loopback recv-wait
        confound + only 14 workers; trust contrasts, not absolutes.
      async_io6_w8 @100: 6420 MB/s (-18%) -- the section-5 passthrough equivalence BREAKS
        on q1 as predicted (worker-bound: q1 puts real parse+output on workers).
      blocking_w14 @100: 2857 MB/s, p50 49.7 / p99 69.1 ms -- heavy degradation ALREADY at
        N=100 (passthrough blocking held 9.4 GB/s here): interpreted parse makes connection
        threads always-runnable, pulling the collapse threshold below 100 (passthrough knee
        was 150). Prediction band 2-5 hit.
      CONFIG VERDICT for the sweep: async = io8/w14 (clear winner, and symmetric w14 with
      the blocking arm); blocking = w14; gen = 10 threads on cores 14-23; engine 0-13.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  completion_timeout_s: 900
  worker_cpus: "0-13"
  worker:
    query_engine:
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    sink_type: Monitoring
  generator:
    kind: async
    cpus: "14-23"
    threads: 10
    chunk_size_kb: 128
    repeat: 6
    rate: 1000000

variants:
  - name: smoke_blocking_n1
    description: "SMOKE: BlockingTCP + SequentialUncompiledCSV at N=1 (first-ever run of this combination)"
    query: nexmark/q1_price
    axes:
      x:
        label: "smoke"
        explicit:
          - name: blocking_n1
            overrides:
              num_queries: 1
              worker.query_engine.number_of_worker_threads: 14
              worker.query_engine.number_of_io_threads: 4
              query_config.source_type: BlockingTCP
              query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: sequential }
              query_config.output_formatter: { type: CSVUncompiled }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: bar_chart }

  - name: probe_n100
    description: "N=100 config probes: async io8/w14 vs io6/w8 vs blocking w14"
    query: nexmark/q1_price
    axes:
      x:
        label: "arm"
        explicit:
          - name: async_io8_w14
            baseline: true
            overrides:
              num_queries: 100
              worker.query_engine.number_of_worker_threads: 14
              worker.query_engine.number_of_io_threads: 8
              query_config.source_type: TCP
              query_config.input_formatter: { type: SIMDCSV }
              query_config.input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
              query_config.output_formatter: { type: CSV }
              query_config.output_parser: { f64: ZMIJF64 }
          - name: async_io6_w8
            overrides:
              num_queries: 100
              worker.query_engine.number_of_worker_threads: 8
              worker.query_engine.number_of_io_threads: 6
              query_config.source_type: TCP
              query_config.input_formatter: { type: SIMDCSV }
              query_config.input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
              query_config.output_formatter: { type: CSV }
              query_config.output_parser: { f64: ZMIJF64 }
          - name: blocking_w14
            overrides:
              num_queries: 100
              worker.query_engine.number_of_worker_threads: 14
              worker.query_engine.number_of_io_threads: 4
              query_config.source_type: BlockingTCP
              query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: sequential }
              query_config.output_formatter: { type: CSVUncompiled }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: bar_chart }
