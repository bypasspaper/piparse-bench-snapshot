# SPDX-License-Identifier: Apache-2.0
experiment:
  name: prof_proj_k1
  description: >
    PROFILING window for proj_k1 (parse 1, output ONLY c0 — strict projection, 1997 MB/s). Single query, InMemory prefill seq W1, inlined Eisel+ZMIJ, repeat=500
    (~50-110s warm steady window) so nes-profile.sh can attach on :8080 and sample 10s. Purpose: localize
    the ~2x proj-vs-parse gap at k=1 (my model: the parse_k extra ~68 ns/row is passthrough coalesced
    byte-copy + 16-wide output framing; profiling should show __memmove/memcpy + output-format symbols in
    parse_k1 that are ABSENT in proj_k1). Not a throughput measurement (repeat inflates nothing; ignore MB/s).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 180
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: sequential}
    input_parser: {f64: EiselFloatF64}
    output_formatter: {type: CSV}
    output_parser: {f64: ZMIJF64}
  generator:
    repeat: 500
    mode: burst
    rate: 1000000
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 500
    NES_INMEM_BUFSIZE: 131072

variants:
  - name: proj_k1_prof
    description: "parse k of 16 float cols (rest passthrough), InMemory-prefill seq W1, inlined codec"
    query: multicol/proj_k1
    axes:
      x:
        label: "fields parsed (of 16)"
        explicit:
          - name: "sweep"
            baseline: true
            overrides: {}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
