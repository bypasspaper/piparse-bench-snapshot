experiment:
  name: shredder_fragments_n1024_throughput
  description: >
    N=1024 THROUGHPUT after the liveness close-out (2026-07-12): the 6.2 GB/s close-out number
    was a deliberate-overcommit liveness datapoint (256 src/cell on a 192 x 128 KiB pool = 0.75
    buf/src, untuned 5 ms retry slice, deployment-heavy window) - NOT the N=1024 ceiling. Two
    config-only arms restore >=1.5 buf/src at N=1024:
    (a) pool384_128k: 384 x 128 KiB = 48 MB/cell. Under the CLASSIC shredder, big pools lost
    throughput via L3 residency (pool 512 -> 19-21 GB/s) because pinned frontier buffers kept
    the WHOLE pool resident. Fragments do not pin: the resident set is the in-flight window,
    so the old penalty should shrink or vanish. PREDICT: >= 25-30 GB/s if residency law is
    repealed alongside the liveness law; ~20 GB/s if the spill penalty persists.
    (b) pool384_64k: 384 x 64 KiB = 24 MB/cell = SAME cell bytes as the plateau config
    (192 x 128 KiB), 1.5 buf/src via granularity. PREDICT: near-plateau minus per-buffer
    overhead (2x task rate); the constant-bytes comparison isolates granularity from residency.
    GOTCHAS: throughput metric is wall-span based and N=1024 deployment (~4-5 min) dilutes it -
    compare arms against the 6.2 close-out (same dilution), not against N=512's 39.8;
    operator_buffer_size is GLOBAL (64k arm shrinks pipeline buffers too);
    completion_timeout_s 1800; DIAG_SRCLIFE tallies must stay routine-end==spawned, destroyed=0.
    RESULTS (2026-07-12, both arms 1024/1024, zero silent deaths):
      pool384_128k: wall-span 23.9 GB/s, active-window median 27.9, peak 30.1, span 281 s
      pool384_64k : wall-span 29.9 GB/s, active-window median 34.4, peak 39.3, span 224 s
      (baseline pool192_128k overcommit: wall 6.1 / active 14.2 / peak 22.2, span 1081 s;
       reference N=512@192x128k: wall 39.2 / active 46.7, span 84 s)
    VERDICT: config alone recovers ~5x wall-span (6.1 -> 29.9). The 64K-at-constant-cell-bytes
    arm BEATS the big-128K-pool arm (34.4 vs 27.9 active) -> residency still matters with
    fragments (in-flight depth scales with available buffers), so hold ~24 MB/cell and shrink
    buffer granularity as fan-in grows. Remaining ~25% gap to N=512's active rate: per-buffer
    overhead at 64K (2x task rate), acquire-loop packing (5 ms blocking slice - async-timer
    wait is the next code lever), deployment interference. Active-window medians computed by
    uniform-rate reconstruction from Monitoring first-read/last-arrival stamps (peaks are
    approximate; compare medians).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 384
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  worker_env:
    NES_TASKQUEUE_STATS: 1
    NES_CELLPOOL_STATS: 1
  generator:
    repeat: 6

_axes_x: &n1024
  label: "Concurrent Queries (= Concurrent Sources)"
  parameter: num_queries
  values: [1024]

variants:
  - name: pool384_128k
    query: nexmark/bid_passthrough
    axes: { x: *n1024 }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }

  - name: pool384_64k
    query: nexmark/bid_passthrough
    overrides:
      worker.default_query_execution.operator_buffer_size: 65536
    axes: { x: *n1024 }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }
