# SPDX-License-Identifier: Apache-2.0
experiment:
  name: batch_nobp_probe
  description: >
    Probe: at K=32/4K, how much of the residual emitter cost is the per-buffer availableBuffer release closure
    (heap alloc + semaphore ops)? Baseline (nobp=0) = normal batching. probe (nobp=1) = skip backpressure +
    emit empty callback (inline reducer, no alloc, no semaphore). UNSAFE probe, emitter-bound prefill only.
    Delta = ceiling of a construction/backpressure restructure. bid numeric + bigstr varsized, W24, K=32.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/batch_nobp_probe.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 20
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 4096
    NES_LOG_LEVEL: WARNING
    NES_SOURCE_EMIT_BATCH: 32
    NES_TASKQUEUE_STATS: 1
_series: &nobp_series
  label: "backpressure"
  explicit:
    - name: normal
      baseline: true
      overrides: { worker_env.NES_SOURCE_NOBP_PROBE: "0" }
    - name: nobp_probe
      overrides: { worker_env.NES_SOURCE_NOBP_PROBE: "1" }
_x: &w24_x { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [24] }
variants:
  - name: bid_numeric
    query: nexmark/bid_pass_scaling
    axes: { x: *w24_x, series: *nobp_series }
    y: { metric: throughput_mbps, label: "MB/s" }
  - name: bigstr_varsized
    query: formatter/bigstr_id_pass
    axes: { x: *w24_x, series: *nobp_series }
    y: { metric: throughput_mbps, label: "MB/s" }
