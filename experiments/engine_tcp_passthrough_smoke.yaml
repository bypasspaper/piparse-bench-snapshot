experiment:
  name: engine_tcp_passthrough_smoke
  description: >
    Smoke test of the production e2e path through piparse-bench: reproduce rung-2b
    (single async TCP source, bid_6GB passthrough -> MonitoringSink) at the single
    operating point W=16 / IO=1 with the full fastest-config stack. Goal: validate
    that worker + nes-cli + TCP generator + MonitoringSink wire up and land in the
    expected ~5.2 GB/s band before sweeping. Companion handover: rung 2b in
    ~/Notes/nebulastream/benchmark/2_engine_to_e2e/.

    CORRECTED 2026-06-29: real single-source asio TCP throughput here is ~5.2 GB/s
    (3 clean reps 5087/5185/5577 MB/s, proc ~1.2s; cross-checked MonitoringSink CSV
    == generator send == per-rep print). The old "~2.3-2.5 GB/s band" was NEVER a
    real regime -- it was (a) stale pre-optimization rows (2026-06-26, proc ~3.0s,
    before lazy-elision + output-coalescing made this ~2.5x faster) PLUS (b) a pbench
    aggregation footgun: the `aggregated` view MEDIANs over ALL historical `runs`
    rows for a key (store.py GROUP BY has no run/timestamp/commit scoping), so a
    re-run's headline number is dragged toward stale history. The per-rep prints and
    the MonitoringSink CSVs are always correct; trust those, not the rolled-up
    `aggregated` number, until the view is run-scoped. At 5.2 GB/s the loopback is
    co-limited on BOTH ends (generator = 1 blocking write_all thread @ ~1.0 core;
    worker ~3.0 cores, %system ~130% = kernel recv-copy).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node

  # ── Fastest known worker config (handover §8 "FASTEST SETUP") ──
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr     # proxy inlining (+35-50%); now a real config, not a no-op
    default_query_execution:
      operator_buffer_size: 131072          # 128 KiB
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 65536

  # ── Query config: TCP source, MonitoringSink, SIMDCSV + traced-int parsers ──
  query_config:
    source_type: TCP
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
    input_parser:                           # fast traced integer parsers
      uint64: TracedUINT64
      int32: TracedINT32
      int64: TracedINT64
    output_formatter:
      type: CSV                             # lazy passthrough: output_format=CSV elides parse

  # ── TCP generator (piparse-bench generator/, burst, effectively unthrottled) ──
  # NOTE: total data per run MUST stay below the worker buffer pool
  # (number_of_buffers_in_global_buffer_manager * operator_buffer_size =
  # 65536 * 128 KiB = 8.59 GB). The MonitoringSink finalizes at EoS, so until
  # then in-flight buffers accumulate; if total > pool the source blocks on an
  # empty pool, stops draining the socket, and the generator's write deadlocks.
  # 1 x 6.44 GB < 8.59 GB pool -> fits. This is also the exact rung-2b setup.
  generator:
    repeat: 1                               # single 6.44 GB pass (rung-2b)
    mode: burst
    rate: 1000000                           # MB/s ceiling (well above achievable -> no throttle)

variants:
  - name: bid_passthrough_w16
    description: "rung-2b single point: bid_6GB TCP passthrough -> Monitoring, W=16 IO=1"
    query: nexmark/bid_passthrough

    axes:
      x:
        label: "Worker Threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [16]

    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"

    visualization:
      type: bar_chart
