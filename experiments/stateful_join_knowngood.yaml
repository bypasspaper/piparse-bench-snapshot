experiment:
  name: stateful_join_knowngood
  description: >
    Run the varsized nexmark joins through pbench with the engine's OWN known-good
    large-scale config (nes-systests/systest/CMakeLists.txt:107, the `large` group):
    pool=2,000,000 buffers x 4 KiB (=8 GB), W=4, slice_cache=true. Earlier runs
    failed because passthrough-tuned pools (4096-65536 x 128 KiB) are 30-500x too
    small: windowed-join/agg state is consumed by buffer COUNT (per-slice), not
    bytes -> stateful needs many SMALL buffers (opposite of passthrough's few big
    ones). Goal: confirm SUCCESS via the production path + first real stateful
    throughput numbers. q3 = auction JOIN person (varsized), q8 = person JOIN
    auction (varsized). File source, single pass. Companion: HANDOVER §15.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node

  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 4096            # engine default; stateful is count-bound
      execution_mode: COMPILER
      slice_cache:
        enable_slice_cache: true
    number_of_buffers_in_global_buffer_manager: 2000000   # 8 GB (= large-scale systest)

  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
    input_parser:
      uint64: TracedUINT64
      int32: TracedINT32
      int64: TracedINT64
      f64: EiselFloatF64
    output_formatter:
      type: CSV

  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: q3_auction_join_person
    description: "nexmark q3: auction JOIN person ON seller=personId, TUMBLING 10s"
    query: nexmark/q3_join
    axes:
      x:
        label: "Worker Threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [4]
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: bar_chart

  - name: q8_person_join_auction
    description: "nexmark q8: person JOIN auction ON id=seller, TUMBLING 10s"
    query: nexmark/q8_join
    axes:
      x:
        label: "Worker Threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [4]
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: bar_chart
