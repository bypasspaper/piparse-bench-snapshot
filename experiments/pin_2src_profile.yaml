experiment:
  name: pin_2src_profile
  description: >
    Long run, 2 File sources (num_queries=2) at IO=2/W=4 pinned, pool=256 (32MB=CCX0
    L3), for per-thread CPU profiling. 2 sources gave 12.6 GB/s (+47% over 1 source).
    Find the new bottleneck: are BOTH io threads now active, and are the 4 shared
    workers saturated (~100% = worker-bound, the +47%-not-2x limiter)?
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine: {pin_threads: true, number_of_io_threads: 2, number_of_worker_threads: 4, invoke_mode_configuration: fnattr}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 256
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 120, mode: burst, rate: 1000000}
variants:
  - name: pin_2src_profile
    description: "2 File sources, IO2/W4 pinned pool256, long run"
    query: nexmark/bid_passthrough
    axes:
      x: {label: "sources", parameter: num_queries, values: [2]}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
