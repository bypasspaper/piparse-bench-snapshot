experiment:
  name: nexmark_person_star_cold_iouring
  description: >
    COLD companion to nexmark_person_star_iouring_ab (user's thesis): io_uring's real benefit is
    that COLD execution ~= WARM execution — deep-QD reads hold the NVMe at ~6.9 GB/s (>= this
    query's ~6.1-6.3 GB/s warm compute ceiling), while the async File source cold-reads at QD1
    (asio treats a regular file as always-ready -> sync read on one io thread, disk-LATENCY-bound
    ~2.4 GB/s per cold_file_baseline). Same query/data as the warm A/B: native person_star,
    1.472 GB .nes, W16, single pass (cold_read requires repeat=1; the runner fadvise-evicts and
    mincore-verifies before each rep — watch for [cold_read] COLD lines; STILL-WARM = suspect).

    ARMS: file_cold (async File) / iouring_blocking_cold (IoUringFile, buffered deep QD, auto
    QD=pool/2=64) / iouring_blocking_cold_direct (+NES_IOURING_DIRECT=1, O_DIRECT: no page-cache
    fill at all) / iouring_async_cold (IoUringFileAsync). WARM references (from the warm A/B):
    file_single 6101, iouring_async 6262 MB/s.

    EXPECT (predict-first): file_cold ~2.4 GB/s (~40% of warm — the QD1 cold penalty); io_uring
    cold arms ~min(NVMe 6.9, compute 6.2) ~= 5.5-6.2 GB/s ~= WARM, confirming the thesis (prior
    evidence: blocking IoUringFile cold bid_6GB passthrough = 6.7 GB/s, §36-40). O_DIRECT arm ~=
    buffered cold arm here (both disk-capped above the compute ceiling), but O_DIRECT additionally
    leaves the page cache unpolluted (premise: production streaming reads are read-once).

    GOTCHAS: default_max_inflight_buffers=128 (>=2x QD, the private-pool deadlock guard).
    Windows are one 0.24-0.6 s pass -> ramp-inflated; reps=5, compare within-experiment. The .nes
    lives on nvme0n1p2 like all testdata.

    RESULTS (2026-07-08, reps=5 median MB/s, 20/20 ok, every rep mincore-verified COLD):
      file_cold                  1953   (32% of its warm 6101 — the QD1 cold penalty, as predicted)
      iouring_blocking_cold      2017   (buffered cold ~= File cold: readahead-bound, deep QD
      iouring_async_cold         2004    does NOT help BUFFERED cold reads)
      iouring_blocking_cold_direct 6547 <- O_DIRECT deep-QD: 107% OF WARM (6101-6339)
    THESIS CONFIRMED with a sharpening: cold ~= warm holds specifically for io_uring + O_DIRECT
    (deep-QD DMA straight into pool buffers). It even BEATS the warm path slightly — warm pays the
    kernel _copy_to_iter (the pegged-IOThread ceiling from prof_person_star_native); O_DIRECT pays
    only DMA+IOMMU, no copy, no cache pollution (reps 2-5 stayed resident 0 MB). BUFFERED io_uring
    cold is NOT it (~2.0 GB/s, same as File: cold buffered reads collapse to the readahead path
    regardless of submission depth). So the production story: streaming first-touch reads with
    IoUringFile+NES_IOURING_DIRECT=1 run this query at full speed with a cold cache, where the
    async File source loses 3.1x.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: native
  topology: single-node
  completion_timeout_s: 300
  cold_read: true
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    default_max_inflight_buffers: 128
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SystemNative, string_length: "16,32,32,16,4,256" }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 1

variants:
  - name: person_star_cold_ab
    description: "native person_star COLD: async File QD1 vs io_uring deep-QD (buffered + O_DIRECT)"
    query: nexmark/person_star
    axes:
      x:
        label: "worker threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [16]
      series:
        label: "source"
        explicit:
          - name: file_cold
            baseline: true
            overrides: {}
          - name: iouring_blocking_cold
            overrides:
              query_config.source_type: IoUringFile
          - name: iouring_blocking_cold_direct
            overrides:
              query_config.source_type: IoUringFile
              worker_env.NES_IOURING_DIRECT: 1
          - name: iouring_async_cold
            overrides:
              query_config.source_type: IoUringFileAsync
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: grouped_bar }
