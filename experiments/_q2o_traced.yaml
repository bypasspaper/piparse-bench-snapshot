# Post-fix validation + re-measure of the constantEq/Lt folded-digits rewrite.
experiment:
  name: _q2o_traced
  description: "probe: TracedINT32 CSE test. RESULT (2026-07-13): PARTIAL WIN, NO CSE.
    W1 baseline 26.88s (FastINT32) -> 18.05s (TracedINT32, 1428 MB/s); overload arm
    unchanged 7071 MB/s; checksums 55,45307 both arms. Arithmetic: 18.05 = 3.64
    (overload floor) + 5 x 2.88s = five UN-merged traced parses, each ~1.6x cheaper
    than fast_float's ~4.65s. IR proof (_q2o_traced_ir dump, final LLVM stage,
    scratchpad traced_llvm.ll): the SWAR parse inlines as PURE arithmetic (0x3030...
    subtract visible; validity chain DCE'd), and five IDENTICAL loop nests run
    back-to-back on the SAME operands (%73/%74) - LLVM GVN/NewGVN do not deduplicate
    loop nests, only straight-line values, and the trip count is runtime (field
    width) so unrolling can't linearize it. VERDICT: the pure-LLVM route is dead for
    loop-shaped parses; trace-time memoization in LazyValueRepresentation (cache the
    decoded val<T> on first materialization) is the fix. TracedINT32 is still a
    worthwhile -33% on multi-term filters in the meantime."
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int32: TracedINT32
      f64: EiselFloatF64
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 4
_arms: &arms
  label: "arm"
  explicit:
    - name: csv_optimized
      baseline: true
      overrides: {}
    - name: csv_overload
      overrides:
        overload: true
_w1x: &w1x { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [1] }
_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }
variants:
  - name: smoke_eq
    query: nexmark/q2_original
    overrides: { query_config.sink_type: Checksum, generator.repeat: 1, data_size: medium }
    axes: { x: { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [16] }, series: *arms }
    y: *time_y
  - name: q2o_ab
    query: nexmark/q2_original
    axes:
      x: { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [1] }
      series: *arms
    y: *time_y
