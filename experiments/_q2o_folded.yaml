# SPDX-License-Identifier: Apache-2.0
# Post-fix validation + re-measure of the constantEq/Lt folded-digits rewrite.
experiment:
  name: _q2o_folded
  description: "probe: folded constantEq/Lt - correctness + W1/W16 A/B. RERUN 3 (2026-07-13
    evening, nes 70cbb5f524: input_parse inlining DISABLED so the fnattr-attributed
    readonly+willreturn+nounwind parse calls stay calls): GVN merges the five per-term
    parses into ONE (IR-verified, _q2o_cse_ir: one filter parse per unrolled lane,
    survivor-only output parses). W1 baseline 26.88 -> 9.18s (2.9x); W16 baseline 4.17 ->
    3.08s = CONVERGED with overload (2.96s); overload W1 unchanged 3.68s. Checksums
    unchanged. The 'mark it pure despite the throw' route (user proposal) WORKS where
    TracedINT32-CSE could not: calls are straight-line instructions GVN can dedup, inlined
    loop nests are not. Residual W1 baseline-vs-overload gap = the one remaining parse
    call per row (~4.7ns) + call overhead vs overload's folded memcmp."
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int32: FastINT32
      f64: EiselFloatF64
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 4
_arms: &arms
  label: "arm"
  explicit:
    - name: csv_optimized
      baseline: true
      overrides: {}
    - name: csv_overload
      overrides:
        overload: true
_w1x: &w1x { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [1] }
_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }
variants:
  - name: smoke_eq
    query: nexmark/q2_original
    overrides: { query_config.sink_type: Checksum, generator.repeat: 1, data_size: medium }
    axes: { x: { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [16] }, series: *arms }
    y: *time_y
  - name: smoke_lt
    query: nexmark/_q2o_lt_probe
    overrides: { query_config.sink_type: Checksum, generator.repeat: 1, data_size: medium }
    axes: { x: { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [16] }, series: *arms }
    y: *time_y
  - name: q2o_ab
    query: nexmark/q2_original
    axes:
      x: { label: "worker threads", parameter: worker.query_engine.number_of_worker_threads, values: [1, 16] }
      series: *arms
    y: *time_y
