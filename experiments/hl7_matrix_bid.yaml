experiment:
  name: hl7_matrix_bid
  description: >
    The 3x3 format-conversion matrix over the bid_strings dataset: input {SIMDCSV, SchemaJSON,
    SIMDHL7} x output {CSV, JSON, HL7}, 5-field passthrough SQL (SELECT auctionId,bidder,price,
    channel,url). Same 31.3M logical rows per input arm (csv 3.60GB / json 5.57GB / hl7 5.72GB;
    hl7 = csv + uniform 68 B/message MSH+MLLP glue), so Mrows/s compares across arms and MB/s
    (engine-measured on INPUT bytes) compares output paths within an arm.
    HL7 input schema covers ALL 22 message leaves (junk leaves lazy+never projected); the bid arm
    MUST disable '&' subcomponent splitting (URLs contain query=1&channel_id=0). HL7 output
    re-serializes each row as one MLLP message (constant MSH header + BID segment).
    CORRECTNESS: all three input arms have reproduced checksum 269477267979 / count 31300000
    (csv+json: json_schemajson_smoke; hl7: scripts/hl7/run_checksum_gate.sh, 2026-07-30).
    W1, fnattr+inline+trace_constant_bytes, 128KiB buffers, single-node/fused, n=5 median.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/hl7_matrix_bid.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s, input bytes)" }

_out_series: &out_series
  label: "output"
  explicit:
    - name: to_csv
      baseline: true
      overrides: { query_config.output_formatter: { type: CSV } }
    - name: to_json
      overrides: { query_config.output_formatter: { type: JSON } }
    - name: to_hl7
      overrides: { query_config.output_formatter: { type: HL7, segment_name: BID } }

variants:
  - name: csv_in
    description: "SIMDCSV input over bid_strings_3GB.csv -> {CSV,JSON,HL7} out"
    query: nexmark/bid_json_passthrough
    overrides:
      data_size: csv
      query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    axes: { x: *noop_x, series: *out_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: json_in
    description: "SchemaJSON input over bid_strings_3GB.json -> {CSV,JSON,HL7} out"
    query: nexmark/bid_json_passthrough
    overrides:
      data_size: large
      query_config.input_formatter: { type: SchemaJSON }
    axes: { x: *noop_x, series: *out_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: hl7_in
    description: "SIMDHL7 input over bid_strings_3GB.hl7 ('&' disabled) -> {CSV,JSON,HL7} out"
    query: nexmark/bid_hl7_passthrough
    overrides:
      data_size: hl7
      query_config.input_formatter: { type: SIMDHL7, subcomponent_delimiter: "" }
    axes: { x: *noop_x, series: *out_series }
    y: *tput_y
    visualization: { type: grouped_bar }
