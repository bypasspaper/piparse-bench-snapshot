experiment:
  name: iouring_smoke
  description: >
    Debug repro for the IoUringFile hang in cold_iouring_ab (Monitoring sink hung with
    empty CSV while the warm Checksum A/B passed). Single cold IoUringFile run, Monitoring
    sink, short completion_timeout_s so it fails fast instead of burning 600s. Read the
    [IOURING] stderr traces in the kept worker.log to see whether takePreFilledBuffer ever
    reaches EOS (headSeq==numReads) or blocks.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 90
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: iouring_smoke
    description: "single cold IoUringFile, Monitoring sink"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "run"
        explicit:
          - name: "iouring"
            baseline: true
            overrides: {}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
