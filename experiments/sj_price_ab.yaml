# SPDX-License-Identifier: Apache-2.0
experiment:
  name: sj_price_ab
  description: >
    Decisive A/B for "is price parsed every row or only behind the filter". SchemaJSON, q2 filter
    (auctionId%123=0, 0.8% survivors), NATIVE out. TWO queries: with price in SELECT vs without.
    If price is lazily materialised behind the filter, dropping it changes ~nothing (~257K fewer
    parses). If parsed every row, dropping it saves ~0.19s.
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 5
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: json
  topology: single-node
  warm_read: true
  cold_read: false
  completion_timeout_s: 1800
  worker:
    query_engine: { number_of_worker_threads: 1, number_of_io_threads: 1, invoke_mode_configuration: fnattr, inline_invoke_calls: true, trace_constant_bytes: true, pin_threads: true, ccx_aware_task_queues: false, admission_queue_size: 1024 }
    default_query_execution: { operator_buffer_size: 131072, execution_mode: COMPILER }
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SchemaJSON }
    output_formatter: { type: NATIVE }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator: { repeat: 1 }
_noop_x: &noop_x { label: "config", parameter: topology, values: [single-node] }
_time_y: &time_y { metric: processing_time_s, label: "s" }
_series: &series
  label: "query"
  explicit:
    - { name: with_price, baseline: true, overrides: {} }
variants:
  - name: with_price
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *series }
    y: *time_y
  - name: no_price
    query: nexmark/bidstr_iso_q2_noprice
    axes: { x: *noop_x, series: *series }
    y: *time_y
