# SPDX-License-Identifier: Apache-2.0
experiment:
  name: w23_probe_qex_q2og
  description: >
    PRE-REGEN PROBE at CURRENT TIP (b5d757c9f6+knobs), W23, two queries x three NES arms.
    Purpose: (1) qex showed a possible TIP REGRESSION at W1 (21.7 vs q2mod 42.6, equal @W23 in
    the Aug-14 5-arm which PRE-DATES f6a7b98343 overload/word-compare) -> does qex still track
    q2og/q2mod at W23 on tip? (2) q2og = era-stable filter control (5-arm anchors: SIMD 498.8,
    Native-json 515.0; qex: SIMD 495.6, Native 522.4). (3) first tip datapoint for the CORRECTED
    naive arm (SequentialUncompiledOldCSV interpreted, threading_mode sequential = parse on the
    source thread, JSONUncompiled out, NES_INPUT_CODEC=original stod + NES_OUTPUT_CODEC=original
    stringstream, W1, BlockingFile, repeat 1; 5-arm corrected anchors: q2og 4.159, qex 3.986).
    simd/native repeat 8 (W23 windows ~0.5 s = 5-arm footing); metric throughput_mrows_s ONLY.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/w23_probe_qex_q2og.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: MmapFile
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
      allow_commas_in_strings: false
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter:
      type: JSON
    output_parser:
      f64: ZMIJF64
      f32: ZMIJF32
  generator:
    repeat: 8
  worker_env:
    NES_MMAP_POPULATE: '1'
_wk_x: &wk_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]
_arms: &arms
  label: "arm"
  explicit:
    - name: simd
      baseline: true
      overrides: {}
    - name: native_json
      overrides:
        data_size: native
        query_config.input_formatter: { type: SystemNative, string_length: "13,73" }
        query_config.input_parser: {}
    - name: naive
      overrides:
        generator.repeat: 1
        worker.query_engine.number_of_worker_threads: 1
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: sequential }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker_env:
          NES_INPUT_CODEC: original
          NES_OUTPUT_CODEC: original
_y: &y
  metric: throughput_mrows_s
  label: "Throughput (M records/s)"
variants:
  - { name: q2og, query: nexmark/matrix/bidstr_q2og, axes: { x: *wk_x, series: *arms }, y: *y, visualization: { type: grouped_bar } }
  - { name: qex,  query: nexmark/matrix/bidstr_qex,  axes: { x: *wk_x, series: *arms }, y: *y, visualization: { type: grouped_bar } }
