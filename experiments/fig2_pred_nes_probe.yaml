# SPDX-License-Identifier: Apache-2.0
experiment:
  name: fig2_pred_nes_probe
  description: >
    PROBE (2026-09-27, 1 rep, N=1,4,10) for the Fig2 PREDICATE sweep: SELECT * FROM t WHERE c0 < 8000 (0.8% survivors)
    over a MIXED row (c0 INT32 + N-1 FLOAT64, multicol/pred_nN, ~200 MB). Three NES series: naive (uncompiled OldCSV +
    original codecs, parses ALL fields), compiled_lazy_ovl (lazy + overload: true -> the INT lazy representation
    evaluates `<` on the raw digits, NO parse of c0), compiled_lazy_noovl (lazy, overload off -> c0 parsed by FastINT32
    per row: shows what the overload buys = the fixed per-row cost). Expect slopes: bypass ~1 ns/field (index only),
    naive ~76 ns/field (float parse of every payload column), and the overload to cut the bypass fixed cost.
    Same binary/config as fig2_fieldsweep_v2; per-run artifacts persist. generator.repeat == NES_INMEM_REPEAT.
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 600
  overload: false
  worker:
    query_engine: {number_of_worker_threads: 1, number_of_io_threads: 1, invoke_mode_configuration: fnattr, pin_threads: false, admission_queue_size: 1024}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: sequential}
    input_parser: {uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32}
    output_formatter: {type: JSON}
    output_parser: {f64: ZMIJF64, f32: ZMIJF32}
  generator: {repeat: 300, mode: burst, rate: 1000000}
  worker_env: {NES_INMEM_PREFILL: '1', NES_INMEM_REPEAT: '300', NES_INMEM_BUFSIZE: '131072'}
_q: &q [multicol/pred_n1, multicol/pred_n4, multicol/pred_n10]
_x: &x {label: "source fields N", explicit: [{name: sweep, baseline: true, overrides: {}}]}
_rungs: &rungs
  label: "NES rung"
  explicit:
    - name: naive
      baseline: true
      overrides:
        query_config.input_formatter: {type: SequentialUncompiledOldCSV, threading_mode: sequential}
        query_config.output_formatter: {type: JSONUncompiled}
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker_env.NES_INPUT_CODEC: original
        worker_env.NES_OUTPUT_CODEC: original
        generator.repeat: 5
        worker_env.NES_INMEM_REPEAT: '5'
    - name: compiled_lazy_ovl
      overrides:
        overload: true
    - name: compiled_lazy_noovl
      overrides: {}
variants:
  - name: pred
    description: "SELECT * WHERE c0 < 8000, mixed row, N=1,4,10"
    queries: *q
    axes: {x: *x, series: *rungs}
    y: {metric: throughput_mrows_s, label: "records/s"}
    visualization: {type: grouped_bar}
