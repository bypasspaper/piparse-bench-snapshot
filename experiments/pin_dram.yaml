experiment:
  name: pin_dram
  description: >
    Mechanism check for pin_pool_w4: confirm pin ON + tiny pool keeps the handoff
    L3-resident (less DRAM) vs pin OFF. Long runs (repeat 40) at pool=128 (16 MB, fits
    CCX0 L3), W=4/IO=1, so DRAM bandwidth can be measured with perf amd_df over the
    steady window. Series off (first) then on. PREDICTION: pin ON has MUCH lower DRAM
    bandwidth AND higher throughput than pin OFF (working set in shared L3, not DRAM).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 128
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 40, mode: burst, rate: 1000000}
variants:
  - name: pin_dram
    description: "pool=128 W=4, pin off then on, long run for DRAM measurement"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "pin_threads"
        explicit:
          - {name: "off", baseline: true, overrides: {worker.query_engine.pin_threads: false}}
          - {name: "on", overrides: {worker.query_engine.pin_threads: true}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
