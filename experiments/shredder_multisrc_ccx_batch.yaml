experiment:
  name: shredder_multisrc_ccx_batch
  description: >
    Does CCX-cell localization turn the multi-source SequenceShredder LF/LK WASH into a real gap, now that the
    two source-emit batching levers (K=32 burst + inline-reducer/pendingTasks backpressure) make workers busy?
    4x the same query (num_queries=4 -> 4 prefill sources -> 4 per-origin shredders), bigstr_id_pass (SELECT id,
    8B output, shredder-isolated), 4 KiB, K=32, W24. 4 series arms = {LF,LK} x {un-localized, CCX-cell}.
    - un-localized: pin_threads=F, ccx_aware_task_queues=F, io=1 -> any of 24 workers takes any source's buffer
      (each shredder hit thinly by all 24). This is the earlier WASH config, now WITH batching.
    - CCX-cell: pin_threads=T, ccx_aware_task_queues=T, io=4 -> striped: source i on CCX i, its tasks -> shard i,
      taken by CCX i's ~6 workers -> each per-origin shredder hit by a CONCENTRATED 6-worker group. NB stripedLayout
      needs only pin+ccx (NOT ccx_shared_source_pools, which is non-prefill only and would disable batching).
    SIGNAL: LF/LK. If CCX-cell LF/LK > un-localized LF/LK, concentrating workers per shredder exposes the mutex.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_multisrc_ccx_batch.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 262144
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 200000
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 20
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 4096
    NES_LOG_LEVEL: WARNING
    NES_SOURCE_EMIT_BATCH: 32
    NES_TASKQUEUE_STATS: 1
variants:
  - name: multisrc
    query: formatter/bigstr_id_pass
    axes:
      x:
        label: "concurrent sources (num_queries)"
        parameter: num_queries
        values: [4]
      series:
        label: "shredder x localization"
        explicit:
          - name: lf_unloc
            baseline: true
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
          - name: lk_unloc
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCKING }
          - name: lf_ccx
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
              worker.query_engine.pin_threads: true
              worker.query_engine.ccx_aware_task_queues: true
              worker.query_engine.number_of_io_threads: 4
          - name: lk_ccx
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCKING }
              worker.query_engine.pin_threads: true
              worker.query_engine.ccx_aware_task_queues: true
              worker.query_engine.number_of_io_threads: 4
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: line_chart }
