    overrides: { generator.repeat: 4 }
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  # ── Nexmark stateful (joins) ────────────────────────────────────────────────
  - name: nx_q5_window_join
    description: "Q5: sliding-window agg + self-join (repeat=1, stateful pool)"
