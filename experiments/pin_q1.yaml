experiment:
  name: pin_q1
  description: >
    Does the pinning + cache-local effect help a COMPUTE-bound query, or only
    passthrough? q1 (price*908/1000, float-OUTPUT-bound: EiselFloatF64 input parse +
    ZMIJF64 output serialize) is worker/compute-bound, unlike passthrough (io-bound).
    HYPOTHESIS (user): pinning helps LESS here (the handoff DRAM is a smaller fraction
    of the work; workers dominate), and a single io thread can serve MORE workers
    (~5) because each worker is slower per byte. Pinned, File, pool 256 (32MB), IO=1,
    W sweep 1..5 (<=6 threads => CCX0), pin on/off. EiselFloatF64 + ZMIJF64 (the
    fastest float stack; renderer puts the output parser in sink parser_config).
    Compare the pin gain vs passthrough's +50-80%, and find the worker knee (vs
    passthrough's W=3).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine: {number_of_io_threads: 1, invoke_mode_configuration: fnattr}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 256
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64, f64: EiselFloatF64}
    output_formatter: {type: CSV}
    output_parser: {f64: ZMIJF64}
  generator: {repeat: 4, mode: burst, rate: 1000000}
variants:
  - name: pin_q1
    description: "q1 float parse, IO=1 W1-5, pin on/off, pool 256"
    query: nexmark/q1_price
    axes:
      x:
        label: "Worker Threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [1, 2, 3, 4, 5]
      series:
        label: "pin_threads"
        explicit:
          - {name: "off", baseline: true, overrides: {worker.query_engine.pin_threads: false}}
          - {name: "on", overrides: {worker.query_engine.pin_threads: true}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart}
