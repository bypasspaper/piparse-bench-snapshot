experiment:
  name: q8_bufsize
  description: >
    q8 (person JOIN auction, no pre-join filter -> windows trigger normally, no
    state stall) at LARGER buffer sizes (32/64 KiB) with a SMALLER pool count.
    q8 is count-bound and worked down to 500K @ 4 KiB (158 MB/s). Goal: confirm q8
    runs with big buffers + small pool, find its count floor, and measure whether
    throughput rises with buffer size (4 KiB was likely overhead-bound). File,
    single pass, W=4, slice_cache on. Companion HANDOVER §21/§21e.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node

  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution:
      execution_mode: COMPILER
      slice_cache:
        enable_slice_cache: true
    # operator_buffer_size + number_of_buffers set per X point.

  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
    input_parser:
      uint64: TracedUINT64
      int32: TracedINT32
      int64: TracedINT64
      f64: EiselFloatF64
    output_formatter:
      type: CSV

  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: q8_bufsize
    description: "q8 at 32/64 KiB buffers, smaller pool counts"
    query: nexmark/q8_join
    axes:
      x:
        label: "buffer_size B x count"
        explicit:
          - name: "4KiB_x_500K_ref"
            overrides:
              worker.default_query_execution.operator_buffer_size: 4096
              worker.number_of_buffers_in_global_buffer_manager: 500000
          - name: "32KiB_x_500K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 32768
              worker.number_of_buffers_in_global_buffer_manager: 500000
          - name: "32KiB_x_250K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 32768
              worker.number_of_buffers_in_global_buffer_manager: 250000
          - name: "32KiB_x_125K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 32768
              worker.number_of_buffers_in_global_buffer_manager: 125000
          - name: "64KiB_x_250K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 65536
              worker.number_of_buffers_in_global_buffer_manager: 250000
          - name: "64KiB_x_125K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 65536
              worker.number_of_buffers_in_global_buffer_manager: 125000
          - name: "64KiB_x_64K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 65536
              worker.number_of_buffers_in_global_buffer_manager: 65536
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: bar_chart
