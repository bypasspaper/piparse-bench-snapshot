# SPDX-License-Identifier: Apache-2.0
# Fig1 REPEAT ON FLINK (2026-09-03): the serde CPU-share profile of the paper's Section-2 Fig1
# (~/Notes/nebulastream/benchmark/fig1_fig2_motivation_2026-08-19.md) taken on Apache Flink
# instead of NebulaStream. Same csv->json workload shape as NES's Fig1 naive arm: Flink's OWN
# csv format (Jackson CsvParser + CsvToRowDataConverters) on the fetcher thread, Flink's OWN
# JsonRowDataSerializationSchema in the json_blackhole void sink (flink-ext jar) on the task
# thread. parallelism 1 (= NES W1). Profiled with async-profiler (JVM_ARGS -agentpath, see
# scratch profile_flink_one.sh): cpu event @4 kHz, per-thread collapsed stacks, whole job.
# Attribution: fetcher thread = deserialize; task thread by nearest classified frame from the
# leaf (formats.json/Jackson generator = serialize, generated Calc/window ops = process,
# RecordWriter/serializers across the keyBy = engine-internal serde); GC/JIT/main threads and
# kernel read frames excluded (NES nulled read via InMemory prefill), renormalized.
experiment:
  name: fig1_flink_prof_q0
  description: 'Fig1-on-Flink profiling run (async-profiler attached, 1 rep): q0'
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: flink
  mode: flink
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1500
  flink_execution_mode: streaming
  flink_output_format: json_blackhole
  worker:
    query_engine:
      number_of_worker_threads: 1
  generator:
    repeat: 1
variants:
  - name: q0
    description: 'Flink Fig1 arm: q0 SELECT * FROM bid'
    query: nexmark/bid_star
    axes:
      x:
        label: config
        explicit:
          - name: flink_json_blackhole_p1
            baseline: true
            overrides: { data_size: large }
    y:
      metric: throughput_mbps
      label: MB/s
    visualization:
      type: bar_chart
