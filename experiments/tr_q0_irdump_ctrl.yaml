# SPDX-License-Identifier: Apache-2.0
experiment:
  name: tr_q0_irdump_ctrl
  description: >
    QEX REGRESSION BISECT, simd arm only, W23, qex + q2og control. Tip probe measured qex 393.5
    (anchor 495.6, -21%) while q2og 507.6 (anchor 498.8, stable). Suspects: uncommitted
    ConstantValueVariableSize/RawValueParser knobs vs committed f6a7b98343 (word-compare overload).
    Run once with knobs STASHED on clean tip b5d757c9f6 (this file), and if qex stays low, again
    at 8217cce465 (pre-f6a7b98343, temp branch). qex recovered to ~495 = knobs guilty; recovered
    only at 8217cce465 = word-compare guilty. reps 3, repeat 8, throughput_mrows_s.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/w23_bisect_qex.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 3
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: FILE
  query_config:
    source_type: MmapFile
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
      allow_commas_in_strings: false
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter:
      type: JSON
    output_parser:
      f64: ZMIJF64
      f32: ZMIJF32
  generator:
    repeat: 8
  worker_env:
    NES_MMAP_POPULATE: '1'
_wk_x: &wk_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [3]
_arms: &arms
  label: "arm"
  explicit:
    - name: simd
      baseline: true
      overrides: {}
_y: &y
  metric: throughput_mrows_s
  label: "Throughput (M records/s)"
variants:
  - { name: q0,  query: nexmark/matrix/bidstr_q0,  axes: { x: *wk_x, series: *arms }, y: *y, visualization: { type: grouped_bar } }
