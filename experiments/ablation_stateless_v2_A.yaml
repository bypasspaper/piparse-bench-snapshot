# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_stateless_v2_A
  description: >
    ABLATION v2 — STATELESS, PASS A (rungs 0-2, inline-OFF binary).
    COMPILATION-FIRST ladder. Supersedes ablation_stateless_A/_B.yaml (v1) for ATTRIBUTION.

    WHY v2 EXISTS (the v1 flaw, user catch 2026-07-16, CONFIRMED BY v1's OWN DATA):
    v1 added parallelism FIRST (rung 1) and compilation later (rung 3). By rung 3 the
    pipeline was already at 16 workers and PEGGED AT THE SOURCE/PAGE-CACHE READ CEILING —
    v1's r3/r4 landed at 9.9-12.1 GB/s against a measured dd page-cache ceiling of
    ~11.3 GB/s, i.e. 96-99% of the raw read wall. You cannot parse faster than you can
    read, so EVERY compute optimization downstream of the source was clipped:
      - v1's "compiled" bar (1.67-2.77x) is a LOWER BOUND, not the real gain;
      - v1's "fnattr" bar (0.99-1.02x) read as a WASH — an ARTIFACT of zero compute
        headroom, not a finding.
    Second tell: in the handover's fast stack bid_star (SELECT *) was 27% SLOWER than
    bid_ts_projection (5766 vs 7919 MB/s); in v1's r3 it was 4% FASTER (11240 vs 10820).
    The per-query spread collapsed and the ordering INVERTED = the signature of a shared
    ceiling rather than per-query compute.
    LAW: a cumulative ladder cannot attribute anything past a ceiling — the rung ORDER
    decides who gets clipped. Measure the compute knobs while COMPUTE-bound; add
    scale-out LAST, so the clipping is attributed to the rung that actually causes it.

    THE v2 LADDER (6 rungs / 5 bars across A+B). Worker count is CONSTANT at 16 — the
    single-threading comes from threading_mode: SEQUENTIAL, which runs index+parse INLINE
    ON THE SOURCE THREAD (the engine does NOT infer this from the formatter name; without
    the explicit key the blocking source runs the PARALLEL routine and "sequential"
    silently becomes 2-thread parallel — see renderer.py:308-315). One parse thread at
    ~1 GB/s is ~11x below the 11.3 GB/s read wall => genuinely compute-bound => the
    compute knobs are VISIBLE.
      0 baseline  : BlockingFile + SequentialUncompiledCSV/CSVUncompiled (SEQUENTIAL)
      1 +compiled (cat3)  : formatter -> SequentialCSV/CSV (compiled SEQUENTIAL: JIT +
                            lazy elision, still one parse thread) + fast codec plugins
      2 +fnattr   (cat4a) : invoke_mode_configuration -> fnattr
    (B file: 3 +inline / 4 +overload / 5 +scale-out.)

    RUNG 5 COMBINES parallel + async into ONE "scale-out" step (user ruling): they are one
    contribution (async only matters once there IS parallelism to feed — v1 measured async
    alone as a 0.92-1.01x WASH precisely because the formatter, not the source, was the
    wall). r5 flips threading_mode SEQUENTIAL->PARALLEL (formatter -> SIMDCSV) AND
    source BlockingFile->File together.

    CODEC HELD CONSTANT AT *FAST* across the whole ladder (unchanged from v1): parsing
    FUNCTION performance is not a contribution — ZERO-OVERHEAD PLUGGABILITY is (cat 4a/4b).
    The uncompiled arm's hardcoded codecs ARE the same algorithms (uncompiledFastParse =
    fast_float = Eisel-Lemire == EiselFloatF64; its output = to_chars+zmij == ZMIJ), PROVEN
    byte-identical by the smoke gate: q1_price checksum 431495796659 was IDENTICAL across
    r0-r4 incl. the compiled boundary (count 183,991,721 exact). So cat3 is a clean
    MECHANISM bar (JIT + lazy elision vs interpreted + materialized).

    METRIC IS throughput_mbps, NOT processing_time_s — REPEAT DIFFERS PER RUNG and time
    would not be comparable. This is SOUND: _compute_input_size (renderer.py:121-137)
    multiplies the sink's size_of_input_data_in_bytes BY generator.repeat, so MB/s is
    repeat-invariant in steady state. Per-rung repeat is required because one rate cannot
    serve both regimes: at ~1 GB/s (W1 rungs) repeat=24 would be 160 GB = ~3 min/run, while
    at ~11 GB/s (r5) repeat=10 would collapse the window to ~5.9 s on bid and ~0.7 s on
    person (the sub-second short-window trap).
      r0-r2 (this file): repeat 10 -> bid 64 GB @ ~1 GB/s   = ~64 s window
      r5   (file B)    : repeat 24 -> bid 160 GB @ ~11 GB/s = ~15 s window
    (repeat 10 chosen for the W1 rungs 2026-07-16: this is an OVERNIGHT run, so the longer
    window is affordable and strictly better than the original 4.)
    Series overrides beat variant overrides (resolve_variant THEN resolve_series_config,
    expander.py:96), so the per-rung repeat here wins — do NOT also set a variant repeat.
    CAVEAT: person_840MB is small; even at repeat 24 it is only 20 GB = ~1.7 s at 12 GB/s,
    so person's scale-out cell stays ramp-shortened (a pre-existing v1/all_queries issue).
    q22 rides the per-rung repeat too (v1 gave it 4 for run-length); check its r5 duration.

    PORT: --worker-port 9099. Host 8080 is permanently held by an unrelated docker
    container (`famedly-headless`); the default makes EVERY run fail with "nes-cli failed
    (exit 1)" and EMPTY stderr. (The DIAG_* calls=0 lines are nes-cli's, not the
    formatter's — not a parser bug.)
    ENV: performance governor REQUIRED (sudo cpupower frequency-set -g performance; resets
    on every reboot; every prior number assumes it).
    RUN: pbench run experiments/ablation_stateless_v2_A.yaml \
           --build-dir <repo>/cmake-build-release --worker-port 9099 --detach
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: default   # overridden per rung
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
    output_formatter: { type: CSVUncompiled }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 10

# ── The v2 ladder, PASS A (rungs 0-2) — all SEQUENTIAL (parse on the source thread) ──
_ladder_v2_A: &ladder_v2_A
  label: "optimization (cumulative)"
  explicit:
    - name: r0_baseline
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: CSVUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.invoke_mode_configuration: default
        overload: false
        generator.repeat: 10
    - name: r1_compiled
      overrides:
        query_config.source_type: BlockingFile
        # compiled SEQUENTIAL formatter: JIT + lazy elision, still ONE parse thread
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        query_config.input_parser: &fast_parsers
          uint64: TracedUINT64
          int64: TracedINT64
          int32: FastINT32
          int16: TracedINT16
          uint32: TracedUINT32
          uint16: TracedUINT16
          bool: TracedBOOL
          f64: EiselFloatF64
          f32: EiselFloatF32
        query_config.output_parser: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }
        worker.query_engine.invoke_mode_configuration: default
        overload: false
        generator.repeat: 10
    - name: r2_fnattr
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.invoke_mode_configuration: fnattr
        overload: false
        generator.repeat: 10

# Inert x-axis: the rung IS the series; worker count is constant (16) and must NOT be an
# x parameter — x overrides are applied AFTER series overrides (expander.py:98-101) and
# would clobber anything the series set. `topology` is already single-node => no-op.
_axes_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: nx_person_projection
    description: "SELECT id FROM person - 1 fixed col of a varsized schema"
    query: nexmark/person_projection
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_person_star
    description: "SELECT * FROM person - full varsized materialization"
    query: nexmark/person_star
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_ts_projection
    description: "SELECT timestamp FROM bid - 1-of-4 strict projection"
    query: nexmark/bid_ts_projection
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_filter_eq
    description: "SELECT * WHERE auctionId = 1000 - point filter"
    query: nexmark/bid_filter_eq
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q0_bid_star
    description: "Q0: SELECT * FROM bid (passthrough)"
    query: nexmark/bid_star
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q1_price
    description: "Q1: price * 908/1000 - float parse + arith + ZMIJ out (THE codec query: where fnattr/inline should pay)"
    query: nexmark/q1_price
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_filter_proj
    description: "Q2 (repo shape): auctionId,price WHERE %123 - int-parse/index bound on csv"
    query: nexmark/q2_filter_proj
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_original
    description: "Q2 (PAPER shape): 5-way OR point selection"
    query: nexmark/q2_original
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q14_calc
    description: "q14 (reduced): computed-float range filter, tunable selectivity"
    query: nexmark/q14_calc
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q10_datetime
    description: "q10 (reduced): CASTFROMUNIXTS ISO-8601 reformat - std::format-bound (~755 MB/s: 15x BELOW the read wall, so honest even in v1)"
    query: nexmark/q10_datetime
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q22_concat
    description: "q22 (interim CONCAT): string manipulation over string-bearing bid"
    query: nexmark/q22_concat
    axes: { x: *noop_x, series: *ladder_v2_A }
    y: *tput_y
    visualization: { type: grouped_bar }
