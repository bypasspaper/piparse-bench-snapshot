# SPDX-License-Identifier: Apache-2.0
experiment:
  name: codec_only_smoke
  description: 'Codec-only seams smoke: bid_star naive (scalar, W1), input x output
    codec 2x2. fast=fast_float/zmij, original=stod/formatFloat. Expect output-slow
    ~65 (matches ablation), input-slow lower than fast.'
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter:
      type: SequentialUncompiledOldCSV
      threading_mode: SEQUENTIAL
    output_formatter:
      type: JSONUncompiled
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
variants:
- name: bid_star
  query: nexmark/bid_star
  overrides:
    data_size: medium
  axes:
    x:
      label: w
      parameter: worker.query_engine.number_of_worker_threads
      values:
      - 1
    series:
      label: arm
      explicit:
      - name: fastIn_fastOut
        overrides:
          query_config.source_type: BlockingFile
          query_config.input_formatter: &id001
            type: SequentialUncompiledOldCSV
            threading_mode: SEQUENTIAL
          query_config.output_formatter: &id002
            type: JSONUncompiled
          query_config.input_parser: &id003 {}
          query_config.output_parser: &id004 {}
          worker.query_engine.number_of_worker_threads: 1
          generator.repeat: 1
          data_size: medium
          worker.query_engine.invoke_mode_configuration: default
          worker.query_engine.pin_threads: true
        baseline: true
      - name: slowIn_fastOut
        overrides:
          query_config.source_type: BlockingFile
          query_config.input_formatter: *id001
          query_config.output_formatter: *id002
          query_config.input_parser: *id003
          query_config.output_parser: *id004
          worker.query_engine.number_of_worker_threads: 1
          generator.repeat: 1
          data_size: medium
          worker.query_engine.invoke_mode_configuration: default
          worker.query_engine.pin_threads: true
          worker_env:
            NES_INPUT_CODEC: original
      - name: fastIn_slowOut
        overrides:
          query_config.source_type: BlockingFile
          query_config.input_formatter: *id001
          query_config.output_formatter: *id002
          query_config.input_parser: *id003
          query_config.output_parser: *id004
          worker.query_engine.number_of_worker_threads: 1
          generator.repeat: 1
          data_size: medium
          worker.query_engine.invoke_mode_configuration: default
          worker.query_engine.pin_threads: true
          worker_env:
            NES_OUTPUT_CODEC: original
      - name: slowIn_slowOut
        overrides:
          query_config.source_type: BlockingFile
          query_config.input_formatter: *id001
          query_config.output_formatter: *id002
          query_config.input_parser: *id003
          query_config.output_parser: *id004
          worker.query_engine.number_of_worker_threads: 1
          generator.repeat: 1
          data_size: medium
          worker.query_engine.invoke_mode_configuration: default
          worker.query_engine.pin_threads: true
          worker_env:
            NES_INPUT_CODEC: original
            NES_OUTPUT_CODEC: original
  y:
    metric: throughput_mbps
    label: MB/s
  visualization:
    type: grouped_bar
