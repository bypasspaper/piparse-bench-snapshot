experiment:
  name: ablation_suite_json_inmem_seq
  description: >
    v6 CSV->JSON ablation ladder, InMemory retake -- SEQUENTIAL rungs (r1-r4, r6, r6b), W1.
    Identical to ablation_suite_json_fast EXCEPT source_type BlockingFile -> InMemory (prefill,
    zero-copy hand-out) so the ~11 GB/s page-cache read is NOT serialized with parse on the single
    W1 thread. The 2026-08-24 source probe (ablation_src_probe_w1) proved InMemory is +16..+57%
    faster than BlockingFile even at W1, inverse to per-row compute weight -> BlockingFile
    handicapped the WHOLE upper ladder, not just r7. r1/r2 (interpreted, 50-680 MB/s) barely move
    (read negligible) but are re-run for a single-source-consistent ladder.

    r5 is NOT here: it needs the fastpath-OFF binary (ablation_r5_inmem_fpoff.yaml). r7 is NOT here:
    it needs W16 + a long window via NES_INMEM_REPEAT=20 (ablation_r7_inmem.yaml). q10 folds in here
    (the civil_from_days fix is committed in-tree @HEAD, unlike v5 where it needed q10_fix_*).

    BINARY: FULL binary @HEAD 8217cce465 (fastpath ON, output_parse ON) -- cmake-build-release,
    rebuilt this session (nes-single-node-worker + nes-cli).
    THROUGHPUT: NES_INMEM_REPEAT=1 => reported == true (InMemoryFileSource.cpp:148), NO x-correction
    (contrast the r7 file, which uses REPEAT=20 and needs x20). data_size=medium resolves the SAME
    file per variant as v5 (resolver.py:58 get(medium) or first-entry), so v6-InMem vs v5-File is a
    clean per-variant comparison; throughput is size-invariant regardless.
    GOTCHAS: prefill loads the file into a PRIVATE pool at registration (outside the timed window);
    max ~6.4GB (bid_6GB) => ~8.4GB RAM incl the 16384x128KB global pool (box has 53GB free). Slow
    rungs on big files run long windows (r1 person ~40s/rep) -- same as v5's repeat=1 W1 runs.
    worker_env NES_INMEM_* is inert for any non-InMemory source. pkill -x main pre-flight; NEVER
    pkill -f (self-kill). InMemory + SequentialUncompiled* (r1/r2) is a NEW combo -- smoke the first
    r1 run.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_suite_json_inmem_seq.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: SEQUENTIAL }
    output_formatter: { type: JSONUncompiled }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 1
    NES_INMEM_BUFSIZE: 131072

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_ladder: &ladder
  label: "optimization (cumulative)"
  explicit:
    - name: r1_olduncompiled
      baseline: true
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r2_uncompiled
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r3_compiled
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r4_fnattr
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r6_tcb
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: false
        generator.repeat: 1
    - name: r6b_overload
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: true
        generator.repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: nx_person_projection
    description: "SELECT id FROM person - 1 fixed col of a varsized schema"
    query: nexmark/person_projection
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_person_star
    description: "SELECT * FROM person - full varsized materialization"
    query: nexmark/person_star
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_ts_projection
    description: "SELECT timestamp FROM bid - 1-of-4 strict projection"
    query: nexmark/bid_ts_projection
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_filter_eq
    description: "SELECT * WHERE auctionId = 1000 - point filter"
    query: nexmark/bid_filter_eq
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q0_bid_star
    description: "Q0: SELECT * FROM bid (passthrough)"
    query: nexmark/bid_star
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q1_price
    description: "Q1: price * 908/1000 - float parse + arith + ZMIJ out"
    query: nexmark/q1_price
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_filter_proj
    description: "Q2 (repo shape): auctionId,price WHERE %123"
    query: nexmark/q2_filter_proj
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_original
    description: "Q2 (PAPER shape): 5-way OR point selection"
    query: nexmark/q2_original
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q14_calc
    description: "q14 (reduced): computed-float range filter"
    query: nexmark/q14_calc
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q10_datetime
    description: "q10 (reduced): CASTFROMUNIXTS reformat (civil_from_days fix, in-tree)"
    query: nexmark/q10_datetime
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q22_concat
    description: "q22 (interim CONCAT): string manipulation over string-bearing bid"
    query: nexmark/q22_concat
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
