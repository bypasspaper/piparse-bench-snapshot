experiment:
  name: nes_vs_flink_vs_spark_stateful
  description: >
    NES vs FLINK vs SPARK three-way HEAD-TO-HEAD, csv -> json, on the FROZEN PAPER_WORKLOAD Set B
    stateful tier (3 queries spanning the state-cost axis): ysb_1k_varsized (tumbling count per
    campaign - the "stateless-like" input-bound pole), q8_join (person JOIN auction, tumble 10s -
    the state-dominated pole), cm_q2 (sliding 60s/1s SUM(cpu) by jobId - the middle). Companion
    to nes_vs_flink_vs_spark_stateless. Same fairness model: all three engines read the SAME csv
    files, full JSON serialization into a void sink (NES: W23 fast stack, ccx/pin OFF, + JSON
    output into Monitoring; Flink: streaming p=23 + json_blackhole; Spark: local[23] Structured
    Streaming + json_void foreachBatch).
    SPARK PORTS: event-time via computed rowtime `__rt` = timestamp_millis(col) (ms-epoch;
    NES TimeMeasure is ms) + 1ms watermark (spark_rowtime); windows via `window(__rt, ...)` in
    GROUP BY (tumbling) / `window(__rt, size, slide)` (sliding); stream-stream join via a
    projected window column joined on window + key. Windowed AGGREGATIONS run in "update" output
    mode so trigger=availableNow serializes the full result set once (append leaves final windows
    un-emitted on a bounded source); the join runs "append". Output counts validated on synthetic
    data (batch --count exact); validate against DuckDB/awk ground truth on real data BEFORE timing
    (expected: ysb_1k_varsized 68000, q8 10999751, cm 3094778).
    ARCHITECTURE (state in the paper): Spark micro-batch reads each file as ONE micro-batch (whole
    file) -> a batch-like aggregation, not per-record streaming; a sliding 60s/1s window assigns
    each row to 60 windows (cm is the Spark stress case - watch memory / PBENCH_SPARK_TIMEOUT).
    PROTOCOL (from the stateful head-to-head): repeat=1 ALWAYS (replay into event-time windows
    corrupts the NES heap - hard rule); nexmark joins need the buffer-COUNT-bound stateful pool
    (4KiB x 2M) on the NES arm; xlarge tiling for ysb_1k_varsized (steady windows), large for the
    rest. TracedBOOL REQUIRED (cm BOOLEAN column; DefaultBOOL SIGABRTs release workers).
    PRE-FLIGHT + LAUNCH: as in the stateless experiment (pkill -x main; jars; --worker-port 9099;
    pbench run --detach; PBENCH_FLINK_TIMEOUT / PBENCH_SPARK_TIMEOUT for slow reps).
    CALIBRATION: NES vs Flink stateful geomean 7.2x (0.4-49x; state-bound work compresses the
    stateless 54x - YSB stays input-bound ~39x, joins/sliding 1.4-4.1x).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      # Single-source-per-query head-to-head: ccx_aware+pin is the ~2x single-source PATHOLOGY
      # (matrix v2, 2026-08-06) -> OFF. 23 workers + 1 source thread = 24 physical cores.
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_MMAP_POPULATE: "1"

# FAIR MODEL A (single sequential reader for all): NES = MmapFile (zero-copy single reader -> N
# parse workers); Flink = single split; Spark = single split (spark_single_reader). No offset
# splitting of the single stream; windowed processing (aggregation/join) still parallelizes per
# engine. warm_read fires for all three runners.
_series_engines: &engines
  label: "engine"
  explicit:
    - name: NebulaStream
      baseline: true
      overrides: { query_config.source_type: MmapFile }
    - name: Flink
      system: flink
      overrides:
        mode: flink
        flink_execution_mode: streaming
        flink_output_format: json_blackhole
    - name: Spark
      system: spark
      overrides:
        mode: spark
        spark_output_format: json_void
        spark_single_reader: true

_axes_x: &w16_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]

_y: &mbps_y { metric: throughput_mbps, label: "Throughput (MB/s, csv input bytes)" }

# Nexmark joins: buffer-COUNT-bound join state on the NES arm (Flink/Spark ignore worker.*).
_stateful_pool: &stateful_pool
  worker.default_query_execution.operator_buffer_size: 4096
  worker.number_of_buffers_in_global_buffer_manager: 2000000

variants:
  - name: ysb_1k_varsized
    description: "YSB varsized 1k, tumble 30s count per campaign (input-bound pole)"
    query: yahoo/ysb_1k_varsized
    overrides: { data_size: xlarge }
    axes: { x: *w16_x, series: *engines }
    y: *mbps_y
    visualization: { type: grouped_bar }
  - name: q8_join
    description: "Nexmark Q8: person JOIN auction, tumble 10s (state-dominated pole)"
    query: nexmark/q8_join
    overrides: *stateful_pool
    axes: { x: *w16_x, series: *engines }
    y: *mbps_y
    visualization: { type: grouped_bar }
  - name: cm_q2
    description: "ClusterMonitoring Q2: sliding 60s/1s SUM(cpu) by jobId, eventType=3 (middle)"
    query: cluster_monitoring/q2_original
    axes: { x: *w16_x, series: *engines }
    y: *mbps_y
    visualization: { type: grouped_bar }
