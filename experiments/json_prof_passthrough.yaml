# SPDX-License-Identifier: Apache-2.0
experiment:
  name: json_prof_passthrough
  description: >
    PROFILING window: json->json bid passthrough over bid_strings_3GB.json, generator.repeat=40 (NES_FILE_REPEAT
    -> ~40 replays -> multi-minute steady window) so perf can attach to the worker. Warm read. 1 rep. Same r6
    config as json_matrix_bid. Attach: NES_PROFILE_OUTDIR=<scratch> .claude/skills/nes-profile/nes-profile.sh
    --port 9099 --secs 15 --stat  (from the repo).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 3600
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: JSON }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 40

_noop_x: &noop_x { label: "config", parameter: topology, values: [single-node] }
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: passthrough_j2j
    description: "bid passthrough JSON->JSON, repeat=40 (profiling window)"
    query: nexmark/bid_json_passthrough
    axes:
      x: *noop_x
      series: { label: "config", explicit: [ { name: j2j, baseline: true, overrides: { query_config.output_formatter: { type: JSON } } } ] }
    y: *tput_y
    visualization: { type: grouped_bar }
