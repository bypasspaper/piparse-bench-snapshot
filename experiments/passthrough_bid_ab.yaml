# SPDX-License-Identifier: Apache-2.0
experiment:
  name: passthrough_bid_ab
  description: >
    PASSTHROUGH BENEFIT on the realistic nexmark bid row (SELECT *). Realistic counterpart to
    passthrough_ab (15-float mixed_n16). csv->json over bid_250M (4 fields ~33 B/row: UINT64 timestamp,
    INT32 auctionId, INT32 bidder, FLOAT64 price). Two queries, identical config: passthrough (SELECT *,
    raw text forwarded, no codec) vs materialize (every field * 1, parse+re-serialize; float codec = FASTEST
    Eisel in / ZMIJ out, ints default). Benefit = what the parse+serialize round-trip costs on a light,
    mixed-type, real query -- expected to be far below the 11.9x of the codec-dominated 15-float case.
    InMemory prefill, W1, Monitoring/JSON.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 300
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false}
    input_parser: {f64: EiselFloatF64}
    output_parser: {f64: ZMIJF64}
    output_formatter: {type: JSON}
  generator: {repeat: 4, mode: burst, rate: 1000000}
  worker_env: {NES_INMEM_PREFILL: 1, NES_INMEM_REPEAT: 4, NES_INMEM_BUFSIZE: 131072}
variants:
  - name: ab
    description: "passthrough (SELECT *) vs materialize (all 4 fields * 1), csv->json, nexmark bid"
    queries:
      - parsergrid/bid_star_passthrough
      - parsergrid/bid_star_materialize
    axes:
      x:
        label: "query"
        explicit:
          - {name: sweep, baseline: true, overrides: {}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
