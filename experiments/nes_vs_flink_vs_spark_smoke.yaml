# SPDX-License-Identifier: Apache-2.0
experiment:
  name: nes_vs_flink_vs_spark_smoke
  description: >
    Two-cell smoke of the three-way head-to-head before the full run: q0 (output-serialization
    regime) + q2_mod (filter regime), NES vs Flink vs Spark, csv -> json. Sanity-checks that all
    three engines produce plausible throughput on real bid_strings_3GB.csv with the healthy W23
    config. Counts already validated on real data (q0 31300000, q2_mod 257350). Same fairness
    model + config as nes_vs_flink_vs_spark_stateless.yaml.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_series_engines: &engines
  label: "engine"
  explicit:
    - name: NebulaStream
      baseline: true
      overrides: { generator.repeat: 8 }
    - name: Flink
      system: flink
      overrides:
        mode: flink
        flink_execution_mode: streaming
        flink_output_format: json_blackhole
        generator.repeat: 1
    - name: Spark
      system: spark
      overrides:
        mode: spark
        spark_output_format: json_void
        generator.repeat: 1

_axes_x: &w23_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]

_y: &mbps_y { metric: throughput_mbps, label: "Throughput (MB/s, csv input bytes)" }

variants:
  - name: q0
    description: "q0: SELECT * FROM bid - output serialization regime"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *w23_x, series: *engines }
    y: *mbps_y
    visualization: { type: grouped_bar }
  - name: q2_mod
    description: "q2-mod: auctionId % 123 = 0 filter regime"
    query: nexmark/matrix/bidstr_q2mod
    axes: { x: *w23_x, series: *engines }
    y: *mbps_y
    visualization: { type: grouped_bar }
