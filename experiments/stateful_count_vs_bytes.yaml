experiment:
  name: stateful_count_vs_bytes
  description: >
    §15 follow-up: is the stateful (windowed-join) pool requirement bound by buffer
    COUNT or by total BYTES? Hold total pool bytes EXACTLY constant at 8.192 GB
    (= 2,000,000 × 4 KiB) and vary operator_buffer_size with the buffer count
    co-varying inversely. q3 (auction JOIN person, varsized, TUMBLING 10s), File,
    single pass, W=4, slice_cache on. Prediction: success tracks COUNT, not bytes —
    the small-buffer/high-count points succeed, the big-buffer/low-count points
    FAIL despite identical total bytes (earlier: 65536 × 128 KiB = 8.59 GB FAILED,
    that's count=65536; here count=62500 @ 131072 B should also fail while
    count=2,000,000 @ 4096 B succeeds at the same 8.192 GB). Companion: HANDOVER §21.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node

  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution:
      execution_mode: COMPILER
      slice_cache:
        enable_slice_cache: true
    # operator_buffer_size + number_of_buffers_in_global_buffer_manager set per X point.

  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
    input_parser:
      uint64: TracedUINT64
      int32: TracedINT32
      int64: TracedINT64
      f64: EiselFloatF64
    output_formatter:
      type: CSV

  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: q3_count_vs_bytes
    description: "q3 at constant 8.192 GB pool, buffer size vs count (failure tracks count?)"
    query: nexmark/q3_join
    axes:
      x:
        label: "buffer_size B x count (= 8.192 GB constant)"
        explicit:
          - name: "4KiB_x_2M"
            overrides:
              worker.default_query_execution.operator_buffer_size: 4096
              worker.number_of_buffers_in_global_buffer_manager: 2000000
          - name: "8KiB_x_1M"
            overrides:
              worker.default_query_execution.operator_buffer_size: 8192
              worker.number_of_buffers_in_global_buffer_manager: 1000000
          - name: "16KiB_x_500K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 16384
              worker.number_of_buffers_in_global_buffer_manager: 500000
          - name: "32KiB_x_250K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 32768
              worker.number_of_buffers_in_global_buffer_manager: 250000
          - name: "64KiB_x_125K"
            overrides:
              worker.default_query_execution.operator_buffer_size: 65536
              worker.number_of_buffers_in_global_buffer_manager: 125000
          - name: "128KiB_x_62K5"
            overrides:
              worker.default_query_execution.operator_buffer_size: 131072
              worker.number_of_buffers_in_global_buffer_manager: 62500
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: bar_chart
