experiment:
  name: q1_diag
  description: >
    DIAGNOSTIC for the P1 probe failure: q1_price (mixed record: 3 lazy passthrough + 1 computed
    FLOAT64) crashes on compiled paths with "invalid reference counter for buffer" in the SourceThread,
    while q14_calc (filter) is clean. Hypothesis: a scale bug in the computed/mixed JSON fast path
    (commits 343d3d6377 / b807710975), in the buffer-boundary spill path that systests (<=7 rows)
    never exercise. This localizes it across the knob ladder + tests determinism (2 reps):
      r3 all-off (JIT, no fnattr/inline/tcb) ; r5 fnattr+inline, tcb OFF ; r6 fnattr+inline+tcb (= the
      config that ran "fine" yesterday vs the VOID Monitoring sink -- void = no crash != correct).
    If it fails deterministically at ALL three -> real fast-path scale bug, independent of knobs.
    W1, bid_1GB, Monitoring sink (void), CSV->JSON, fast parser.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/q1_diag.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099 --detach
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 600
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

_diag: &diag
  label: "knobs"
  explicit:
    - name: r3_alloff
      baseline: true
      overrides:
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
    - name: r5_inline_tcboff
      overrides:
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: false
    - name: r6_fullopt
      overrides:
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true

variants:
  - name: nx_q1_price
    description: "Q1 mixed record (3 lazy + 1 computed float) on bid_1GB"
    query: nexmark/q1_price
    axes: { x: *noop_x, series: *diag }
    y: *tput_y
    visualization: { type: grouped_bar }
