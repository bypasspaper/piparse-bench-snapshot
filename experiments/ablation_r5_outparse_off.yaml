experiment:
  name: ablation_r5_outparse_off
  description: >
    PASS A of the 9-rung v4 ladder: the r5 rung (inline core helpers, but output-parser serializers NOT
    inlined) on BINARY A = a build with the InlineTagConfig `output_parse` tag DISABLED. Run this ONLY on
    binary A. The r5b rung (serializers inlined) is the SAME config run on binary B (output_parse ON) via
    the main suite `ablation_suite_json_fast.yaml` -- its `r5_inline` rung == r5b. r5b/r5 = the isolated
    output-parser inline contribution, which fires ONLY on COMPUTED numeric fields (q1_price/q14/pricecalc);
    pure passthrough (bid_star/q0/bid_ts/person) is flat (writeRawBytes/copyBounded, not the serializer).

    output_parse is BUILD-TIME (InlineTagConfig macro), no runtime toggle exists (inline_invoke_calls is
    global; InvokeMode::Inline is a dead footgun). So the r5/r5b split needs a rebuild between the two rungs.
    To build binary A: move `output_parse` from enable->disable in testing/configurations/InlineTagConfig.yaml,
    then `cmake {build}` (reconfigure regenerates the header) + rebuild nes-single-node-worker nes-cli.
    Verify cmake-build-release/generated/inline/InlineTagConfig.generated.hpp has NES_INLINE_TAG_output_parse 0.
    Runs on the FIXED fast-path binary (glueTotal fix, tip 3d23dbc526).

    r5 config == the suite's r5_inline: SequentialCSV->JSON, fnattr + inline_invoke_calls, tcb OFF, W1, fast
    parser, BlockingFile, bid_1GB(medium)/large-fallback, 3 reps.
    RUN (ON BINARY A ONLY): cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_r5_outparse_off.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099 --detach
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_r5only: &r5only
  label: "optimization (cumulative)"
  explicit:
    - name: r5_inline
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: nx_person_projection
    query: nexmark/person_projection
    axes: { x: *noop_x, series: *r5only }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_person_star
    query: nexmark/person_star
    axes: { x: *noop_x, series: *r5only }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_ts_projection
    query: nexmark/bid_ts_projection
    axes: { x: *noop_x, series: *r5only }
    y: *tput_y
