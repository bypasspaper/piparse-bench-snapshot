# SPDX-License-Identifier: Apache-2.0
experiment:
  name: probe_mmap_stateful_checksum
  description: >
    Correctness pre-gate for the Model-A re-run: NES File vs MmapFile source on the 3 stateful
    queries (ysb_1k_varsized, q8_join, cm_q2) at data_size large, ChecksumSink over CSV output.
    Codec-independent proof: File checksum == MmapFile checksum per query -> the zero-copy mmap
    source delivers byte-identical input to the windowed/join operators (the subagent proved this
    for stateless q0/q_project; this covers the stateful schemas/spanning). NES-only, W23.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Checksum
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_MMAP_POPULATE: "1"

_series_src: &srcs
  label: "source"
  explicit:
    - name: File
      baseline: true
      overrides: { query_config.source_type: File }
    - name: MmapFile
      overrides: { query_config.source_type: MmapFile }

_axes_x: &w23_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]

_y: &mbps_y { metric: throughput_mbps, label: "MB/s" }

_stateful_pool: &stateful_pool
  worker.default_query_execution.operator_buffer_size: 4096
  worker.number_of_buffers_in_global_buffer_manager: 2000000

variants:
  - name: ysb_1k_varsized
    query: yahoo/ysb_1k_varsized
    axes: { x: *w23_x, series: *srcs }
    y: *mbps_y
    visualization: { type: grouped_bar }
  - name: q8_join
    query: nexmark/q8_join
    overrides: *stateful_pool
    axes: { x: *w23_x, series: *srcs }
    y: *mbps_y
    visualization: { type: grouped_bar }
  - name: cm_q2
    query: cluster_monitoring/q2_original
    axes: { x: *w23_x, series: *srcs }
    y: *mbps_y
    visualization: { type: grouped_bar }
