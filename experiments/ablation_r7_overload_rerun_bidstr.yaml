experiment:
  name: ablation_r7_overload_rerun_bidstr
  description: >
    Ablation ladder rung r7 (parallel, W23 InMemory) WITH vs WITHOUT lazy overloads = r7_ctrl / r7_ovl re-measured.
    Config = matrix cell_csv_json_rparfix r_par (SIMDCSV PARALLEL -> JSON, W23 + io1, ccx_aware=false,
    pin_threads=false, NES_INMEM_REPEAT=20 => TRUE MB/s = reported x20). ~20 min.
    Same session, same binary (cmake-build-release 2026-10-05 18:27 = tag piparse-artifact-v1 code), 10 frozen
    PAPER_WORKLOAD bidstr_* queries x 3 reps, InMemory prefill. Paper policy (author, 2026-10-12): the ladder's r6b
    AND r7 are overloads-ON rungs; the v7/v8 ladder had r6b on the pre-fix overload path (2026-08-24) and r7 from the
    matrix cell with overload OFF (q2_og 521 instead of ~610 MB/s). The ctrl arm anchors the new numbers onto the v7
    footing (ratio ovl/ctrl applied to the v7 rung), as done for the 2026-10-05 new rungs.
    RUN: cd ~/work/piparse-bench && pkill -9 -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_r7_overload_rerun_bidstr.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072

_arms: &arms
  label: "lazy overloads"
  explicit:
    - name: r7_ctrl
      baseline: true
      overrides:
        query_config.input_parser:
          uint64: TracedUINT64
          int64: TracedINT64
          int32: FastINT32
          int16: TracedINT16
          uint32: TracedUINT32
          uint16: TracedUINT16
          bool: TracedBOOL
          f64: EiselFloatF64
          f32: EiselFloatF32
        query_config.output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
        overload: false
    - name: r7_ovl
      overrides:
        query_config.input_parser:
          uint64: TracedUINT64
          int64: TracedINT64
          int32: FastINT32
          int16: TracedINT16
          uint32: TracedUINT32
          uint16: TracedUINT16
          bool: TracedBOOL
          f64: EiselFloatF64
          f32: EiselFloatF32
        query_config.output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
        overload: true

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s ; TRUE = x20)" }

variants:
  - name: q0
    query: nexmark/matrix/bidstr_q0
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qproject
    query: nexmark/matrix/bidstr_qproject
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qroute
    query: nexmark/matrix/bidstr_qroute
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q1
    query: nexmark/matrix/bidstr_q1
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2og
    query: nexmark/matrix/bidstr_q2og
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2mod
    query: nexmark/matrix/bidstr_q2mod
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q10
    query: nexmark/matrix/bidstr_q10
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q14
    query: nexmark/matrix/bidstr_q14
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q22
    query: nexmark/matrix/bidstr_q22
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qex
    query: nexmark/matrix/bidstr_qex
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
