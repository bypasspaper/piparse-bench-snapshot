    y: *tput_y
    visualization: { type: grouped_bar }
  - name: k05
    description: "5-way OR (classic NEXMark q2_original)"
    query: q2gvn/k05
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: k06
    description: "6-way OR"
    query: q2gvn/k06
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: k08
    description: "8-way OR"
