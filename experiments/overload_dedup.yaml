experiment:
  name: overload_dedup
  description: >
    OVERLOAD microbenchmark (compiler-opt parsing family, micro #4): does rewriting a lazy
    `field == const` filter into a raw-byte memcmp on the field's DIGITS (constantEq, no parse) beat
    parse-then-int-compare? Same q2_original OR-chain rig as the GVN micro (#2): NEXMark q2_original
    (SELECT auctionId, price FROM bid WHERE auctionId == c1 OR ... OR ck), sweeping the number of OR
    terms k in {1,2,3,4,5,6,8,10}, CSV->JSON, InMemory prefill, W1. Data auctionId in [1e6,9e6); OR
    constants all < 1e6 => 0% match => every row traverses the full chain AND produces ZERO output
    rows, so the entire measured cost is the FILTER compare (no output-serialization confound).
    2x2 factorial in EXACTLY TWO knobs (invoke_mode x overload):
      * default_noload  : invoke=default, overload=off -> k opaque parses/row (no GVN dedup).
      * fnattr_noload   : invoke=fnattr,  overload=off -> GVN dedups the identical parses (~2/row)
                          + k int-compares. This is the GVN micro (#2) baseline.
      * default_overload: invoke=default, overload=on  -> LAZY_INT_OVERLOADS rewrites each `==` into
                          constantEq (raw-byte memcmp of the field's digits vs the rendered constant
                          digits, folded to immediates) -> 0 parses/row, k byte-memcmps.
      * fnattr_overload : invoke=fnattr,  overload=on  -> same 0-parse byte-memcmp path.
    The one-knob OVERLOAD isolation is (fnattr_noload -> fnattr_overload) [hold fnattr] and
    (default_noload -> default_overload) [hold default]. PREDICTION: the two overload arms COINCIDE
    (overload removes the parse, so invoke_mode has nothing to dedup -> fnattr becomes moot), and
    overload beats the best parsing arm (fnattr_noload) most at LOW k (parse-removal dominates),
    with the win eroding as k grows (both arms then pay k per-term compares; overload's per-term
    memcmp of ~7 digits vs a single int-compare). This is the COMPLEMENT of micro #2: GVN
    DEDUPLICATES the parse (win grows with k), overload ELIMINATES it (win largest at small k).
    overload:true lives in the ARM override (NOT defaults): validation.py merges only
    defaults+variant, so an arm-level overload dodges the stale `overload requires branch
    benchmark-piparse-lazyparse` rule (the feature IS present on -fast-csv). No engine change --
    rides the pre-existing LAZY_*_OVERLOADS config. inline_invoke_calls OFF throughout.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/overload_dedup.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 5
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 5
    NES_INMEM_BUFSIZE: 131072

_arms: &arms
  label: "arm"
  explicit:
    - name: default_noload
      baseline: true
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: fnattr_noload
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: default_overload
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: true
        generator.repeat: 5
    - name: fnattr_overload
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: true
        generator.repeat: 5

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: k01
    description: "1-way OR (anchor: overload removes 1 parse)"
    query: q2gvn/k01
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: k02
    description: "2-way OR"
    query: q2gvn/k02
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: k03
    description: "3-way OR"
