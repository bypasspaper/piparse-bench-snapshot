experiment:
  name: json_input_isolation
  description: >
    JSON-input parser isolation. The prior JSON study (json_matrix_bid) measured json->json and
    json->csv with the OUTPUT serializer in the pipeline (~27% of the profile) -- an input/output
    confound. This experiment removes output serialization entirely: OUTPUT_FORMAT=NATIVE (no
    compiled serializer -> the pipeline emits native tuples) + Monitoring sink (NoneFormat, a
    per-buffer no-op that still yields processing_time_s + throughput). That is "parse to native,
    discard" -- the INPUT parser (+ compute + materialise) is all that remains.

    THREE input representations of the IDENTICAL 31.3M-row bid_strings dataset (arm = input format):
      json   bid_strings_3GB.json  JSON formatter (simdjson on-demand; SequentialJSON is broken on
                                   multi-buffer -> use the parallel "JSON" indexer)
      csv    bid_strings_3GB.csv   SIMDCSV (allow_commas_in_strings:false -- dataset is quote-free)
      native bid_strings_3GB.nes   SystemNative string_length "13,73" -- NO input parse = the floor
    Deltas: Δ(json - native) = isolated JSON parser cost; Δ(csv - native) = isolated CSV parser
    cost; json/csv time ratio = the pure input-format gap with output removed.

    THREE queries (compute intensity ladder), each named per Nexmark:
      q2   SELECT auctionId, price WHERE auctionId%123=0   -- INT32 parsed EVERY row, tiny output
      q1   price*908/1000 (+ forward ts,auctionId,bidder)  -- ALL 4 numeric fields parsed every row
      pass SELECT auctionId,bidder,price,channel,url        -- + VARSIZED get_string (unescape+copy)

    W1, single-node/fused, r6 fullopt, governor performance. COMPARE ON processing_time_s / Mrows/s
    (rows identical across arms; byte denominators differ 5.57/3.60/3.44 GB so MB/s is NOT
    cross-arm comparable). n=5 median.

    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_input_isolation.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: json
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: JSON }
    output_formatter: { type: NATIVE }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_time_y: &time_y { metric: processing_time_s, label: "Processing time (s), lower=faster" }

# arm = INPUT FORMAT. Each overrides the data file + the input formatter. Output stays NATIVE.
_fmt_series: &fmt_series
  label: "input"
  explicit:
    - name: json
      baseline: true
      overrides:
        data_size: json
        query_config.input_formatter: { type: JSON }
    - name: csv
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    - name: native
      overrides:
        data_size: native
        query_config.input_formatter: { type: SystemNative, string_length: "13,73" }

variants:
  - name: q2
    description: "Nexmark Q2 filter+proj (INT32 parsed every row), JSON/CSV/native in -> NATIVE out"
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: q1
    description: "Nexmark Q1 currency (all 4 numeric fields parsed every row), -> NATIVE out"
    query: nexmark/bidstr_iso_q1
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: pass
    description: "Varsized passthrough (+ get_string), -> NATIVE out"
    query: nexmark/bidstr_iso_pass
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
