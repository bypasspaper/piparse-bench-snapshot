# SPDX-License-Identifier: Apache-2.0
experiment:
  name: nes_naive_reprobe
  description: >
    NAIVE-ONLY re-probe after the W1->W16 fix (the first probe's naive arm timed out at
    N>=256 because W1 made the interpreted+original-codec path ~16x too slow). N=[1000,256]
    heaviest-first. Confirms both complete well under the 3600s completion timeout and yields
    sane aggregate throughput + latency. Native already validated in nes_naive_native_scaling_probe.
    PRE-FLIGHT: pkill -x main; warm bid_strings_3GB.csv; --worker-port 9099; PBENCH_KEEP_LOGS=1.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 3600
  query_mix:
    - nexmark/matrix/bidstr_q0
    - nexmark/matrix/bidstr_qproject
    - nexmark/matrix/bidstr_qroute
    - nexmark/matrix/bidstr_q1
    - nexmark/matrix/bidstr_q2og
    - nexmark/matrix/bidstr_q2mod
    - nexmark/matrix/bidstr_q10
    - nexmark/matrix/bidstr_q14
    - nexmark/matrix/bidstr_q22
    - nexmark/matrix/bidstr_qex
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 65536
    ccx_shared_source_pools: false
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: sequential }
    output_formatter: { type: JSONUncompiled }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INPUT_CODEC: original
    NES_OUTPUT_CODEC: original

_series_arms: &arms
  label: "engine"
  explicit:
    - name: NES-Naive
      baseline: true

_axis_n: &n_x
  label: "concurrent sources/queries"
  parameter: num_queries
  values: [1000, 256]

_y: &tput_y { metric: throughput_mbps, label: "Aggregate throughput (MB/s)" }

variants:
  - name: mix
    description: "NES-Naive W16, 10-query mix, re-probe N=1000/256"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *n_x, series: *arms }
    y: *tput_y
    visualization: { type: line_chart }
