# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_stateless_v2_B
  description: >
    ABLATION v2 — STATELESS, PASS B (rungs 3-5, inline-ON binary). Continuation of
    ablation_stateless_v2_A.yaml (read its header for the full v2 rationale: v1 added
    parallelism first and pegged the source/page-cache read ceiling at ~11.3 GB/s, which
    CLIPPED every compute optimization downstream; v2 measures the compute knobs while
    compute-bound and adds scale-out LAST).

    Rung 3 (r3_inline) has the SAME config as rung 2 (r2_fnattr in file A); the ONLY
    difference is the binary (inline-ON here vs inline-OFF there). The r2->r3 delta,
    computed by merging the two run_groups, IS the build-time inline contribution (cat 4b).

    THE v2 LADDER continues (6 rungs / 5 bars across A+B):
      3 +inline    (cat4b)     : identical config to rung 2, but inline-ON binary
      4 +overload  (cat5)      : overload=true -> LAZY_{INT,FLOAT,UINT}_OVERLOADS +
                                 call-free bytesEqual string-eq constant-fold
      5 +scale-out (cat1+cat2) : parallel AND async TOGETHER, as ONE step (user ruling) —
                                 threading_mode SEQUENTIAL->PARALLEL (formatter
                                 SequentialCSV -> SIMDCSV) AND source BlockingFile->File.
                                 They are one contribution: async only matters once there
                                 IS parallelism to feed (v1 measured async ALONE as a
                                 0.92-1.01x wash precisely because the formatter, not the
                                 source, was the wall). Worker count is CONSTANT at 16
                                 throughout — the single-threading in rungs 0-4 comes from
                                 threading_mode SEQUENTIAL (index+parse INLINE on the
                                 source thread), not from a worker count.
                                 EXPECT r5 TO HIT THE ~11.3 GB/s READ WALL on the cheap
                                 queries. That is now HONEST: the clipping is attributed to
                                 the rung that actually causes it, instead of silently
                                 eating the compiled/fnattr/inline bars as it did in v1.

    METRIC IS throughput_mbps — repeat DIFFERS per rung (r3/r4: 10, r5: 24) and time would
    not be comparable. Sound because _compute_input_size (renderer.py:121-137) multiplies
    size_of_input_data_in_bytes BY generator.repeat => MB/s is repeat-invariant in steady
    state. Per-rung repeat is required: at ~1 GB/s repeat=24 would be ~3 min/run, while at
    ~11 GB/s repeat=10 would collapse the window to ~5.9 s (bid) / ~0.7 s (person) —
    the sub-second short-window trap; hence r5 keeps 24. Series
    overrides beat variant overrides (expander.py:96) so the per-rung repeat wins.
    CAVEAT: person_840MB is small — even at repeat 24 that is 20 GB = ~1.7 s at 12 GB/s, so
    person's r5 cell stays ramp-shortened (pre-existing, also true of v1/all_queries).

    BUILD — THIS FILE NEEDS THE inline-ON BINARY:
      1. testing/configurations/InlineTagConfig.yaml ->
           enable: [lazy_overload, output_parse, input_parse]   # all three
           disable: (empty)
      2. RE-RUN CMAKE CONFIGURE — the generated header is written at CONFIGURE time by
         NautilusInlining.cmake:159 via file(WRITE); there is NO build-time dep on the YAML,
         so `ninja` alone leaves a SILENTLY STALE binary:
           NES_BUILD_DIR=cmake-build-release .claude/skills/nes-build/in-docker.sh cmake -S {repo} -B {build}
      3. Rebuild (cheap — ~24 steps, only the tagged-inline dependents):
           NES_BUILD_DIR=cmake-build-release .claude/skills/nes-build/in-docker.sh cmake --build {build} --target nes-single-node-worker nes-cli
      4. VERIFY: grep NES_INLINE_TAG cmake-build-release/generated/inline/InlineTagConfig.generated.hpp
         -> all three MUST be 1. (Sanity: disabling inlining SHRANK the binaries
         159,023,904 -> 158,730,712 B, so the flip is observable.)
      5. Afterwards restore the shipped default:
           git checkout -- testing/configurations/InlineTagConfig.yaml
         (shipped default = enable: [lazy_overload, output_parse], disable: [input_parse] —
         note it is NOT the all-3 arm, so r3-r5 absolute numbers will not line up 1:1 with
         published fast-stack figures.)
      NEVER rebuild while a pbench run is live (fresh exec per rep).

    PORT: --worker-port 9099 (host 8080 is permanently held by the unrelated
    `famedly-headless` docker container; the default fails EVERY run with "nes-cli failed
    (exit 1)" and EMPTY stderr).
    ENV: performance governor REQUIRED (resets on every reboot).
    RUN: pbench run experiments/ablation_stateless_v2_B.yaml \
           --build-dir <repo>/cmake-build-release --worker-port 9099 --detach
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 10

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32

_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

# ── The v2 ladder, PASS B (rungs 3-5) ──────────────────────────────────────────
# r3 == r2 config (file A) exactly; only the binary (inline-ON) differs.
_ladder_v2_B: &ladder_v2_B
  label: "optimization (cumulative)"
  explicit:
    - name: r3_inline
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.invoke_mode_configuration: fnattr
        overload: false
        generator.repeat: 10
    - name: r4_overload
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.invoke_mode_configuration: fnattr
        overload: true
        generator.repeat: 10
    - name: r5_scaleout
      overrides:
        # parallel AND async together — the combined scale-out contribution
        query_config.source_type: File
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.invoke_mode_configuration: fnattr
        overload: true
        generator.repeat: 24   # bigger window: ~11 GB/s needs 160 GB for a ~15 s steady window

_axes_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: nx_person_projection
    description: "SELECT id FROM person - 1 fixed col of a varsized schema"
    query: nexmark/person_projection
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_person_star
    description: "SELECT * FROM person - full varsized materialization"
    query: nexmark/person_star
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_ts_projection
    description: "SELECT timestamp FROM bid - 1-of-4 strict projection"
    query: nexmark/bid_ts_projection
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_filter_eq
    description: "SELECT * WHERE auctionId = 1000 - point filter"
    query: nexmark/bid_filter_eq
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q0_bid_star
    description: "Q0: SELECT * FROM bid (passthrough)"
    query: nexmark/bid_star
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q1_price
    description: "Q1: price * 908/1000 - float parse + arith + ZMIJ out (THE codec query: where fnattr/inline should pay)"
    query: nexmark/q1_price
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_filter_proj
    description: "Q2 (repo shape): auctionId,price WHERE %123 - int-parse/index bound on csv"
    query: nexmark/q2_filter_proj
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_original
    description: "Q2 (PAPER shape): 5-way OR point selection"
    query: nexmark/q2_original
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q14_calc
    description: "q14 (reduced): computed-float range filter, tunable selectivity"
    query: nexmark/q14_calc
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q10_datetime
    description: "q10 (reduced): CASTFROMUNIXTS ISO-8601 reformat - std::format-bound (~755 MB/s: 15x BELOW the read wall)"
    query: nexmark/q10_datetime
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q22_concat
    description: "q22 (interim CONCAT): string manipulation over string-bearing bid"
    query: nexmark/q22_concat
    axes: { x: *noop_x, series: *ladder_v2_B }
    y: *tput_y
    visualization: { type: grouped_bar }
