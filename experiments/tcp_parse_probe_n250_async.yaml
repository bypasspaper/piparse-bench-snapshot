experiment:
  name: tcp_parse_probe_n250_async
  description: >
    Follow-up probe to tcp_parse_probe_n100 (READ ITS HEADER: method, gotchas, results):
    async io8/w14 ONLY at N=250, one rep. Checks how the q1 async arm eases past N=100
    before committing the full sweep -- the section-6 PASSTHROUGH async curve eased
    9.8 -> 8.3 GB/s from 100 -> 250; q1 is worker-bound (7843 @100), so the question is
    whether more connections cost anything once workers are the limit.

    PREDICTION: ~7.3-8.0 GB/s (flat-to-slightly-easing; io pool multiplexes 250 conns as
    well as 100, workers stay the binding constraint). p50 grows with queue depth toward
    ~35-45 ms (2.5x the N=100 16.9), p99 ~50-90 ms. If throughput DROPS well below 7
    (say <6.5), the io pool or generator supply is straining -- check generator CPUs
    before blaming the engine.

    Same core budget: engine cores 0-13, generator 10 threads on 14-23, shared process,
    -n 250, -m 6. Run with --generator-bin .../async-tcp-generator.

    RESULT (2026-07-07, 1 rep): 7762 MB/s (-1% vs 7843 @N=100 -- FLAT, prediction hit:
      workers stay the binding constraint, the io pool multiplexes 250 conns for free).
      p50 19.6 / p99 27.9 / p999 36.1 ms -- latency grew SUB-linearly (predicted ~2.5x
      p50, got +16%): queueing spreads across more, slower per-query streams.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  completion_timeout_s: 1200
  worker_cpus: "0-13"
  num_queries: 250
  worker:
    query_engine:
      number_of_worker_threads: 14
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    source_type: TCP
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    kind: async
    cpus: "14-23"
    threads: 10
    chunk_size_kb: 128
    repeat: 6
    rate: 1000000

variants:
  - name: async_n250
    description: "q1 over TCP, async io8/w14, N=250, core-budgeted 10/14"
    query: nexmark/q1_price
    axes:
      x:
        label: "Concurrent Queries"
        parameter: num_queries
        values: [250]
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: bar_chart }
