# SPDX-License-Identifier: Apache-2.0
experiment:
  name: seq_iouring_checksum
  description: >
    CORRECTNESS gate for IoUringFile + SEQUENTIAL formatter (session 2026-07-03): new fillTupleBuffer
    serves the deep-QD prefilled buffers as a contiguous byte stream so the inline sequential runner can
    drive the io_uring source. Compare the Checksum-sink output against the known-good async File source.
    Both MUST print identical count,checksum (expected 183991721,335920996194 on bid_1GB medium -- the
    same value BlockingFile-pread and io_uring parallel produce). Any byte-stream cursor / spanning bug
    would diverge. O_DIRECT+regbuf+QD64 on, medium bid_1GB, warm, repeat 1.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  cold_read: false
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    global_buffer_alignment: 512
    number_of_buffers_in_global_buffer_manager: 2048
    default_max_inflight_buffers: 128
  query_config:
    sink_type: Checksum
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_REGBUF: 1

variants:
  - name: seq_iouring_checksum
    description: "medium bid_1GB checksum: async File reference vs IoUringFile SEQUENTIAL"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "source"
        explicit:
          - name: "File_reference"
            baseline: true
            overrides:
              query_config.source_type: File
              query_config.input_formatter.type: SIMDCSV
          - name: "IoUringFile_seq"
            overrides:
              query_config.source_type: IoUringFile
              query_config.input_formatter.type: SequentialCSV
              query_config.input_formatter.threading_mode: sequential
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
