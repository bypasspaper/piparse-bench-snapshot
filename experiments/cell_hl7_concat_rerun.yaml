# SPDX-License-Identifier: Apache-2.0
experiment:
  name: cell_hl7_hl7
  description: >
    3-CELL SANITY PROBE, cell hl7->hl7 (paper matrix preview, session 2026-08-04b;
    user-approved). 5 regime-representative queries of the FROZEN workload x the 3-rung ladder,
    2 reps. Rungs: r_base = SequentialUncompiled input, W1, default invoke, COMPILED cell-format
    output (the consistent-baseline arm). NO legacy arm: HL7 has no interpreted output writer (the design gap this probe informs). r_comp = Sequential compiled input W1
    + full-opt JIT (fnattr/inline/tcb) + fast codecs. r_par = parallel input, InMemory prefill,
    W16 + ccx + pin, NES_INMEM_REPEAT=20 (TRUE r_par throughput = reported x20; r_base/r_comp
    use BlockingFile, counted once). CELL MATH (true throughputs, per query, then geomean over
    the 5): Comp = r_comp/r_base, Par = r_par/r_comp, Total = Comp x Par.
    GOTCHA (burned once): data_size selects the catalog data entry -- MUST be 'hl7' here;
    unknown values silently fall back to the FIRST entry.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/cell_hl7_hl7.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: hl7
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialUncompiledHL7, threading_mode: SEQUENTIAL, subcomponent_delimiter: "" }
    output_formatter: { type: HL7 }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072

_ladder: &ladder
  label: "rung"
  explicit:
    - name: r_base
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledHL7, threading_mode: SEQUENTIAL, subcomponent_delimiter: "" }
        query_config.output_formatter: { type: HL7 }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        worker.query_engine.ccx_aware_task_queues: false
    - name: r_comp
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialHL7, threading_mode: SEQUENTIAL, subcomponent_delimiter: "" }
        query_config.output_formatter: { type: HL7 }
        query_config.input_parser:
          uint64: TracedUINT64
          int64: TracedINT64
          int32: FastINT32
          int16: TracedINT16
          uint32: TracedUINT32
          uint16: TracedUINT16
          bool: TracedBOOL
          f64: EiselFloatF64
          f32: EiselFloatF32
        query_config.output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        worker.query_engine.ccx_aware_task_queues: false
    - name: r_par
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SIMDHL7, threading_mode: PARALLEL, subcomponent_delimiter: "" }
        query_config.output_formatter: { type: HL7 }
        query_config.input_parser:
          uint64: TracedUINT64
          int64: TracedINT64
          int32: FastINT32
          int16: TracedINT16
          uint32: TracedUINT32
          uint16: TracedUINT16
          bool: TracedBOOL
          f64: EiselFloatF64
          f32: EiselFloatF32
        query_config.output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
        worker.query_engine.number_of_worker_threads: 16
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        worker.query_engine.ccx_aware_task_queues: true

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s; r_par TRUE = x20)" }

variants:
  - name: concat
    description: "string regime (q22)"
    query: nexmark/bid_hl7_concat_alert
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
