experiment:
  name: fullstack_compiled
  # Fully-COMPILED in/out on bid_star_parseall (*1 forces the compiled path to materialize every field --
  # passthrough elision is on by default). FULL FAST STACK: fnattr + 128 KiB buffers + native + TracedUINT64
  # /FastINT32/EiselFloatF64 input (TracedUINT64 auto-fuses -> no __emutls on int parse) + ZMIJF64 output.
  # Compare against fullstack_uncompiled.yaml (UncompiledCSV in + CSVUncompiled/legacy ZMIJ out). Branch pinned.
  # RESULTS (2026-07-06, reps=3, native): bid_star 6GB parse-all, W1/4/16 = 382 / 1486 / 5348 MB/s.
  description: "Fully-compiled SIMDCSV in + JIT ZMIJ out, parse-all, full fast stack"
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: systest
  build: native
  data_size: large
  worker:
    query_engine: { number_of_io_threads: 1, pin_threads: false, invoke_mode_configuration: fnattr, admission_queue_size: 1024 }
    default_query_execution: { operator_buffer_size: 131072, execution_mode: COMPILER }
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  topology: single-node
  query_config:
    source_type: File
    sink_type: Checksum
    input_formatter: { type: SIMDCSV }
    input_parser: { uint64: TracedUINT64, int32: FastINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
variants:
  - name: parseall
    query: nexmark/bid_star_parseall
    axes:
      x: { label: "Worker Threads", parameter: worker.query_engine.number_of_worker_threads, values: [1, 4, 16] }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: line_chart }
