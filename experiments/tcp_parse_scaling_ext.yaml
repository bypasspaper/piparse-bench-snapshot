experiment:
  name: tcp_parse_scaling_ext
  description: >
    EXTENSION of tcp_parse_scaling to N = 500 / 1000 (READ ITS HEADER: method, arms,
    gotchas all apply verbatim). ONE rep per point -- the blocking N=1000 rep alone moves
    ~6 TB at a possibly-collapsed rate. DRAFTED 2026-07-07 alongside the base sweep; DO
    NOT run before the base sweep's results are in (predictions below may be revised).

    KNOWN RISKS AT THIS SCALE (from the passthrough collapse study, section 6):
      - blocking DROPPED QUERIES past 250 conns (n_ok 285-295 of 300+): a dropped query
        never writes its Monitoring CSV -> pbench's completion poll runs to TIMEOUT and
        the run is recorded as FAILED even though the surviving queries produced data.
        If that happens, the honest options are (a) accept the DNF as the result -- "the
        naive setup cannot finalize 500 conns" is a finding -- or (b) lower repeat.
      - blocking N=1000: 6 TB at ~1.5-2 GB/s ~= 50-70 min -> completion_timeout 5400.
      - async N=1000: 1000 conns on the 8-thread io pool; passthrough async held 8.2 GB/s
        at 500 -- expect q1 async ~7.5-7.8 flat if workers stay the limit.
      - generator: ONE shared process, -n N released together; 1000 client tasks on 10
        tokio threads is fine (tasks are cheap), but check generator CPUs if async sags.

    PREDICTIONS (provisional until the base sweep lands):
      - async: flat ~7.5-7.8 GB/s at both 500 and 1000; p50 ~20-30 ms, p99 30-60.
      - blocking: ~1.5-2.5 @500, ~1-2 @1000 IF it finalizes; real chance of DNF (dropped
        queries) at one or both points. p50 100-300 ms, p99 0.5-1 s+.

    RESULTS (2026-07-07, run KILLED after the blocking-500 DNF to skip a doomed 90-min
    blocking-1000 timeout):
      async_compiled: 500 = 7802 (p50 23.4 / p99 33.4), 1000 = 7796 (p50 31.4 / p99 43.8)
        -- FLAT to 1000 connections, prediction hit; graceful ms-scale latency growth.
      blocking_uncompiled @500 = DNF, and the MECHANISM is not the scheduler: only
        274/500 queries finalized (all by t+18min, consistent ~1.5 GB/s for the
        survivors); the other 226 sources died AT START with EAGAIN in
        BlockingTCPSource::fillBuffer -- SO_RCVTIMEO == connect_timeout_seconds
        (DEFAULT 10 s) also gates the FIRST BYTE, and with 500 conns released together
        into a collapsed consumer, the unlucky tail waits >10 s -> read times out ->
        source treats EAGAIN as fatal -> query never gets data. Generator finished all
        500 clients cleanly ("All clients done"). pbench then polls to completion_timeout
        (recorded as failed run; partial evidence in the kept /tmp/pbench_mon_1tbvnp22).
      FINDING either way: the naive thread-per-connection setup cannot even START 500
        parse-heavy connections within its default socket timeouts (async did, trivially).
      RETRY PATH (if the post-start economics are wanted): set source config
        connect_timeout_seconds >> first-byte wait (e.g. 600) -- needs a small pbench
        renderer passthrough for extra source_config keys -- and rerun blocking 500/1000.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  completion_timeout_s: 5400
  worker_cpus: "0-13"
  worker:
    query_engine:
      number_of_worker_threads: 14
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    sink_type: Monitoring
  generator:
    kind: async
    cpus: "14-23"
    threads: 10
    chunk_size_kb: 128
    repeat: 6
    rate: 1000000

variants:
  - name: parse_thread_model_tcp_ext
    description: "q1 over TCP at N=500/1000: async compiled (io8/w14) vs blocking uncompiled sequential (w14)"
    query: nexmark/q1_price
    axes:
      x:
        label: "Concurrent Queries (= Concurrent TCP Connections)"
        parameter: num_queries
        values: [500, 1000]
      series:
        label: "Ingestion + parse model"
        explicit:
          - name: async_compiled
            baseline: true
            overrides:
              worker.query_engine.number_of_io_threads: 8
              query_config.source_type: TCP
              query_config.input_formatter: { type: SIMDCSV }
              query_config.input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
              query_config.output_formatter: { type: CSV }
              query_config.output_parser: { f64: ZMIJF64 }
          - name: blocking_uncompiled
            overrides:
              worker.query_engine.number_of_io_threads: 4
              query_config.source_type: BlockingTCP
              query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: sequential }
              query_config.output_formatter: { type: CSVUncompiled }
    y:
      metric: throughput_mbps
      label: "Aggregate System Throughput (MB/s)"
    visualization:
      type: line_chart
      x_scale: log
