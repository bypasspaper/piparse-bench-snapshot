experiment:
  name: iouring_worker_sweep
  description: >
    #2: at what worker count does cold O_DIRECT IoUringFile reach its ~5.9 GB/s ceiling?
    Sweep number_of_worker_threads (1..8), IO=1 (0 is rejected by config validation), QD64
    O_DIRECT, cold bid_6GB passthrough, pool 4096, 128 KiB, median n=3.

    Profile context: at W4 the 4 workers were SUPPLY-STARVED (~55-76% avg CPU) while the single
    DataSrc thread was the busiest (~83% CPU + 17% io_cqring_wait). So the limiter is the single
    producer thread, not worker parallelism.
    PREDICTION: saturates early (W2-3 ~= 5.9), W>=4 flat (adding workers to a supply-bound pipeline
    does nothing). W1 likely lower (one worker can't drain the source). If it KEEPS rising past W4,
    the workers were the limiter after all (would contradict the profile).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64

variants:
  - name: iouring_worker_sweep
    description: "cold O_DIRECT IoUringFile QD64, sweep number_of_worker_threads"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "number_of_worker_threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [1, 2, 3, 4, 6, 8]
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart}
