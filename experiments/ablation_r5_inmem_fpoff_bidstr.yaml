experiment:
  name: ablation_r5_inmem_fpoff_bidstr
  description: >
    v7 CSV->JSON ablation ladder, VARSIZED retake -- r5 (general inline) rung ONLY, W1, on the
    FASTPATH-OFF binary. Companion to ablation_suite_json_inmem_seq_bidstr.yaml. Reproduces the
    two-binary methodology so the JSON output fast-path 2x lands at r5->r6 (not buried in generic
    inline): r5 = general proxy/accessor inline ONLY, output fast-path + serializer inline OFF at
    BUILD time. Repointed onto the frozen paper footing (data_size=csv -> bid_strings_3GB,
    10 bidstr_* queries).

    !!! REQUIRES A SPECIAL BINARY -- do NOT run against the normal fastpath-ON cmake-build-release !!!
    Build the fastpath-OFF binary FIRST:
      1. comment nes-plugins/OutputFormatters/JSONOutputFormatter/CMakeLists.txt:34
         (nautilus_inline(json_output_formatter_plugin))
      2. comment testing/configurations/InlineTagConfig.yaml:12 (- output_parse)
      3. cmake <build>   (RECONFIGURE -- InlineTagConfig is read at CONFIGURE time; a plain
         --build leaves a STALE generated header and the tag silently stays ON)
      4. cmake --build <build> --target nes-single-node-worker nes-cli
      VERIFY: grep output_parse cmake-build-release/.../InlineTagConfig.generated.hpp -> absent/0.
    Run this experiment against that binary, then RESTORE the full binary:
      git checkout nes-plugins/OutputFormatters/JSONOutputFormatter/CMakeLists.txt \
                   testing/configurations/InlineTagConfig.yaml
      cmake <build> && cmake --build <build> --target nes-single-node-worker nes-cli
    (the seq + r7 experiments use the FULL fastpath-ON binary.)

    Config == the suite's r5 knobs: SequentialCSV->JSON, fnattr + inline_invoke_calls=true,
    trace_constant_bytes OFF, W1, fast parsers, source InMemory (prefill).
    THROUGHPUT: NES_INMEM_REPEAT=1 => reported == true, no correction. data_size=csv.
    GOTCHAS: prefill ~3.6GB into a private pool; pkill -x main pre-flight, NEVER pkill -f.
    RUN (after building the fastpath-OFF binary): cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 \
           uv run python bench.py run experiments/ablation_r5_inmem_fpoff_bidstr.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 1
    NES_INMEM_BUFSIZE: 131072

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_ladder: &ladder
  label: "optimization (cumulative)"
  explicit:
    - name: r5_inline
      baseline: true
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: q0
    description: "Q0: SELECT * FROM bid (varsized passthrough)"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qproject
    description: "SELECT price FROM bid (single-col projection)"
    query: nexmark/matrix/bidstr_qproject
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qroute
    description: "Q_route: content-based routing projection"
    query: nexmark/matrix/bidstr_qroute
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q1
    description: "Q1: price * 908/1000 (float arith + ZMIJ out)"
    query: nexmark/matrix/bidstr_q1
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2og
    description: "Q2 (PAPER shape): 5-way OR point selection"
    query: nexmark/matrix/bidstr_q2og
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2mod
    description: "Q2 (mod shape): auctionId %123 filter"
    query: nexmark/matrix/bidstr_q2mod
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q10
    description: "q10: CASTFROMUNIXTS reformat (civil_from_days, in-tree)"
    query: nexmark/matrix/bidstr_q10
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q14
    description: "q14: computed-float range filter"
    query: nexmark/matrix/bidstr_q14
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q22
    description: "q22: CONCAT string manipulation"
    query: nexmark/matrix/bidstr_q22
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qex
    description: "Q_ex: HOSP working example (channel-eq + 2-id-OR + price<thresh -> CONCAT alert)"
    query: nexmark/matrix/bidstr_qex
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
