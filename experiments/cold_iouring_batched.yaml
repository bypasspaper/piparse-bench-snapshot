experiment:
  name: cold_iouring_batched
  description: >
    Does BATCHED cqe reaping (io_uring_peek_batch_cqe + cq_advance, one syscall drains all
    ready completions vs one wait_cqe per completion) raise the O_DIRECT cold plateau? Tests
    the batched-reaping build at QD 64 & 128 (the §29 plateau region). O_DIRECT IoUringFile,
    cold bid_6GB passthrough, W4/IO1, pool 4096, 128 KiB, median n=3.

    COMPARE vs the pre-batched build (cold_iouring_qd_sweep §29): QD64 5.90, QD128 5.92 GB/s.
    PREDICTION: if the source thread's reap SYSCALLS were the limiter, batching lifts it toward
    the device cap (~6.7). If FLAT ~5.9 (= the bufsize sweep showed reducing per-buffer work via
    bigger buffers did NOT help either), the 5.9 ceiling is NOT source-thread-syscall-bound -- it's
    the engine pipeline / device O_DIRECT sequential rate, and no source-side lever closes 5.9->6.7
    (raw fio 6.7 is read-only; the engine also indexes + lazy-copies + sinks the bytes).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1

variants:
  - name: cold_iouring_batched
    description: "COLD O_DIRECT IoUringFile (batched reaping), QD 64 & 128"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "NES_IOURING_QD (O_DIRECT, batched reap)"
        parameter: worker_env.NES_IOURING_QD
        values: [64, 128]
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart, x_scale: log}
