experiment:
  name: ablation_r7_inmem
  description: >
    v6 CSV->JSON ablation ladder, InMemory retake -- PARALLEL rung r7 ONLY, W16. This is the rung
    the whole retake is about: v5 r7 used source_type=File (SIMDCSV PARALLEL) and pinned at the
    ~11 GB/s page-cache read wall (person_proj 11553, q2o 11128, bid_filter_eq 11191, bid_ts 10080
    -- suspiciously flat = the wall). InMemory prefill removes the read wall so r7 shows the TRUE
    scale-out ceiling. A SINGLE InMemory source suffices: inmem_w16_probe hit 24.5 GB/s on a cheap
    filter (iso_q2) from one source, and every v5 r7 File number is <=11.5 GB/s, so hand-out is not
    the wall below ~24 GB/s (filter/projection queries will jump; output-bound ones stay engine-
    bound ~10 GB/s -> that IS the real answer, not a read artifact).

    BINARY: FULL @HEAD 8217cce465 (fastpath ON) -- same binary as ablation_suite_json_inmem_seq.
    Knobs identical to v5 r7: W16, SIMDCSV PARALLEL, ccx_aware_task_queues + pin_threads, fnattr +
    inline + tcb + overload, JSON out, fast parsers.

    !!! THROUGHPUT CORRECTION !!! NES_INMEM_REPEAT=20 for a long W16 window (a single 6.4GB pass at
    10-24 GB/s is 0.3-0.6s = too short). The runner counts file bytes ONCE, so
    true_throughput = reported * 20 (InMemoryFileSource.cpp:148). APPLY x20 to this experiment's
    numbers ONLY; the seq/r5 experiments use REPEAT=1 (no correction). data_size=medium matches v5's
    per-variant file (throughput size-invariant).
    GOTCHAS: prefill ~6.4GB into a private pool at registration + 16384x128KB global pool ~8.4GB RAM
    (53GB free). ccx+pin only bite at W16. pkill -x main pre-flight; NEVER pkill -f.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_r7_inmem.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_ladder: &ladder
  label: "optimization (cumulative)"
  explicit:
    - name: r7_parallel
      baseline: true
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 16
        worker.query_engine.ccx_aware_task_queues: true
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: true
        generator.repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s, x20 for true)" }

variants:
  - name: nx_person_projection
    description: "SELECT id FROM person"
    query: nexmark/person_projection
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_person_star
    description: "SELECT * FROM person"
    query: nexmark/person_star
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_ts_projection
    description: "SELECT timestamp FROM bid"
    query: nexmark/bid_ts_projection
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_bid_filter_eq
    description: "SELECT * WHERE auctionId = 1000"
    query: nexmark/bid_filter_eq
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q0_bid_star
    description: "Q0: SELECT * FROM bid"
    query: nexmark/bid_star
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q1_price
    description: "Q1: price * 908/1000"
    query: nexmark/q1_price
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_filter_proj
    description: "Q2 (repo shape)"
    query: nexmark/q2_filter_proj
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q2_original
    description: "Q2 (PAPER shape): 5-way OR"
    query: nexmark/q2_original
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q14_calc
    description: "q14 (reduced): computed-float range filter"
    query: nexmark/q14_calc
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q10_datetime
    description: "q10 (reduced): CASTFROMUNIXTS reformat"
    query: nexmark/q10_datetime
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: nx_q22_concat
    description: "q22 (interim CONCAT)"
    query: nexmark/q22_concat
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
