experiment:
  name: hl7_prof_q2_hl7in
  description: >
    PROFILING harness (session 2026-07-31): SIMDHL7 q2 filter arm from hl7_matrix_bid_q1q2 --
    NOT a throughput datapoint. Purpose: perf-attach to the worker during a warm steady window
    and break down WHY SIMDHL7 q2 runs at 10.7 Mrows/s vs SchemaJSON's 15.2 (70%) despite q2
    touching only auctionId (+lazy price on ~0.8% survivors). Candidate suspects from the
    matrix session: per-leaf FieldOffsets emplace + pending.push_back materialization (vs
    SchemaJSON's in-place band read), 6-compare SIMD kernel cost on 1.59x bytes, spanning-tuple
    reassembly. Config = EXACT match of the q2_hl7_in/to_csv matrix arm (W1 fnattr fullopt,
    128KiB, Monitoring sink) except: warm repeat x40 (NES_FILE_REPEAT -> ~2min window), n=1.
    GOTCHA: bid URLs contain '&' -> subcomponent_delimiter '' (leaf arity 22).
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/hl7_prof_q2_hl7in.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
    then attach: NES_PROFILE_OUTDIR=<scratch> .claude/skills/nes-profile/nes-profile.sh --port 9099 --secs 12 --stat
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: hl7
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDHL7, subcomponent_delimiter: "" }
    output_formatter: { type: CSV }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 40
    mode: burst
    rate: 1000000

variants:
  - name: prof_q2_hl7in
    description: "WARM bid hl7 5.72GB x40, W1 SIMDHL7 q2 filter -> CSV out -- perf target"
    query: nexmark/bid_hl7_q2
    axes:
      x:
        label: "config"
        explicit:
          - name: "prof_q2_hl7in"
            baseline: true
            overrides: {}
    y: { metric: throughput_mbps, label: "Throughput (MB/s, input bytes)" }
    visualization: { type: bar_chart }
