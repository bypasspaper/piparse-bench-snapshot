experiment:
  name: tcp_source_count
  description: >
    TCP source-count scaling (premise 6: heterogeneous ingestion = separate parallel
    queries, NOT one UNION). N concurrent independent bid_passthrough queries, each
    with its own TCP source connection; measures AGGREGATE ingestion throughput
    (MonitoringSink sums per-query) vs source count. Passthrough + output_format=CSV
    => parse ELIDED (pure ingestion test). W=16, IO=4 (io capacity for multiple
    sources), pool 4096 (512 MB stateless optimum), repeat 4 (steady), blocking
    generator. Baselines: single engine TCP source (rung-2b) ~5.9 GB/s; raw loopback
    ceiling (rung-2a) 3.71/conn -> 14.4 @ 4 conns.

    GOTCHAS (read before trusting numbers):
    - num_queries=N submits N copies of the query; ALL connect to ONE generator on
      port 1111 (runner serves -n N clients, blocking thread-per-client). So the
      ONE generator process may itself CAP aggregate send (~the rung-2a loopback
      ceiling). If aggregate plateaus, check generator CPU (pidstat) before blaming
      the engine -- it may be generator-bound, not engine-bound. (To exceed that,
      we'd need multiple generator processes / NICs.)
    - Aggregate throughput = sum of N per-query MonitoringSink throughputs (each over
      its own size/processing-time window); concurrent queries share the W=16 MPMC
      task queue, the io threads, the 512 MB pool, and DRAM bandwidth.
    - repeat 4 => N x 6.44 GB x 4 streamed total; passthrough recycles buffers (output
      not retained), so the 512 MB pool is fine. Stateless => 512 MB is the right pool
      (NOT the stateful many-small-buffers regime).
    - Each query writes its own query_<i>_monitoring.csv (per-query metrics preserved).

  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node

  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 4
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 131072          # 128 KiB
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096   # 512 MB stateless optimum

  query_config:
    source_type: TCP
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
    input_parser:
      uint64: TracedUINT64
      int32: TracedINT32
      int64: TracedINT64
    output_formatter:
      type: CSV                             # lazy passthrough -> parse elided (pure ingestion)

  generator:
    repeat: 4
    mode: burst
    rate: 1000000

variants:
  - name: tcp_source_count
    description: "aggregate ingestion vs concurrent TCP source count"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "Concurrent TCP sources (independent passthrough queries)"
        parameter: num_queries
        values: [1, 2, 4, 8]
    y:
      metric: throughput_mbps
      label: "Aggregate Throughput (MB/s)"
    visualization:
      type: line_chart
