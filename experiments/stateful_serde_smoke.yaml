experiment:
  name: stateful_serde_smoke
  description: >
    STATEFUL tier regeneration at current tip (same code state as the stateless regen:
    b5d757c9f6 + knobs + eqImpl fix). 3 queries (ysb_1k_varsized / q8_join / cm_q2) x 3 NES
    serde arms x W23 x 10 reps: simd = SIMDCSV csv->JSON (5-arm faithful), csv_native =
    SIMDCSV csv->NATIVE (deser-only), native_native = SystemNative->NATIVE (true no-serde).
    naive NOT retaken (Aug-14 corrected stateful naive kept — single-thread, drift-immune);
    Flink/Spark kept verbatim. repeat=1 ALWAYS (event-time windows: replay = heap-corruption
    bug). Per-query: ysb data xlarge/xlarge_native, string_length "37,37,37,37,9,9,8";
    q8 stateful pool (4 KiB op buffers + 2M global buffers) + string_length "16,32,32,16,4,256";
    cm string_length "16". NATIVE output on windowed-aggregate sinks + csv->NATIVE stateful are
    UNTESTED combos -> SMOKE (reps=1 copy) before the full run. 5-arm anchors (native->JSON/simd):
    ysb 284.5/269.0, q8 3.97/?, cm 9.02/8.63 M rows/s. Metric throughput_mrows_s.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/stateful_serde_regen.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: MmapFile
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
      allow_commas_in_strings: false
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter:
      type: JSON
    output_parser:
      f64: ZMIJF64
      f32: ZMIJF32
  generator:
    repeat: 1
  worker_env:
    NES_MMAP_POPULATE: '1'
_wk_x: &wk_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]
_y: &y
  metric: throughput_mrows_s
  label: "Throughput (M records/s)"
variants:
  - name: ysb_1k_varsized
    description: "YSB varsized 1k, tumble 30s count per campaign (input-bound pole)"
    query: yahoo/ysb_1k_varsized
    overrides:
      data_size: xlarge
    axes:
      x: *wk_x
      series:
        label: "arm"
        explicit:
          - name: simd
            baseline: true
            overrides: {}
          - name: csv_native
            overrides:
              query_config.output_formatter: { type: NATIVE }
              query_config.output_parser: {}
          - name: native_native
            overrides:
              data_size: xlarge_native
              query_config.input_formatter: { type: SystemNative, string_length: "37,37,37,37,9,9,8" }
              query_config.input_parser: {}
              query_config.output_formatter: { type: NATIVE }
              query_config.output_parser: {}
    y: *y
    visualization: { type: grouped_bar }
  - name: q8_join
    description: "Nexmark Q8: person JOIN auction, tumble 10s (state-dominated pole)"
    query: nexmark/q8_join
    overrides:
      worker.default_query_execution.operator_buffer_size: 4096
      worker.number_of_buffers_in_global_buffer_manager: 2000000
    axes:
      x: *wk_x
      series:
        label: "arm"
        explicit:
          - name: simd
            baseline: true
            overrides: {}
          - name: csv_native
            overrides:
              query_config.output_formatter: { type: NATIVE }
              query_config.output_parser: {}
          - name: native_native
            overrides:
              data_size: native
              query_config.input_formatter: { type: SystemNative, string_length: "16,32,32,16,4,256" }
              query_config.input_parser: {}
              query_config.output_formatter: { type: NATIVE }
              query_config.output_parser: {}
    y: *y
    visualization: { type: grouped_bar }
  - name: cm_q2
    description: "ClusterMonitoring Q2: sliding 60s/1s SUM(cpu) by jobId, eventType=3 (middle)"
    query: cluster_monitoring/q2_original
    axes:
      x: *wk_x
      series:
        label: "arm"
        explicit:
          - name: simd
            baseline: true
            overrides: {}
          - name: csv_native
            overrides:
              query_config.output_formatter: { type: NATIVE }
              query_config.output_parser: {}
          - name: native_native
            overrides:
              data_size: native
              query_config.input_formatter: { type: SystemNative, string_length: "16" }
              query_config.input_parser: {}
              query_config.output_formatter: { type: NATIVE }
              query_config.output_parser: {}
    y: *y
    visualization: { type: grouped_bar }
