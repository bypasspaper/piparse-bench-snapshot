experiment:
  name: iouring_profile
  description: >
    Single cold O_DIRECT IoUringFile run (QD64, W4/IO1, pool 4096, 128 KiB) for per-thread
    CPU profiling: is the DataSrc (io_uring read/reap/emit) thread at 100%, are the 4
    WorkerThreads at 100%? Localizes the 5.9 GB/s plateau (source thread vs workers vs
    device-wait). Run alongside a /proc per-thread sampler (scratchpad/profile_threads.py).
    One run, no aggregation needed.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64

variants:
  - name: iouring_profile
    description: "single cold O_DIRECT IoUringFile QD64 for thread profiling"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "run"
        explicit:
          - name: "profile"
            baseline: true
            overrides: {}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
