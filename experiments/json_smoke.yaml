# SPDX-License-Identifier: Apache-2.0
experiment:
  name: json_smoke
  description: >
    SMOKE test for the JSON-input pipeline: bid passthrough over bid_smoke.json (200K NDJSON rows),
    measured json->json and json->csv, to validate the SequentialJSON File source + pbench path before
    generating the full 5-6GB datasets. r6 fullopt, W1, single-node/fused.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: JSON }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: json_to_json
    description: "bid passthrough, JSON in -> JSON out"
    query: nexmark/bid_json_smoke
    axes:
      x: *noop_x
      series:
        label: "config"
        explicit:
          - name: j2j
            baseline: true
            overrides: { query_config.output_formatter: { type: JSON } }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: json_to_csv
    description: "bid passthrough, JSON in -> CSV out"
    query: nexmark/bid_json_smoke
    axes:
      x: *noop_x
      series:
        label: "config"
        explicit:
          - name: j2c
            baseline: true
            overrides: { query_config.output_formatter: { type: CSV } }
    y: *tput_y
    visualization: { type: grouped_bar }
