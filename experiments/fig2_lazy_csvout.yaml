# SPDX-License-Identifier: Apache-2.0
experiment:
  name: fig2_lazy_csvout
  description: >
    Fig2 STAGE-CPU companion (2026-09-25): compiled LAZY rung with CSV output instead of JSON, pass_n1..10, 3 reps.
    csv->CSV lazy = whole-row coalesced memmove + tuple delimiter (pure copy, no per-field keys). Used ONLY to split
    the lazy rung's opaque JIT block by differencing: ns(json lazy) - ns(csv lazy) = JSON per-field framing (serialize);
    the rest of the JIT block = raw copy + scan glue (process). Same config as fig2_fieldsweep_v2 compiled_lazy
    (repeat 100, fnattr, fast codecs, InMemory W1). generator.repeat == NES_INMEM_REPEAT.
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 600
  overload: false
  worker:
    query_engine: {number_of_worker_threads: 1, number_of_io_threads: 1, invoke_mode_configuration: fnattr, pin_threads: false, admission_queue_size: 1024}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: sequential}
    input_parser: {f64: EiselFloatF64}
    output_formatter: {type: CSV}
    output_parser: {f64: ZMIJF64}
  generator: {repeat: 100, mode: burst, rate: 1000000}
  worker_env: {NES_INMEM_PREFILL: '1', NES_INMEM_REPEAT: '100', NES_INMEM_BUFSIZE: '131072'}
variants:
  - name: lazy_csvout
    description: "compiled lazy, CSV output, N=1..10"
    queries: [multicol/pass_n1, multicol/pass_n2, multicol/pass_n3, multicol/pass_n4, multicol/pass_n5, multicol/pass_n6, multicol/pass_n7, multicol/pass_n8, multicol/pass_n9, multicol/pass_n10]
    axes:
      x: {label: "source fields N", explicit: [{name: sweep, baseline: true, overrides: {}}]}
    y: {metric: throughput_mrows_s, label: "records/s"}
    visualization: {type: bar_chart}
