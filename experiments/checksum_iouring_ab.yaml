experiment:
  name: checksum_iouring_ab
  description: >
    CORRECTNESS gate for the io_uring source: prove IoUringFile delivers byte-identical
    data to the async File baseline before trusting its throughput (cold_iouring_ab.yaml).

    Same bid_6GB passthrough (W=4 / IO=1, pool 4096), Checksum sink, two arms differing
    ONLY in source_type: File vs IoUringFile. The Checksum sink accumulates an order- and
    content-sensitive checksum over the materialized output and writes "count,checksum" at
    EoS; the runner echoes a [checksum] line per run. Since the two arms are identical
    apart from the source, EQUAL (count, checksum) ⇒ IoUringFile ingested exactly the same
    bytes in the same order ⇒ the deep-QD ring + in-order reaping is correct. ANY missing,
    duplicated, or out-of-order buffer corrupts cross-buffer tuple stitching and shows up as
    a different checksum.

    WARM (no cold_read): correctness is independent of cache state, and warm is faster. The
    6.44 GB single pass at 128 KiB = ~49k buffers, QD16 ⇒ thousands of ring refills and
    out-of-order completion opportunities — good coverage of the reorder path. n=1 (the
    checksum is deterministic).

    PASS CRITERION: the two [checksum] lines are identical. If they differ, do NOT run the
    throughput A/B — fix the source first.

    GOTCHAS: needs bid_6GB.csv + the worker rebuilt with liburing. Sandbox OFF (:8080).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    sink_type: Checksum
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: checksum_iouring_ab
    description: "bid_6GB passthrough Checksum: async File vs IoUringFile"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "source"
        explicit:
          - name: "File"
            baseline: true
            overrides: {query_config.source_type: File}
          - name: "IoUringFile"
            overrides: {query_config.source_type: IoUringFile}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
