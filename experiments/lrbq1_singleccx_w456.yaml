# SPDX-License-Identifier: Apache-2.0
experiment:
  name: lrbq1_singleccx_w456
  description: >
    SINGLE-CCX SCALING PROBE (user follow-up to lrbq1_ccx_layout_ab): W in {4,5,6},
    COMPACT layout only, both formats. W5-compact = 1 io + 5 workers = EXACTLY one full
    6-core CCX (the max single-CCX point, which the 4/8/16 grid skipped); W6-compact =
    first worker spills onto CCX1. SEPARATES: does the convoy grow even WITHIN one L3
    domain (W5 >= W4 wall despite +25% compute), or does single-CCX scaling still pay
    (W5 < W4) with degradation only starting at the W6 boundary crossing?

    RESULTS (2026-07-13, 18/18, reps=3 median, tight): SINGLE-CCX SCALING PAYS TO THE
    FULL CCX, THE FIRST SPILLED WORKER ERASES IT:
      W | csv_compact          | nat_compact
      4 | 5.66s [5.54-5.83]    | 5.28s [5.19-5.30]
      5 | 5.36s [5.31-5.45]    | 4.73s [4.69-4.80]   <- NEW GLOBAL OPTIMUM
      6 | 5.67s [5.58-5.98]    | 5.88s [5.83-6.03]
    W5-compact (1 io + 5 workers = exactly one full CCX) beats W4 by 5% (csv) / 10%
    (native); ONE worker on CCX1 (W6) costs +6% / +24% - more than the 6th worker's
    compute is worth. Within one L3 domain the SharedMutex convoy is mild (scaling
    holds to 5 workers); the cliff is the moment the lock line starts crossing L3
    domains, then the thread-count convoy compounds on top (W8/W16 compact numbers in
    lrbq1_ccx_layout_ab). BEST KNOWN CONFIG for trigger-bound queries: compact W5 -
    native 4.73s = 4.05x faster than the default striped W16 (19.14s); csv 5.36s =
    2.4x. The user's '1io+5workers per CCX' unit is exactly right.
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: xlarge
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int32: FastINT32
      int16: TracedINT16
      f32: EiselFloatF32
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_axes_x: &w_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [4, 5, 6]

variants:
  - name: lrbq1_layout
    query: lrb/q1_avg_speed
    axes:
      x: *w_x
      series:
        label: "format x pin layout"
        explicit:
          - name: csv_compact
            baseline: true
            overrides:
              worker_env.NES_CCX_PIN_LAYOUT: compact
          - name: nat_compact
            overrides:
              data_size: xlarge_native
              query_config.input_formatter: { type: SystemNative, string_length: "16" }
              query_config.input_parser: {}
              worker_env.NES_CCX_PIN_LAYOUT: compact
    y: { metric: processing_time_s, label: "Processing time (s)" }
    visualization: { type: line_chart }
