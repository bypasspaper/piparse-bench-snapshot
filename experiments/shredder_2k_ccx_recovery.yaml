# SPDX-License-Identifier: Apache-2.0
experiment:
  name: shredder_2k_ccx_recovery
  description: >
    Can CCX-aware placement recover the 2KiB e2e collapse (proven to be cross-CCX Infinity-Fabric
    coherence of per-buffer coordination)? bid CSV->CSV passthrough, InMemory prefill, 2KiB buffers,
    bypass (SIMDCSV LOCK_FREE). 3 configs x threads: baseline(pin off/ccx off) | pin only | pin+ccx-aware
    task queues (per-CCX admission shards, workers prefer own-CCX tasks). Hypothesis: pinning/ccx keep
    coordination intra-CCX -> recover throughput at high thread counts (which span CCXs). y = rows/s =
    31.3M x REPEAT(10)/proc_time (reported per-pass CSV MB/s -> x10x1e6/34.8).
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_2k_ccx_recovery.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 8
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: false
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 10
    NES_INMEM_BUFSIZE: 2048

variants:
  - name: ccx_recovery
    description: "2KiB bypass lock-free: baseline vs pin vs pin+ccx-aware, x=threads"
    query: nexmark/bid_pass_scaling
    axes:
      x:
        label: "worker threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [1, 4, 8, 12, 16, 24]
      series:
        label: "placement"
        explicit:
          - name: baseline_off
            baseline: true
            overrides:
              worker.query_engine.pin_threads: false
              worker.query_engine.ccx_aware_task_queues: false
          - name: pin_only
            overrides:
              worker.query_engine.pin_threads: true
              worker.query_engine.ccx_aware_task_queues: false
          - name: pin_ccx
            overrides:
              worker.query_engine.pin_threads: true
              worker.query_engine.ccx_aware_task_queues: true
    y:
      metric: throughput_mbps
      label: "Throughput (MB/s)"
    visualization:
      type: line_chart
