# SPDX-License-Identifier: Apache-2.0
experiment:
  name: shredder_latency_probe
  description: >
    PROBE: does spanning-tuple size affect e2e latency once the deep admission queue is removed? The deep-queue
    throughput config (in-flight 8192) makes latency ~ queue residence (Little's law ~8ms), which is flat across
    span. Here we shrink the in-flight cap to 64 + batching off (K=1) so queue residence ~= 60us and latency =
    real processing (index+parse+REASSEMBLY+emit). Two extreme spans (4KB row=1-buffer span vs 640KB row=156
    spans @4KiB), {LF,LK}. HYPOTHESIS: latency drops vs deep-queue AND the 640KB point rises above the 4KB point
    (reassembly shows up), with LOCKING rising more (lock held across the span). If flat here too, span genuinely
    doesn't matter. Compare p50/p99 to the deep-queue span sweep (4KB: both spans ~10-20ms flat).
    RUN: cd ~/work/piparse-bench && pkill -9 -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_latency_probe.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: p99_latency_us
  higher_is_better: false
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 8192
    dump_compilation_result: NONE
    default_max_inflight_buffers: 64      # SHALLOW (was 8192) -> queue residence collapses -> latency = processing
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 8
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 8
    NES_INMEM_BUFSIZE: 4096
    NES_SOURCE_EMIT_BATCH: 1              # batching OFF (no batch-induced delay)
    NES_LOG_LEVEL: WARNING
    NES_TASKQUEUE_STATS: 1
_span_series: &span_series
  label: "shredder"
  explicit:
    - name: lock_free
      baseline: true
      overrides:
        query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    - name: locking
      overrides:
        query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCKING }
_k1_x: &k1_x
  label: "source emit batch K"
  parameter: worker_env.NES_SOURCE_EMIT_BATCH
  values: ["1"]
variants:
  - name: row_004k_span1
    query: formatter/bigstr_id_pass_4k
    axes: { x: *k1_x, series: *span_series }
    y: { metric: p99_latency_us, label: "p99 latency (us)" }
    visualization: { type: line_chart }
  - name: row_640k_span156
    query: formatter/bigstr_id_pass_640k
    axes: { x: *k1_x, series: *span_series }
    y: { metric: p99_latency_us, label: "p99 latency (us)" }
    visualization: { type: line_chart }
