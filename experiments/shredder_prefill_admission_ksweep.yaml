# SPDX-License-Identifier: Apache-2.0
experiment:
  name: shredder_prefill_admission_ksweep
  description: >
    "What if the source PREFILLS the admission queue?" -- one step toward the standalone/isolated harness
    (workers drain a pre-filled queue) but not the same (single source still builds serially). Implemented by
    raising the in-flight bound + admission_queue_size huge (no backpressure) and sweeping the burst size K
    (NES_SOURCE_EMIT_BATCH) from 32 up to 16384. Single source, bigstr_id_pass (shredder-isolated), 4 KiB, W24,
    LF vs LK. HYPOTHESIS: large K = build K unpublished (workers IDLE) then release(K) burst-drain (24 workers
    hammer the shredder continuously) -> LF/LK grows toward the isolated 2x, BUT throughput COLLAPSES because
    build/drain no longer overlap (serialized). Small K (16-32) = overlapped pipeline = best throughput, modest
    gap. Reads: LF/LK vs K (up), throughput vs K (down), avgDepthOnFastAcquire vs K (up) from worker.log.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_prefill_admission_ksweep.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 32768      # huge: can hold a whole pass (128K buffers @4K) -> source can prefill deep
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 8192
    dump_compilation_result: NONE
    default_max_inflight_buffers: 8192  # worker-level; remove the backpressure cap so source is bounded only by K / drain rate
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 8
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 8
    NES_INMEM_BUFSIZE: 4096
    NES_LOG_LEVEL: WARNING
    NES_TASKQUEUE_STATS: 1
variants:
  - name: ksweep
    query: formatter/bigstr_id_pass
    axes:
      x:
        label: "source emit batch K (admission prefill depth)"
        parameter: worker_env.NES_SOURCE_EMIT_BATCH
        values: ["32", "256", "2048", "8192"]
      series:
        label: "shredder"
        explicit:
          - name: lock_free
            baseline: true
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
          - name: locking
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCKING }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: line_chart }
