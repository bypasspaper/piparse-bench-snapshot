# SPDX-License-Identifier: Apache-2.0
experiment:
  name: shredder_selid_bufsweep
  description: >
    User idea: avoid the 80KB varsized output COPY by projecting a small field. SELECT id FROM
    (id,80KB string) -> the string still makes rows span buffers (shredder works) but output is 8 bytes
    (no copy). Sweep input buffer size {4,16,32,64 K} x LF vs LK, single-source InMem prefill, W24. Tests
    whether removing the copy makes the engine shredder/worker-bound (not copy/emitter-bound) so LF/LK
    diverges. LF/LK ratio is accounting-robust. Also compare absolute vs the SELECT-s copy runs.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/shredder_selid_bufsweep.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 2
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 24
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 262144
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 200000
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 40
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 40
    NES_LOG_LEVEL: WARNING
variants:
  - name: selid
    query: formatter/bigstr_id_pass
    axes:
      x:
        label: "input buffer size (bytes)"
        parameter: worker_env.NES_INMEM_BUFSIZE
        values: ["4096", "16384", "32768", "65536"]
      series:
        label: "shredder"
        explicit:
          - name: lock_free
            baseline: true
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
          - name: locking
            overrides:
              query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCKING }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: line_chart }
