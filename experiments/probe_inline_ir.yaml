experiment:
  name: probe_inline_ir
  description: >
    IR-LEVEL PROBE for the new runtime inline knob (worker.query_engine.inline_invoke_calls,
    NES plumb 2026-07-17). NOT a timing experiment — it exists to PROVE the knob changes the
    generated code, by dumping the JIT IR with the flag ON vs OFF and diffing the proxy calls.

    WHAT TO LOOK FOR (worker log, dump_compilation_result: CONSOLE):
      inline_off -> the accessor proxies appear as CALLS in the IR
                    (getMemArea / NES_Memory_TupleBuffer_getMemArea, getBandDataProxy)
      inline_on  -> those calls are GONE (spliced in as bitcode)
    Per the x64 handover those two proxies cost 9% (getMemArea) + 3.4% (getBandDataProxy) of
    single-thread cycles, and inlining them was worth +34-38%/core — so bid_ts_projection
    (trivial per-row work => proxy-dominated) is the query where they are most visible.

    MECHANISM: mlir.inline_invoke_calls is a nautilus option; NES used to hardcode it to
    `true` at LowerToCompiledQueryPlanPhase.cpp:134. It is now read from config. It is a
    GLOBAL master switch: it covers BOTH the accessor proxies and the NAUTILUS_TAGGED_INLINE
    parse wrappers. It can only SUPPRESS inlining of functions whose bitcode was emitted at
    BUILD time (NAUTILUS_INLINE + nautilus_inline(<target>)); it can never make a new
    function inlinable and cannot select per-function — that stays in InlineTagConfig.yaml.

    RUN (keep the worker logs, they hold the IR):
      PBENCH_KEEP_LOGS=1 pbench run experiments/probe_inline_ir.yaml \
        --build-dir <repo>/cmake-build-release --worker-port 9099
    then grep the worker logs for: getMemArea, getBandDataProxy, 'func.func @execute'

    PORT: 9099 — host 8080 is held by an unrelated docker container (famedly-headless);
    the default fails every run with "nes-cli failed (exit 1)" and EMPTY stderr.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true      # overridden per series — THE knob under test
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: CONSOLE   # dump the JIT IR to the worker log
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    output_formatter: { type: CSV }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_series: &inline_ab
  label: "inline_invoke_calls"
  explicit:
    - name: inline_off
      baseline: true
      overrides:
        worker.query_engine.inline_invoke_calls: false
    - name: inline_on
      overrides:
        worker.query_engine.inline_invoke_calls: true

_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

variants:
  - name: probe_bid_ts_projection
    description: "SELECT timestamp FROM bid - trivial per-row work => the accessor proxies dominate"
    query: nexmark/bid_ts_projection
    axes: { x: *noop_x, series: *inline_ab }
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: grouped_bar }
