# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_ir_probe
  description: >
    PROBE for the tcb IR study. ONE cell (r6-equivalent: tcb ON, inline ON, W1, compiled
    SequentialCSV -> JSON) on tiny data (bid_5K, 165 rows). Sole purpose: (1) confirm the
    worker-cli vehicle compiles a JSON-output query on tiny data, (2) locate where nautilus
    writes dump.file IR, (3) eyeball one real dump. dump_compilation_result=FILE.
    RUN: cd ~/work/piparse-bench && pkill -x main; PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_ir_probe.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: tiny
  topology: single-node
  warm_read: true
  completion_timeout_s: 300
  overload: false
  worker:
    dump_compilation_result: FILE
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: pricecalc_ir
    description: "2x INT32 JSON glue probe"
    query: nexmark/pricecalc
    axes:
      x: *noop_x
      series:
        label: "cell"
        explicit:
          - name: r6_tcb_on_inline_on
            baseline: true
            overrides:
              worker.query_engine.trace_constant_bytes: true
              worker.query_engine.inline_invoke_calls: true
    y: *tput_y
    visualization: { type: grouped_bar }
