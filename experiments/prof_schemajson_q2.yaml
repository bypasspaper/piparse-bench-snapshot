# SPDX-License-Identifier: Apache-2.0
experiment:
  name: prof_schemajson_q2
  description: >
    HACK A/B: JSON input only, NATIVE output (parse-to-native isolation). Run TWICE:
      baseline:  uv run python bench.py run experiments/json_hack_ab.yaml --build-dir ... --worker-port 9099
      hacked:    NES_JSON_HACK=1 uv run python bench.py run experiments/json_hack_ab.yaml ...
    The hack collapses the N per-field extract invokes + doc-advance invoke into ONE invoke/row
    (batch raw_json via simdjson find_field; downstream lazy+codec unchanged). Engages only for
    all-numeric projections (q2, q1); pass falls back to per-field (varsized) => unchanged control.
    Compare json processing_time_s baseline vs hacked. Worker log prints "NES_JSON_HACK: batch path
    ENGAGED/skipped" at compile time.
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: json
  topology: single-node
  warm_read: true
  cold_read: false
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SchemaJSON }
    output_formatter: { type: NATIVE }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 40

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_time_y: &time_y { metric: processing_time_s, label: "Processing time (s), lower=faster" }

_json_series: &json_series
  label: "input"
  explicit:
    - name: schemajson
      baseline: true
      overrides:
        data_size: json
        query_config.input_formatter: { type: SchemaJSON }

variants:
  - name: q2
    description: "Q2 json->NATIVE (batch path ENGAGES)"
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *json_series }
    y: *time_y
    visualization: { type: grouped_bar }
