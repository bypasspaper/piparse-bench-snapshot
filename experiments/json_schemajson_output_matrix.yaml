experiment:
  name: json_schemajson_output_matrix
  description: >
    Does SchemaJSON keep the CSV-style LAZY varsized passthrough on the OUTPUT path, where the
    on-demand "JSON" formatter cannot? Prior finding (json-input-investigation): on-demand JSON
    materialises varsized via simdjson get_string (copy + unescape) into a VariableSizedData, so it
    uses the NON-lazy writeJsonStringValue opaque invoke and CANNOT take the raw-forward passthrough
    fast-path (the 2.12x ablation win) that CSV enjoys. SchemaJSON emits (start,end) byte spans into
    FieldOffsets<TWO> exactly like CSV, and parseRawValueIntoRecord turns a DOUBLE_QUOTE varsized into
    a LazyValueRepresentation (raw ptr+1/size-2, quotes stripped lazily) -- the SAME lazy raw-span as
    CSV. So SchemaJSON SHOULD hit the lazy passthrough fast-path and beat on-demand JSON on the output
    matrix, behaving like CSV.

    Two INPUT formatters x two OUTPUT formats x two queries, all over the IDENTICAL bid_strings_3GB.json
    (5.57GB, 31.3M rows). All four arms read the same .json bytes, so throughput MB/s (engine-measured on
    INPUT bytes) is directly comparable across every arm.
      jin_j2j   = on-demand JSON  -> JSON out   (baseline; varsized materialised -> non-lazy writer)
      sjson_j2j = SchemaJSON       -> JSON out   (hypothesis: lazy passthrough kicks in)
      jin_j2c   = on-demand JSON  -> CSV  out
      sjson_j2c = SchemaJSON       -> CSV  out
    Queries: passthrough (SELECT auctionId,bidder,price,channel,url; 2 varsized) and star (SELECT *; 6
    fields). r6 fullopt, W1, single-node/FUSED (the fused topology is where the raw-forward fast-path
    applies), 128KiB buffers, governor performance, n=5 median. CORRECTNESS gate first via
    json_schemajson_output_smoke.yaml (Checksum sink; schemajson output must be byte-identical to
    on-demand JSON for EACH output format -- catches any quote/escape mishandling in the lazy path).
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_schemajson_output_matrix.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: JSON }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s on JSON input bytes)" }

# arm = (INPUT formatter, OUTPUT formatter). All read the SAME .json, so MB/s is comparable across arms.
_fmt_series: &fmt_series
  label: "in->out"
  explicit:
    - name: jin_j2j
      baseline: true
      overrides:
        query_config.input_formatter: { type: JSON }
        query_config.output_formatter: { type: JSON }
    - name: sjson_j2j
      overrides:
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: JSON }
    - name: jin_j2c
      overrides:
        query_config.input_formatter: { type: JSON }
        query_config.output_formatter: { type: CSV }
    - name: sjson_j2c
      overrides:
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: CSV }

variants:
  - name: passthrough
    description: "bid passthrough (5 fields, 2 varsized), JSON in -> {JSON,CSV} out, on-demand vs SchemaJSON"
    query: nexmark/bid_json_passthrough
    axes: { x: *noop_x, series: *fmt_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: star
    description: "bid SELECT * (6 fields, 2 varsized), JSON in -> {JSON,CSV} out, on-demand vs SchemaJSON"
    query: nexmark/bid_json_star
    axes: { x: *noop_x, series: *fmt_series }
    y: *tput_y
    visualization: { type: grouped_bar }
