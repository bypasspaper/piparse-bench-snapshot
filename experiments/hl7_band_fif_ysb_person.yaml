# SPDX-License-Identifier: Apache-2.0
experiment:
  name: hl7_band_fif_ysb_person
  description: >
    Post-optimization re-measure (session 2026-07-31) of the SIMDHL7 input rows of
    hl7_matrix_ysb_person after the HL7 single-band FIF landed (see hl7_band_fif_bid for the
    change; bid re-measure: pass +41%, q2 +56%, q1 +35% row rate). These two rows quantify the
    win off-bid: long-varsized payloads amortized the OLD per-leaf overhead (HL7-in was 85%/88%
    of SchemaJSON row rate on ysb/person vs 77% on bid), so the expected relative gain is
    smaller here.
    BASELINES (2026-07-30, same config, n=5 median, MB/s on input bytes . Mrows/s):
      ysb    hl7_in: ->CSV 1373 . 8.3 | ->HL7 1125 . 6.8 | ->JSON 1174 . 7.1
      person hl7_in: ->CSV 1872 . 6.5 | ->HL7 1620 . 5.6 | ->JSON 1481 . 5.2
    Reference rails (unchanged): ysb SchemaJSON ->CSV 9.8, person SchemaJSON ->CSV 7.4 Mrows/s.
    HL7 arms use DEFAULT delimiters (no '&' issue outside bid); ysb arity 28, person 25.
    W1 fnattr fullopt, 128KiB, warm, Monitoring sink, n=5 median.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/hl7_band_fif_ysb_person.yaml --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: hl7
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDHL7 }
    output_formatter: { type: CSV }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s, input bytes)" }

_out_series_ysb: &out_series_ysb
  label: "output"
  explicit:
    - name: to_csv
      baseline: true
      overrides: { query_config.output_formatter: { type: CSV } }
    - name: to_json
      overrides: { query_config.output_formatter: { type: JSON } }
    - name: to_hl7
      overrides: { query_config.output_formatter: { type: HL7, segment_name: YSB } }

_out_series_pid: &out_series_pid
  label: "output"
  explicit:
    - name: to_csv
      baseline: true
      overrides: { query_config.output_formatter: { type: CSV } }
    - name: to_json
      overrides: { query_config.output_formatter: { type: JSON } }
    - name: to_hl7
      overrides: { query_config.output_formatter: { type: HL7, segment_name: PID } }

variants:
  - name: ysb_hl7_in
    description: "ysb passthrough, SIMDHL7 band-FIF input (default delimiters) -> {CSV,JSON,HL7} out"
    query: yahoo/ysb_1k_hl7_passthrough
    axes: { x: *noop_x, series: *out_series_ysb }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: person_hl7_in
    description: "person passthrough, SIMDHL7 band-FIF input (default delimiters) -> {CSV,JSON,HL7} out"
    query: nexmark/person_hl7_passthrough
    axes: { x: *noop_x, series: *out_series_pid }
    y: *tput_y
    visualization: { type: grouped_bar }
