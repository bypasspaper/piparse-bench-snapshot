experiment:
  name: q22_constfold_allconst
  description: >
    ALL-CONSTANT CONCAT sweep (machine-generated redundant CONCAT). SELECT auctionId,
    CONCAT(CONCAT(...CONCAT(c1,c2)...),ck) AS alert FROM bid -- k 8-byte constants, NO runtime field
    between them, so the whole alert value is a compile-time constant identical on every row. IR-verified:
    the engine does NOT fold it to one constant (fragments stay separate globals) => k constant span-copies
    per row. This is the cleanest COUNT axis (no channel-interleave confound of q22_constfold_count).
    k in {1,2,4,6,8,12}; k=1 == a single 8B literal (== q22_constfold n08). CSV->JSON, W1, InMemory.
    One-knob A/B: trace_constant_bytes off (k call memcpy) vs on (k folded @nautilus_const_bytes globals);
    inline+fnattr held on. Compare vs the SIZE sweep (q22_constfold) at equal total bytes: one 8k-byte
    literal (1 copy/row) vs k 8-byte constants (k copies/row) = the throughput the engine leaves on the
    table by not collapsing the redundant CONCAT.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/q22_constfold_allconst.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 5
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 5
    NES_INMEM_BUFSIZE: 131072

_arms: &arms
  label: "arm"
  explicit:
    - name: tcb_off
      baseline: true
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: tcb_on
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: { uint64: FastUINT64, int32: FastINT32, f64: EiselFloatF64 }
        query_config.output_parser: { f64: ZMIJF64 }
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: false
        generator.repeat: 5

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: a01
    description: "1 const fragment (8B; == single literal n08)"
    query: q22cf/a01
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: a02
    description: "2 all-const fragments (16B)"
    query: q22cf/a02
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: a04
    description: "4 all-const fragments (32B)"
    query: q22cf/a04
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: a06
    description: "6 all-const fragments (48B; vs size n48)"
    query: q22cf/a06
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: a08
    description: "8 all-const fragments (64B)"
    query: q22cf/a08
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: a12
    description: "12 all-const fragments (96B; vs size n96)"
    query: q22cf/a12
    axes: { x: *noop_x, series: *arms }
    y: *tput_y
    visualization: { type: grouped_bar }
