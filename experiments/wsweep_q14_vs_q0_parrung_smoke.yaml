# SPDX-License-Identifier: Apache-2.0
experiment:
  name: wsweep_q14_vs_q0_parrung_smoke
  description: >
    PAR-RUNG DECOMPOSITION PROBE (2026-10-06): why does the v7 ablation ladder's
    parallelization rung (r7/r6b) pay q14 16.9x but q0 only 6.1x, when their W1 rates are
    within 3% (2664 vs 2579 MB/s)? The whole ratio lives in the W23 NUMERATOR (16366 vs
    43546 MB/s true). q0's W23 cell is the documented field-wise JSON serialization
    store-stall plateau (OUTPUT_PLATEAU_PROBE_RESULTS.md: flat from W12, 25.5 GB/s of
    output bytes, store_queue_rsrc_stall 0.285/cycle, IPC 0.78). No q14 W-sweep existed.
    This probe takes the W curve for BOTH queries at the exact r7 config (InMemory prefill
    REPEAT=20 -> true = reported x20, SIMDCSV PARALLEL, fnattr+inline+tcb, 128 KiB operator
    buffers, ccx off / pin off, 1 io thread) plus a NATIVE-output arm per query (no
    field-wise text serialization) at W in {1,8,16,23} to isolate the output wall.
    data_size MUST stay csv (matrix catalog entries are per-family; an unknown value
    silently falls back to the FIRST entry = json bytes into the CSV parser).
    Anchors expected at W23: q0_json ~820-830 MB/s reported (v7 r7 16366 true),
    q14_json ~2180 MB/s reported (v7 r7 43546 true).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      bool: TracedBOOL
      f64: EiselFloatF64
      f32: EiselFloatF32
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072

_wsweep: &wsweep
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]

_wsweep_coarse: &wsweep_coarse
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]

_cfg: &cfg
  label: "config"
  explicit:
    - name: r7_cfg
      baseline: true
      overrides: {}

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s reported; TRUE = x20)" }

variants:
  - name: q14_json
    description: "q14 computed-float range filter, csv->json: the 16.9x par-rung query (NEW DATA)"
    query: nexmark/matrix/bidstr_q14
    axes: { x: *wsweep, series: *cfg }
    y: *tput_y
    visualization: { type: line_chart }
  - name: q0_json
    description: "q0 SELECT * csv->json: the 6.1x par-rung query (drift control vs the 2026-08-06 sweep)"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *wsweep, series: *cfg }
    y: *tput_y
    visualization: { type: line_chart }
  - name: q14_native
    description: "q14 with NATIVE output (no field-wise text serialization): output-wall isolation"
    query: nexmark/matrix/bidstr_q14
    overrides: { query_config.output_formatter: { type: NATIVE } }
    axes: { x: *wsweep_coarse, series: *cfg }
    y: *tput_y
    visualization: { type: line_chart }
  - name: q0_native
    description: "q0 with NATIVE output (no field-wise text serialization): output-wall isolation"
    query: nexmark/matrix/bidstr_q0
    overrides: { query_config.output_formatter: { type: NATIVE } }
    axes: { x: *wsweep_coarse, series: *cfg }
    y: *tput_y
    visualization: { type: line_chart }
