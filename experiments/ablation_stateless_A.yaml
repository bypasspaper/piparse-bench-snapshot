# SPDX-License-Identifier: Apache-2.0
experiment:
  name: ablation_stateless_A
  description: >
    ABLATION — STATELESS half, PASS A (rungs 0-4, inline-OFF binary). The 11 replay-safe
    nexmark variants, where parsing is actually on the critical path — this is where the
    ladder MOVES. Run this batch FIRST and analyse before committing to the stateful half
    (ablation_stateful_A/_B.yaml), which is state-bound (parse-invisible) and eats most of
    the wall-clock.

    Cumulative ladder attributing end-to-end speedup to each contribution. 7 rungs / 6 bars
    total across files A+B. "all_queries" = run the stateless + stateful files together:
      pbench run experiments/ablation_stateless_A.yaml experiments/ablation_stateful_A.yaml ...

    THE LADDER (each rung = prev + one flip; dependency-ordered):
      0 baseline : BlockingFile + SequentialUncompiledCSV/CSVUncompiled (SEQUENTIAL) +
                   invoke=default + overload=false
      1 +parallel (cat2)  : formatter -> UncompiledCSV/CSVUncompiled (PARALLEL), still BlockingFile
      2 +async    (cat1)  : source -> File (async)
      3 +compiled (cat3)  : formatter -> SIMDCSV/CSV (JIT + lazy elision) + the fast codec
                            plugins (Eisel in / ZMIJ out, Traced/Fast ints)
      4 +fnattr   (cat4a) : invoke_mode_configuration -> fnattr
    (B file continues: 5 +inline / 6 +overload.)

    THE CODEC IS HELD CONSTANT AT *FAST* ACROSS THE WHOLE LADDER — deliberately.
    Parsing-FUNCTION PERFORMANCE is NOT a contribution of this work and is NOT ablated here
    (user ruling 2026-07-16): the contribution is being able to plug codecs in with ZERO
    OVERHEAD (that is cat 4a/4b's job), not that Eisel beats from_chars. Codec-vs-codec x
    execution-mode (inlined/traced) is its own MICRO benchmark. Consequences, all good:
      - no fast->slow->fast codec dip (the ladder is monotonic);
      - no Default*-int JIT-crash (__emutls) confound — the crash-prone Default int/bool
        parsers never appear; the fast stack is used throughout;
      - inline/fnattr are measured WITH the fast codecs in place, i.e. on their real target
        and in the production configuration.

    WHY cat3 IS A CLEAN MECHANISM BAR: uncompiledFastParse (the uncompiled path's hardcoded
    numeric parse) IS fast_float = the Eisel-Lemire core == EiselFloatF64, and the uncompiled
    output path was rewritten to to_chars+zmij, byte-identical to the compiled ZMIJ. Both
    sides of the compiled/uncompiled boundary run THE SAME CODEC ALGORITHMS -> rung 3
    isolates the MECHANISM (JIT + lazy elision vs interpreted + materialized).
    EXPECTED, HONEST: at rung 3 the codec is a PLUGIN PROXY CALL not yet inlined, while the
    uncompiled arm calls its codec directly with no std::function indirection. So for
    codec-bound (float) queries rung 3 may DIP below rung 2 — a real effect; rungs 4-5
    (fnattr, inline) are exactly what drive the plugin overhead back to zero. That
    dip-then-recover IS the "zero-overhead plugins" story. Do not engineer it away.

    BUILD (the inline knob is BUILD-TIME and --build-dir is per-run, so A and B are separate
    passes against the SAME dir, rebuilt in between — a 2nd build dir is not viable: 124 GB
    of the 160 GB cmake-build-release is testdata):
      A: InlineTagConfig.yaml -> enable: [] / disable: [lazy_overload, output_parse, input_parse]
      B: InlineTagConfig.yaml -> enable: [all three] / disable: []
      GOTCHA: the generated header is written at CONFIGURE time (NautilusInlining.cmake:159,
      file(WRITE), NO build-time dep on the YAML) -> ALWAYS re-run cmake configure after
      editing, else the binary is silently STALE. Restore the shipped default afterwards:
      git checkout -- testing/configurations/InlineTagConfig.yaml

    PROTOCOL: v2 controlled (W16 pinned + CCX-sharded admission queue, io=1, 128KiB buffers,
    warm reads, reps=3 median). generator.repeat=24 is SAFE here — these are all stateless,
    no window state (NES_FILE_REPEAT>1 into an event-time window corrupts the heap, which is
    why the stateful file keeps repeat=1). q22 uses 4.
    TIMEOUT: completion_timeout_s is 1800, NOT the usual 900. The 900 was calibrated for the
    FAST stack; rung 0 (sequential uncompiled) chews the same 160 GB of replay several times
    slower, and q10_datetime is ~212 s per run even in the fast arm (it is std::format-bound
    at ~755 MB/s). A timed-out cell is a lost cell — the extra headroom is free insurance.

    PORT: pass --worker-port 9099. Host port 8080 is permanently held by an unrelated docker
    container (`famedly-headless` 127.0.0.1:8080->8080), so the default makes EVERY run fail
    with "nes-cli failed (exit 1)" and an EMPTY stderr. (Symptom is silent: the DIAG_* calls=0
    lines come from nes-cli, not the formatter — do not misread them as a parser bug.)

    ENV: the box MUST be on the performance governor (sudo cpupower frequency-set -g
    performance) — it resets on every reboot and every prior number assumes it.
    RUN: pbench run experiments/ablation_stateless_A.yaml \
           --build-dir <repo>/cmake-build-release --worker-port 9099 --detach
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: default   # overridden per rung
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File          # overridden per rung
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV }   # overridden per rung
    output_formatter: { type: CSV }      # overridden per rung
    input_parser: {}           # overridden per rung
    output_parser: {}          # overridden per rung
  generator:
    repeat: 1

# ── The ablation ladder, PASS A (rungs 0-4) ────────────────────────────────────
# Each rung fully specifies every knob it controls so it does not inherit a
# neighbouring rung's state. `query_config.input_formatter` (a 2-level dotted key)
# REPLACES the whole dict via _set_nested; same for input_parser/output_parser.
_ladder_A: &ladder_A
  label: "optimization (cumulative)"
  explicit:
    - name: r0_baseline
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: CSVUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.invoke_mode_configuration: default
        overload: false
    - name: r1_parallel
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: UncompiledCSV }
        query_config.output_formatter: { type: CSVUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.invoke_mode_configuration: default
        overload: false
    - name: r2_async
      overrides:
        query_config.source_type: File
        query_config.input_formatter: { type: UncompiledCSV }
        query_config.output_formatter: { type: CSVUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.invoke_mode_configuration: default
        overload: false
    - name: r3_compiled
      overrides:
        query_config.source_type: File
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        # Fast codec plugins — the SAME algorithms the uncompiled arm hardcodes.
        query_config.input_parser: &fast_parsers
          uint64: TracedUINT64
          int64: TracedINT64
          int32: FastINT32
          int16: TracedINT16
          uint32: TracedUINT32
          uint16: TracedUINT16
          bool: TracedBOOL
          f64: EiselFloatF64
          f32: EiselFloatF32
        query_config.output_parser: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }
        worker.query_engine.invoke_mode_configuration: default
        overload: false
    - name: r4_fnattr
      overrides:
        query_config.source_type: File
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.invoke_mode_configuration: fnattr
        overload: false

_axes_x: &w16_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [16]

_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }

# Stateless nexmark scans: steady windows via replay (SAFE here — no window state).
_stateless_repeat: &stateless_repeat
  generator.repeat: 24

variants:
  - name: nx_person_projection
    description: "SELECT id FROM person - 1 fixed col of a varsized schema"
    query: nexmark/person_projection
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_person_star
    description: "SELECT * FROM person - full varsized materialization"
    query: nexmark/person_star
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_bid_ts_projection
    description: "SELECT timestamp FROM bid - 1-of-4 strict projection"
    query: nexmark/bid_ts_projection
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_bid_filter_eq
    description: "SELECT * WHERE auctionId = 1000 - point filter"
    query: nexmark/bid_filter_eq
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q0_bid_star
    description: "Q0: SELECT * FROM bid (passthrough)"
    query: nexmark/bid_star
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q1_price
    description: "Q1: price * 908/1000 - float parse + arith + ZMIJ out (the codec query)"
    query: nexmark/q1_price
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q2_filter_proj
    description: "Q2 (repo shape): auctionId,price WHERE %123 - int-parse/index bound on csv"
    query: nexmark/q2_filter_proj
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q2_original
    description: "Q2 (PAPER shape): 5-way OR point selection"
    query: nexmark/q2_original
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q14_calc
    description: "q14 (reduced): computed-float range filter, tunable selectivity"
    query: nexmark/q14_calc
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q10_datetime
    description: "q10 (reduced): CASTFROMUNIXTS ISO-8601 reformat - numeric->string output"
    query: nexmark/q10_datetime
    overrides: *stateless_repeat
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: nx_q22_concat
    description: "q22 (interim CONCAT): string manipulation over string-bearing bid"
    query: nexmark/q22_concat
    overrides: { generator.repeat: 4 }
    axes: { x: *w16_x, series: *ladder_A }
    y: *time_y
    visualization: { type: grouped_bar }
