# SPDX-License-Identifier: Apache-2.0
experiment:
  name: prof_uncompiled_parseall
  description: >
    PROFILING harness (2026-07-06): fully-uncompiled in/out, parse-all, WARM long window for perf. Purpose:
    attach perf to the worker and break down where the uncompiled path spends time -- read (io thread) vs
    SIMD index (indexBandInto) vs interpreted parse+materialize (processUncompiledTuple / fast_float +
    memcpy into the formatted buffer) vs interpreted output serialize (CSVFormat to_chars/zmij at the sink).
    Tests whether the ~1/4 gap vs the fused compiled path is INHERENT (interpreted codecs + a materialized
    intermediate buffer) or has a removable cost. W1 (single worker thread does formatter+projection+sink;
    io thread reads) so the flat self-time cleanly attributes the phases. NES_FILE_REPEAT=40 (~long window).
    Not a throughput datapoint.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 400
  worker:
    query_engine: { number_of_worker_threads: 1, number_of_io_threads: 1, invoke_mode_configuration: fnattr, pin_threads: false }
    default_query_execution: { operator_buffer_size: 131072, execution_mode: COMPILER }
    number_of_buffers_in_global_buffer_manager: 2048
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: UncompiledCSV }
    output_formatter: { type: CSVUncompiled }
  generator: { repeat: 40, mode: burst, rate: 1000000 }
variants:
  - name: prof
    description: "WARM bid_6GB x40, W1 UncompiledCSV in + legacy(ZMIJ) out, parse-all -- perf target"
    query: nexmark/bid_star_parseall
    axes:
      x:
        label: "config"
        explicit:
          - name: "uncompiled_parseall"
            baseline: true
            overrides: {}
    y: { metric: throughput_mbps, label: "Throughput (MB/s)" }
    visualization: { type: bar_chart }
