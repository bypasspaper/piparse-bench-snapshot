experiment:
  name: pin_order_check
  description: >
    Control for a cache-warming confound in pin_w4/pin_pool_w4 (which ran pin OFF
    first, then ON -> ON could have read a warmer page cache). REVERSE the order: run
    pin ON FIRST, then OFF, at the sharpest point (W=4/IO=1, pool=128=16 MB, File warm
    repeat 4). If ON still beats OFF when OFF now gets ON's warming, the +50-80% pin
    win is real (CCX-local L3 handoff), not warming. Expectation: ON ~8.8 GB/s, OFF
    ~5 GB/s regardless of order. (Note: warming changes disk-vs-page-cache, both DRAM;
    it cannot explain ON's LOWER measured DRAM in pin_dram -> mechanism already
    order-robust, this is the throughput-side control.)
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 128
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 4, mode: burst, rate: 1000000}
variants:
  - name: pin_order_check
    description: "pool=128 W=4, pin ON FIRST then OFF (reversed-order control)"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "pin_threads (ON measured first)"
        explicit:
          - {name: "on", baseline: true, overrides: {worker.query_engine.pin_threads: true}}
          - {name: "off", overrides: {worker.query_engine.pin_threads: false}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
