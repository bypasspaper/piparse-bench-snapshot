experiment:
  name: json_schemajson_ab
  description: >
    SchemaJSON evaluation vs the prior simdjson work. Same isolation method as json_input_isolation
    (OUTPUT_FORMAT=NATIVE, no compiled serializer, + Monitoring sink = "parse to native, discard"),
    over the IDENTICAL 31.3M-row bid_strings dataset. FOUR arms:
      native      bid_strings_3GB.nes  SystemNative -- NO input parse = the floor
      csv         bid_strings_3GB.csv  SIMDCSV -- the fast structured-index reference
      json        bid_strings_3GB.json JSON formatter (simdjson ON-DEMAND + landed DCE projection pushdown)
      schemajson  bid_strings_3GB.json SchemaJSON (simdjson STAGE-1 strided gather -- the new parser)
    json vs schemajson read the SAME 5.57GB .json, so their MB/s AND Mrows/s are directly comparable;
    all arms share the 31.3M row count so Mrows/s is comparable across every arm. This measures whether
    the schema-aware stage-1 gather (the prior session's projected ~2400 MB/s / ~70%-of-CSV follow-up)
    actually beats on-demand navigation.
    THREE queries (compute ladder): q2 (1 numeric field every row + filter), q1 (4 numeric fields every
    row), pass (2 VARSIZED + numerics). W1, single-node/fused, r6 fullopt, governor performance, n=5 median.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_schemajson_ab.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: json
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: JSON }
    output_formatter: { type: NATIVE }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_time_y: &time_y { metric: processing_time_s, label: "Processing time (s), lower=faster" }

# arm = INPUT FORMAT. json and schemajson share the .json file; csv/native use their own.
_fmt_series: &fmt_series
  label: "input"
  explicit:
    - name: native
      overrides:
        data_size: native
        query_config.input_formatter: { type: SystemNative, string_length: "13,73" }
    - name: csv
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    - name: json
      baseline: true
      overrides:
        data_size: json
        query_config.input_formatter: { type: JSON }
    - name: schemajson
      overrides:
        data_size: json
        query_config.input_formatter: { type: SchemaJSON }

variants:
  - name: q2
    description: "Nexmark Q2 filter+proj (INT32 parsed every row) -> NATIVE out"
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: q1
    description: "Nexmark Q1 currency conv (4 numeric fields parsed EVERY row) -> NATIVE out"
    query: nexmark/bidstr_iso_q1
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
  - name: pass
    description: "Varsized passthrough (2 VARSIZED materialised to native + numerics) -> NATIVE out"
    query: nexmark/bidstr_iso_pass
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
