# SPDX-License-Identifier: Apache-2.0
experiment:
  name: csv_json_scan_prof
  description: >
    Long warm window for profiling the csv->json SCAN arm (assume_clean_strings=FALSE => the per-row
    jsonSpanNeedsEscape scan+escape path). generator.repeat=40 replays the 3.60GB CSV 40x => a multi-
    minute steady window to attach perf and measure jsonSpanNeedsEscape's actual cost share. SIMDCSV in
    -> JSON out, bid passthrough (channel+url VARSIZED), r6 fullopt, W1, FUSED, 128KiB, port 9099.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false, assume_clean_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 40

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: scan_window
    description: "csv->json scan arm, long warm window for perf"
    query: nexmark/bid_json_passthrough
    axes: { x: *noop_x, series: { label: "arm", explicit: [ { name: scan_baseline, baseline: true, overrides: {} } ] } }
    y: *tput_y
    visualization: { type: grouped_bar }
