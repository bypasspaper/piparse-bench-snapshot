experiment:
  name: dram_probe
  description: >
    Single long-running saturated ingestion point (N=12 independent TCP sources,
    repeat 40 -> ~44 GB/query, ~37s steady window) used to DIRECTLY measure DRAM
    bandwidth via perf amd_df while it runs (run perf SEPARATELY, system-wide, over
    this command). N=12 sits in the flat ~14 GB/s aggregate ceiling region. If the
    measured DRAM bandwidth during steady ingestion approaches the ESTABLISHED
    achievable peak ~84 GB/s (stage-1 dram_peak_probe.cpp / amd-uprof), the ceiling
    is DRAM-bound. (Engine already hits ~76 GB/s via UNION parallelization; expect
    the same here = TCP-path cross-check.) W=8, IO=8,
    512 MB pool, 1 GB file (RAM: 12 x 1.09 GB).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      number_of_worker_threads: 8
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: TCP
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 40
    mode: burst
    rate: 1000000
    independent_per_query: true

variants:
  - name: dram_probe
    description: "N=12 long run for DRAM-bandwidth measurement"
    query: nexmark/bid_passthrough_1gb
    axes:
      x: {label: "sources", parameter: num_queries, values: [12]}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
