experiment:
  name: json_schemajson_output_matrix_csvref
  description: >
    json_schemajson_output_matrix + a CSV-INPUT reference. Adds csv->csv and csv->json arms (SIMDCSV over
    bid_strings_3GB.csv, 3.60GB, the SAME 31.3M logical rows) so SchemaJSON's json->{csv,json} passthrough
    can be stated as a % of CSV's own passthrough rate. SIX arms x two queries (passthrough, star).
      csv_c2c   = SIMDCSV(csv)   -> CSV out    (the CSV passthrough reference: fast-path baseline)
      csv_c2j   = SIMDCSV(csv)   -> JSON out
      jin_j2j   = JSON(json)     -> JSON out   (on-demand baseline)
      jin_j2c   = JSON(json)     -> CSV out
      sjson_j2j = SchemaJSON(json) -> JSON out
      sjson_j2c = SchemaJSON(json) -> CSV out
    IMPORTANT metric note: csv arms read 3.60GB, json arms read 5.57GB (1.55x more bytes for the SAME rows),
    so throughput_mbps (per INPUT byte) is NOT comparable csv-vs-json. The FAIR cross-input metric is Mrows/s
    (all arms process the identical 31.3M rows). MB/s stays comparable WITHIN the json arms (shared .json) and
    WITHIN the csv arms. Read Mrows/s to compare SchemaJSON to the CSV reference; read MB/s within an input.
    r6 fullopt, W1, single-node/FUSED, 128KiB, governor performance, n=5 median. Correctness of the csv arms
    gated by json_schemajson_output_csvref_smoke.yaml (must reproduce 269477267979 / 292200231721).
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_schemajson_output_matrix_csvref.yaml \
      --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: JSON }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s; compare csv-vs-json on Mrows/s)" }

_fmt_series: &fmt_series
  label: "arm"
  explicit:
    - name: csv_c2c
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
    - name: csv_c2j
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
    - name: jin_j2j
      baseline: true
      overrides:
        data_size: large
        query_config.input_formatter: { type: JSON }
        query_config.output_formatter: { type: JSON }
    - name: jin_j2c
      overrides:
        data_size: large
        query_config.input_formatter: { type: JSON }
        query_config.output_formatter: { type: CSV }
    - name: sjson_j2j
      overrides:
        data_size: large
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: JSON }
    - name: sjson_j2c
      overrides:
        data_size: large
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: CSV }

variants:
  - name: passthrough
    description: "bid passthrough (5 fields, 2 varsized): csv ref vs on-demand vs SchemaJSON, {JSON,CSV} out"
    query: nexmark/bid_json_passthrough
    axes: { x: *noop_x, series: *fmt_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: star
    description: "bid SELECT * (6 fields, 2 varsized): csv ref vs on-demand vs SchemaJSON, {JSON,CSV} out"
    query: nexmark/bid_json_star
    axes: { x: *noop_x, series: *fmt_series }
    y: *tput_y
    visualization: { type: grouped_bar }
