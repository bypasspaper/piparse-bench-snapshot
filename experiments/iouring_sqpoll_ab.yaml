experiment:
  name: iouring_sqpoll_ab
  description: >
    A/B the SQPOLL lever against the §31 single-producer-thread ceiling (5.9 GB/s cold O_DIRECT). §31:
    the lone DataSrc thread is BOTH io-manager (submit+reap) and emitter, maxed at 82.6% on-CPU + 17.3%
    io_cqring_wait, while the device has headroom (fio=7.0). IORING_SETUP_SQPOLL (NES_IOURING_SQPOLL=1)
    hands the submission queue to a KERNEL POLLER thread, so the submit path -- for O_DIRECT that includes
    get_user_pages + bio setup, which otherwise runs INLINE in io_uring_enter on the DataSrc thread -- runs
    OFF this thread. This is the "split io-management from emit" §31 said was the only lever past 5.9, but
    provided by the kernel for free (costs one extra kernel core; box is 48-thread, only ~4 in use).

    HYPOTHESIS: if the 82% on-CPU is dominated by the inline O_DIRECT submit path, SQPOLL lifts throughput
    toward the device cap (~6.5-7.0); if it's user-side emit/pool work, SQPOLL won't move it (poller just
    spins). Pairs with the iouring_perf_profile flat profile that says WHICH.

    Both arms: 12-pass cold O_DIRECT QD64, W4/IO1, pool 4096, 128 KiB, n=3 median. Multi-pass
    (NES_IOURING_PASSES=12) gives a low-variance STEADY-STATE rate (MonitoringSink reports bytes/time, so
    passes amortize ramp/JIT); O_DIRECT keeps every pass cold; bid_6GB ends on a newline so pass boundaries
    carry no partial tuple. Baseline (SQPOLL=0) multi-pass should land ~5.9-6.0 (cf. §31 single-pass 5.9).
    GOTCHA: with SQPOLL the poller spins a core hot for sq_thread_idle=2000ms after the last submit -- it
    is NOT a throughput cost (it runs off the producer thread) but will show as an extra busy core in
    pidstat; do not mistake it for the producer thread.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 180
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 4096
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_PASSES: 12
    NES_IOURING_SQPOLL: 0

variants:
  - name: iouring_sqpoll_ab
    description: "12-pass cold O_DIRECT QD64, SQPOLL off vs on"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "SQPOLL"
        parameter: worker_env.NES_IOURING_SQPOLL
        values: [0, 1]
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
