experiment:
  name: shredder_fragments_bottleneck_matrix
  description: >
    PINPOINT the residual N=1024 gap (2026-07-12, follow-up to n1024_timerwait): N=1024 best
    (384x64K) runs at 36.7 GB/s active vs 46.7 at N=512@192x128K -- WHICH resource binds?
    HYPOTHESIS (io-supply law): N=512@192x128K already sits AT the warm supply ceiling
    (46.7 / 8 io threads = 5.8 GB/s/thread ~ the known io_threads x 5-7 GB/s law); the N=1024
    configs fall below per-thread ceiling for CONFIG reasons, not N reasons:
    (a) 128K@384 bufs = 48 MB/cell pool spills the per-CCX L3 -> source copy loop pays DRAM
    (3.5 GB/s/thread); (b) 64K halves the buffer so per-buffer io-thread overhead (acquire +
    async_read round-trip + emit + enqueue) doubles per byte (4.6 GB/s/thread).
    DISCRIMINATOR CELLS (separate N from config -- same binary, same session):
      n512_384x128k: if ~28 active (like N=1024's C arm) -> pool-BYTES/residency effect,
        N innocent; if ~46 -> N itself matters for the 128K@384 deficit.
      n512_384x64k: if ~37 (like N=1024's D arm) -> 64K per-buffer cost is N-independent;
        if ~46 -> N matters.
      n1024_384x64k + n512_192x128k: reference reruns for sampling.
    A thread-CPU sampler runs alongside (per-2s /proc jiffies, segmented by worker pid):
    io-supply-bound predicts IOThreads ~95-100% busy in ALL arms with active-GB/s tracking
    per-thread io efficiency; if IOThreads idle at N=1024 the wall is elsewhere (workers/queue).
    GOTCHAS: arms ordered N=512-first so short runs sample cleanly; wall-span dilution caveat
    unchanged -- use active-window reconstruction; zero DIAG_SRCLIFE deaths expected everywhere.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 192
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  worker_env:
    NES_TASKQUEUE_STATS: 1
    NES_CELLPOOL_STATS: 1
  generator:
    repeat: 6

variants:
  - name: n512_192x128k_ref
    query: nexmark/bid_passthrough
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [512] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }

  - name: n512_384x128k
    query: nexmark/bid_passthrough
    overrides:
      worker.ccx_source_pool_buffers: 384
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [512] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }

  - name: n512_384x64k
    query: nexmark/bid_passthrough
    overrides:
      worker.ccx_source_pool_buffers: 384
      worker.default_query_execution.operator_buffer_size: 65536
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [512] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }

  - name: n1024_384x64k_ref
    query: nexmark/bid_passthrough
    overrides:
      worker.ccx_source_pool_buffers: 384
      worker.default_query_execution.operator_buffer_size: 65536
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [1024] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }
