# SPDX-License-Identifier: Apache-2.0
experiment:
  name: seq_iouring_prof
  description: >
    PROFILING harness for the ZERO-COPY sequential io_uring path (session 2026-07-03): IoUringFile +
    SequentialCSV (threading_mode sequential). Verify the intent: (1) NO full-buffer memcpy (the reverted
    mistake), (2) the deep-QD O_DIRECT read (io_uring / prep_read_fixed, not the buffered _copy_to_iter),
    (3) index+parse IN PLACE on the DataSrc thread. Not a throughput datapoint -- attach nes-profile to
    the worker during the pass. IoUringFile is single-pass (no NES_FILE_REPEAT), so use the INT workload
    (parse-bound -> longest window, ~several s on cold bid_6GB) to give perf a window to sample. W1/IO1,
    O_DIRECT+regbuf+QD64, inflight128, cold.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    global_buffer_alignment: 512
    number_of_buffers_in_global_buffer_manager: 2048
    default_max_inflight_buffers: 128
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: sequential}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: NATIVE}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_REGBUF: 1

variants:
  - name: seq_iouring_prof
    description: "COLD bid_6GB int SELECT* NATIVE, W1 IoUringFile SequentialCSV -- perf target"
    query: nexmark/bid_star_int
    axes:
      x:
        label: "config"
        explicit:
          - name: "iouring_seq_int"
            baseline: true
            overrides: {}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
