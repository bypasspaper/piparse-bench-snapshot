experiment:
  name: shredder_fragments_n1024_timerwait
  description: >
    ASYNC-TIMER ACQUIRE WAIT A/B (2026-07-12, follow-up to shredder_fragments_n1024_throughput):
    the runner's dry-pool wait is changed from a 5 ms BLOCKING getBufferWithTimeout slice (holds
    the io thread hostage; sibling sources on the thread can neither read nor emit during the
    slice) to a SUSPENDING asio::steady_timer wait (1 ms) -- the io thread stays fully available
    while any number of sources wait out a dry spell. Identified as a residual contributor to
    the N=1024 gap (34.4 GB/s active vs 46.7 at N=512).
    ARMS: the two pool-384 N=1024 configs (like-for-like vs the blocking-slice baselines
    23.9/27.9 [128k] and 29.9/34.4 [64k] wall/active GB/s) + an N=512 @ 192x128k plateau sanity
    arm (baseline 39.2/46.7 with the PRE-fix runner; confirms the fixed runner does not regress
    the standard config -- its fast path getBufferNoBlocking only differs when the pool is dry).
    EXPECT: 64k arm gains if io-thread hostage time was the binding constraint; unchanged if
    per-buffer overhead/deployment dominates. All arms must stay 1024/1024 (512/512), zero
    DIAG_SRCLIFE deaths. GOTCHAS: same wall-span dilution caveat -- compare like-for-like and
    use the active-window reconstruction for steady rates.
    RESULTS (2026-07-12, 3/3 ok, zero deaths): timer wait KEPT.
      n1024_pool384_128k_timer: wall 23.9 (was 23.9), active 28.2 (was 27.9) -- WASH
      n1024_pool384_64k_timer : wall 31.7 (was 29.9, +6%), active 36.7 (was 34.4, +7%)
      n512_pool192_sanity     : wall 40.0 / active 46.3 (pre-fix baseline 39.2/46.7 -- PARITY,
                                the fixed runner does not regress the plateau)
    N=1024 best static config now = 384 x 64 KiB: 31.7 GB/s wall / 36.7 active = 79% of the
    N=512 active rate. Remaining gap is NOT the acquire wait anymore (timer arm ~= wash at
    128k): dominated by per-buffer fixed cost at 2x task rate (the ~7.1 us/buffer law),
    deployment interference, and 1024-query engine overheads. Diminishing returns for static
    tuning -- the budgeted borrow valve remains the designed answer for full speed at N>=1024.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 384
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  worker_env:
    NES_TASKQUEUE_STATS: 1
    NES_CELLPOOL_STATS: 1
  generator:
    repeat: 6

variants:
  - name: n1024_pool384_128k_timer
    query: nexmark/bid_passthrough
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [1024] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }

  - name: n1024_pool384_64k_timer
    query: nexmark/bid_passthrough
    overrides:
      worker.default_query_execution.operator_buffer_size: 65536
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [1024] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }

  - name: n512_pool192_128k_sanity
    query: nexmark/bid_passthrough
    overrides:
      worker.ccx_source_pool_buffers: 192
    axes:
      x: { label: "Concurrent Queries", parameter: num_queries, values: [512] }
    y: { metric: throughput_mbps, label: "Aggregate System Throughput (MB/s)" }
