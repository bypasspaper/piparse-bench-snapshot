experiment:
  name: q10_castfromunixts_ab
  description: >
    FOCUSED A/B for the CASTFROMUNIXTS timestamp-format optimization. q10 was the
    outlier of the whole stateless suite (~50 MB/s compiled-W1, 743 MB/s W16 vs
    5-11 GB/s for its peers) because every row runs nautilus::invoke ->
    std::format_to("{:%FT%T}Z"): runtime chrono format-string parsing + locale
    machinery, ~269 ns/call measured isolated. The fix replaces the lambda body
    with a hand-rolled ISO-8601 formatter (Howard Hinnant civil_from_days + fixed
    2/4-digit writes), ~1.8 ns/call isolated (147x), byte-exact vs std::format for
    all inputs in [epoch, year 9999] (proven on 1M random values + the 6
    FromUnixTimestampConversion.test golden vectors).

    This experiment is BINARY-A/B: the fix is a property of the compiled worker,
    NOT a config knob. Run it TWICE, swapping the worker+cli binary in the build
    dir between runs:
      OLD (std::format):  scratchpad/bin_old/{nes-single-node-worker,nes-cli}
      NEW (hand-rolled):  scratchpad/bin_new/{nes-single-node-worker,nes-cli}
    (both staged this session; the release build dir currently holds NEW.)

    RUNGS (q10 only): r3 compiled-W1 (cleanest per-row signal, the conversion IS
    the row cost here), r6b full-opt W1 (shows the W1 ceiling once every other knob
    is on -- for OLD this stays ~50 because the conversion dominates; for NEW it
    should lift toward the parse/output cost), r7 parallel W16 (the deployment
    number; OLD pinned 743 because the per-row compute doesn't parallelize away).

    GOTCHAS (carried from the ablation memory):
      - overload:true lives in the RUNG override, NOT defaults (stale validation
        rule rejects it in defaults on the -fast-csv branch).
      - q10 HAS a medium entry (bid_1GB) so data_size:medium does NOT fall back to
        6GB. At OLD ~50 MB/s, 1GB = ~22 s/rep -- expect the OLD W1 rungs to be slow.
      - the JSON output fast path does NOT apply to q10 (dt is VARSIZED -> the
        all-numeric predicate declines), so this A/B isolates the conversion cleanly.
      - PORT 9099 (8080 held). Governor performance. pin_threads + ccx bite at r7.
    RUN (NEW is in place now):
      cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
        experiments/q10_castfromunixts_ab.yaml \
        --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099 --detach
    then: cp scratchpad/bin_old/* into the build dir's worker+cli paths, re-run,
    label the two run_groups new/old, compare per rung.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_ladder: &ladder
  label: "optimization (cumulative)"
  explicit:
    - name: r3_compiled
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r6b_fullopt_w1
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: true
        generator.repeat: 1
    - name: r7_parallel
      overrides:
        query_config.source_type: File
        query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 16
        worker.query_engine.ccx_aware_task_queues: true
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: true
        generator.repeat: 20

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: nx_q10_datetime
    description: "q10 (reduced): CASTFROMUNIXTS reformat - was std::format-bound"
    query: nexmark/q10_datetime
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
