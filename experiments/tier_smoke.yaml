experiment:
  name: tier_smoke
  description: smoke native/naive/compiled arms
  primary_metric: throughput_mrows_s
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter:
      type: SIMDCSV
      allow_commas_in_strings: false
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter:
      type: JSON
    output_parser:
      f64: ZMIJF64
      f32: ZMIJF32
  generator:
    repeat: 1
  worker_env:
    NES_MMAP_POPULATE: '1'
variants:
- name: q0
  query: nexmark/matrix/bidstr_q0
  axes:
    x:
      label: w
      parameter: worker.query_engine.number_of_worker_threads
      values:
      - 23
    series:
      label: arm
      explicit:
      - name: nes_compiled
        baseline: true
        overrides:
          generator.repeat: 8
          query_config.source_type: MmapFile
      - name: nes_native
        overrides:
          generator.repeat: 8
          data_size: native
          query_config.source_type: MmapFile
          query_config.input_formatter:
            type: SystemNative
            string_length: 13,73
      - name: nes_naive
        overrides:
          generator.repeat: 1
          worker.query_engine.number_of_worker_threads: 1
          query_config.source_type: BlockingFile
          query_config.input_formatter:
            type: SequentialUncompiledOldCSV
            threading_mode: sequential
          query_config.output_formatter:
            type: JSONUncompiled
          query_config.input_parser: {}
          query_config.output_parser: {}
  y:
    metric: throughput_mrows_s
    label: records/s
  visualization:
    type: grouped_bar
- name: qroute
  query: nexmark/matrix/bidstr_qroute
  axes:
    x:
      label: w
      parameter: worker.query_engine.number_of_worker_threads
      values:
      - 23
    series:
      label: arm
      explicit:
      - name: nes_compiled
        baseline: true
        overrides:
          generator.repeat: 8
          query_config.source_type: MmapFile
      - name: nes_native
        overrides:
          generator.repeat: 8
          data_size: native
          query_config.source_type: MmapFile
          query_config.input_formatter:
            type: SystemNative
            string_length: 13,73
      - name: nes_naive
        overrides:
          generator.repeat: 1
          worker.query_engine.number_of_worker_threads: 1
          query_config.source_type: BlockingFile
          query_config.input_formatter:
            type: SequentialUncompiledOldCSV
            threading_mode: sequential
          query_config.output_formatter:
            type: JSONUncompiled
          query_config.input_parser: {}
          query_config.output_parser: {}
  y:
    metric: throughput_mrows_s
    label: records/s
  visualization:
    type: grouped_bar
