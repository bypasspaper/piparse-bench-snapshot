experiment:
  name: iouring_inflight_sweep
  description: >
    Validate the dedicated-source-pool design (§42 follow-up) on the current code via a proxy: set the GLOBAL
    pool = N, QD = min(64, N/2), and default_max_inflight_buffers = 1000000 so the SEMAPHORE never binds and the
    POOL is the sole limiter -- exactly the proposed design (per-source pool sized to inflight, semaphore removed,
    QD derived from inflight). Finds the minimum inflight (=pool) that still hits ~6.8 GB/s and confirms
    QD=inflight/2 keeps the io_uring ring fed without self-stall. 128 KiB buffers, pin off, single-pass cold
    O_DIRECT, W4/IO1, n=3 median. Footprints: 64=8MB 128=16MB 256=32MB 512=64MB 1024=128MB. Prior sweep (§41)
    covered 2048+ (regbuf 6.77@2048); this fills the small end. regbuf points set global_buffer_alignment:512 +
    NES_IOURING_REGBUF=1. QD: N=64->32, N>=128->64.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: true
  completion_timeout_s: 120
  worker:
    default_max_inflight_buffers: 1000000
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 256
  query_config:
    source_type: IoUringFile
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000
  worker_env:
    NES_IOURING_DIRECT: 1
    NES_IOURING_QD: 64
    NES_IOURING_REGBUF: 0

variants:
  - name: regbuf
    description: "regbuf, pool=inflight as sole limiter, QD=min(64,N/2)"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "inflight (=pool)"
        explicit:
          - name: "64"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 64, "worker_env.NES_IOURING_QD": 32, "worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
          - name: "128"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 128, "worker_env.NES_IOURING_QD": 64, "worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
          - name: "256"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 256, "worker_env.NES_IOURING_QD": 64, "worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
          - name: "512"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 512, "worker_env.NES_IOURING_QD": 64, "worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
          - name: "1024"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 1024, "worker_env.NES_IOURING_QD": 64, "worker.global_buffer_alignment": 512, "worker_env.NES_IOURING_REGBUF": 1}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart, x_scale: log}
  - name: baseline
    description: "baseline non-fixed, pool=inflight as sole limiter, QD=min(64,N/2)"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "inflight (=pool)"
        explicit:
          - name: "64"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 64, "worker_env.NES_IOURING_QD": 32}
          - name: "128"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 128, "worker_env.NES_IOURING_QD": 64}
          - name: "512"
            overrides: {"worker.number_of_buffers_in_global_buffer_manager": 512, "worker_env.NES_IOURING_QD": 64}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: line_chart, x_scale: log}
