experiment:
  name: pin_full_ccx
  description: >
    Does the pinned CCX-local win hold when we fill ALL 6 cores of CCX0 (not just 5)?
    pin_w4 used IO=1/W=4 = 5 of CCX0's 6 cores (cores 0-4). Here, pinned, compare:
    IO1_W4 (5 cores, baseline), IO2_W4 (cores 0-5 = full CCX, +1 io thread),
    IO1_W5 (cores 0-5 = full CCX, +1 worker). pin_threads places IO at cores 0..nIO-1,
    workers at nIO..nIO+W-1, so both 6-thread configs exactly fill CCX0 (cores 0-5,
    32 MB L3). File passthrough warm (repeat 4), pool {128=16MB, 256=32MB}.

    PREDICTION: for a SINGLE File source the 2nd io thread can't speed the read (one
    source = one fillBuffer coroutine = one active io thread), and passthrough saturates
    at W=4 (§16), so full-CCX (6 cores) ~= the 5-core result -- possibly a slight DIP
    from extra L3/scheduling pressure within the shared 32 MB. Tells us how many of a
    CCX's 6 cores this single-source passthrough can actually use (informs the per-CCX
    pool/affinity design: io threads vs worker threads per CCX).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine:
      pin_threads: true
      invoke_mode_configuration: fnattr
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
    number_of_buffers_in_global_buffer_manager: 256
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 4, mode: burst, rate: 1000000}
variants:
  - name: pin_full_ccx
    description: "pinned, 5-core vs full-CCX(6-core) thread configs, pool 128/256"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "io/worker threads (cores used in CCX0)"
        explicit:
          - {name: "IO1_W4_5core", baseline: true, overrides: {worker.query_engine.number_of_io_threads: 1, worker.query_engine.number_of_worker_threads: 4}}
          - {name: "IO2_W4_6core", overrides: {worker.query_engine.number_of_io_threads: 2, worker.query_engine.number_of_worker_threads: 4}}
          - {name: "IO1_W5_6core", overrides: {worker.query_engine.number_of_io_threads: 1, worker.query_engine.number_of_worker_threads: 5}}
      series:
        label: "pool"
        explicit:
          - {name: "p128_16MB", baseline: true, overrides: {worker.number_of_buffers_in_global_buffer_manager: 128}}
          - {name: "p256_32MB", overrides: {worker.number_of_buffers_in_global_buffer_manager: 256}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
