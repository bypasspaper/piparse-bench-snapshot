# SPDX-License-Identifier: Apache-2.0
experiment:
  name: nes_vs_flink_vs_spark_scaling_probe
  description: >
    PROBE (N=128, 256) for the many-source SCALING head-to-head: how do NES, Flink and Spark
    hold up as the number of CONCURRENT sources/queries grows, running the FROZEN 10-query
    stateless PAPER_WORKLOAD as a HETEROGENEOUS MIX (each of the N concurrent sources runs one
    of the 10 shapes, round-robin: q0, q_project, q_route, q1, q2-og, q2-mod, q10, q14, q22,
    Q_ex), csv -> json. This is the real-workload generalization of the 2026-07 "green curve"
    (which scaled ONE parse-free passthrough query to 1024): now BOTH parse AND JSON
    serialization are real work.
      - NES   = the many-source PRODUCTION config (NOT the single-source head-to-head config):
                CCX cells + fragment shredder (LOCK_FREE_FRAGMENTS) + pin_threads + 16 workers /
                8 io threads + 192x128KiB shared source pools; File sources; SIMDCSV fast parsers
                -> JSON output into Monitoring. num_queries = N concurrent File-source queries,
                round-robining query_mix; MonitoringSink stamps per-TupleBuffer ingest->sink
                latency + aggregate throughput (throughput_mbps over the true cross-query wall).
      - Flink = mode flink, flink_output_format latency_json = N StatementSet pipelines (one task
                slot each), pipeline i runs query_mix[i%10]'s flink_sql into the json-latency-
                blackhole sink (Flink's real JSON encoder per row + per-readBatch nanoTime stamp).
      - Spark = mode spark, spark_output_format json_void_latency = N concurrent Structured
                Streaming queries in one SparkSession (local[N]), round-robining query_mix; the
                fair to_json void sink + per-micro-batch triggerExecution latency (recentProgress).
    LATENCY SEMANTICS (the consistency rule): all three measure PER-BATCH ingest->sink latency
    (NES per-TupleBuffer, Flink per-readBatch, Spark per-micro-batch). NES/Flink batch = 128 KiB
    (operator_buffer_size / io-fetch-size). Spark micro-batches are necessarily COARSER than
    128 KiB (a micro-batch architectural property, not a bug) -- set by spark_max_bytes_per_trigger
    (64 MiB here); the paper states the granularity difference.
    EXPECTATION being probed: NES stays BOUNDED (throughput plateau + p99 flat), Flink's tail
    COLLAPSES past core count, Spark's driver micro-batch scheduler is the unknown -- does it even
    survive 128/256 concurrent streams? If a competitor dies before the full sweep, that ceiling
    IS a result (cap its curve, report it).
    FAIRNESS: all read the SAME bid_strings_3GB.csv, generator.repeat 1 (each source/pipeline
    reads the file once = N x 3.6 GB aggregate input); compare on throughput_mbps (csv input bytes)
    + p50/p99/p999 latency.
    PRE-FLIGHT: pkill -x main (stale NES worker); flink-ext/pbench-flink-ext.jar built; pyspark
    importable; bid_strings_3GB.csv present in <testdata>/large/nexmark/; dd/warm the file first;
    --worker-port 9099 (root worker squats :8080). RUN WITH `pbench run --detach` and
    PBENCH_FLINK_TIMEOUT=3600 PBENCH_SPARK_TIMEOUT=3600 PBENCH_KEEP_LOGS=1.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  # Heterogeneous mix: the N concurrent sources/queries round-robin these 10 stateless shapes.
  query_mix:
    - nexmark/matrix/bidstr_q0
    - nexmark/matrix/bidstr_qproject
    - nexmark/matrix/bidstr_qroute
    - nexmark/matrix/bidstr_q1
    - nexmark/matrix/bidstr_q2og
    - nexmark/matrix/bidstr_q2mod
    - nexmark/matrix/bidstr_q10
    - nexmark/matrix/bidstr_q14
    - nexmark/matrix/bidstr_q22
    - nexmark/matrix/bidstr_qex
  worker:
    query_engine:
      # Many-source PRODUCTION config: CCX cells + pinned workers is the RIGHT config here (it is
      # a ~2x pathology only for SINGLE-source runs; this is the many-source regime it was built
      # for). 16 workers + 8 io threads = 24 physical cores.
      number_of_worker_threads: 16
      number_of_io_threads: 8
      invoke_mode_configuration: fnattr
      pin_threads: true
      ccx_aware_task_queues: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
    # One shared source buffer pool per CCX cell (needs ccx_aware_task_queues + pin_threads);
    # 192 x 128 KiB = 24 MB/cell -- the certified L3-governed plateau config (serves N=1..1024).
    ccx_shared_source_pools: true
    ccx_source_pool_buffers: 192
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    # Fragment shredder decouples cell-pool sizing from source fan-in (the N>=512 wedge fix).
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE_FRAGMENTS }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_series_engines: &engines
  label: "engine"
  explicit:
    - name: NebulaStream
      baseline: true
    - name: Flink
      system: flink
      overrides:
        mode: flink
        flink_execution_mode: streaming
        flink_output_format: latency_json
    - name: Spark
      system: spark
      overrides:
        mode: spark
        spark_output_format: json_void_latency
        spark_single_reader: true
        # Spark micro-batch size for per-batch latency (coarser than NES/Flink's 128 KiB by
        # necessity); 64 MiB -> ~56 batches/stream over 3.6 GB (tractable batch count under N).
        spark_max_bytes_per_trigger: 67108864

_axis_n: &n_x
  label: "concurrent sources/queries"
  parameter: num_queries
  values: [128, 256]

_y: &mbps_y { metric: throughput_mbps, label: "Aggregate throughput (MB/s, csv input bytes)" }

variants:
  - name: mix
    description: "Heterogeneous 10-query mix, csv->json, scaled over N concurrent sources/queries"
    # Primary query_ref (for cache-warm + row/label resolution); all 10 share bid_strings_3GB.csv.
    query: nexmark/matrix/bidstr_q0
    axes: { x: *n_x, series: *engines }
    y: *mbps_y
    visualization: { type: line_chart }
