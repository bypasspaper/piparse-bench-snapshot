# SPDX-License-Identifier: Apache-2.0
experiment:
  name: json_schemajson_smoke
  description: >
    CORRECTNESS GATE for the SchemaJSON evaluation. Same shape as json_input_isolation_smoke, but
    the series is the two JSON formatters: `json` (simdjson on-demand, the prior DCE baseline) and
    `schemajson` (the new simdjson stage-1 strided gather). Checksum sink (CSV output -> forces full
    field materialisation), reps=1, q2/q1/pass over the SAME bid_strings_3GB.json. GATE: SchemaJSON
    must reproduce the known checksums exactly -- q2 246669329 (count 257350), q1 70840218750
    (count 31300000), pass 269477267979 (count 31300000). Matching checksums also proves the JSON
    key order matches the schema order (SchemaJSON gathers positionally).
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_schemajson_smoke.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: json
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Checksum
    input_formatter: { type: JSON }
    output_formatter: { type: CSV }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_time_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }

# arm = JSON formatter, same .json data both ways.
_fmt_series: &fmt_series
  label: "formatter"
  explicit:
    - name: json
      baseline: true
      overrides:
        data_size: json
        query_config.input_formatter: { type: JSON }
    - name: schemajson
      overrides:
        data_size: json
        query_config.input_formatter: { type: SchemaJSON }

variants:
  - name: q2
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *fmt_series }
    y: *time_y
    visualization: { type: grouped_bar }
