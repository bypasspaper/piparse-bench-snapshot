# SPDX-License-Identifier: Apache-2.0
experiment:
  name: prof_emitter_4k
  description: "Profile the DataSrc (emitter) thread at 4K single-source SELECT id -- what caps the emitter?"
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  worker:
    query_engine: { number_of_worker_threads: 24, number_of_io_threads: 1, invoke_mode_configuration: fnattr, inline_invoke_calls: true, pin_threads: false, ccx_aware_task_queues: false, admission_queue_size: 1024 }
    default_query_execution: { operator_buffer_size: 262144, execution_mode: COMPILER }
    number_of_buffers_in_global_buffer_manager: 200000
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false, sequence_shredder_mode: LOCK_FREE }
    output_formatter: { type: CSV }
  generator: { repeat: 300 }
  worker_env: { NES_INMEM_PREFILL: "1", NES_INMEM_REPEAT: "300", NES_INMEM_BUFSIZE: "4096", NES_LOG_LEVEL: WARNING }
variants:
  - name: prof
    query: formatter/bigstr_id_pass
    axes:
      x: { label: "x", explicit: [ { name: "p", baseline: true, overrides: {} } ] }
    y: { metric: throughput_mbps, label: "MB/s" }
    visualization: { type: bar_chart }
