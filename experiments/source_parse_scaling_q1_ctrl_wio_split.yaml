experiment:
  name: source_parse_scaling_q1_ctrl_wio_split
  description: >
    Follow-up to source_parse_scaling_q1_ctrl_16w8io: sweep the worker/io SPLIT at a FIXED
    24-thread total (= 24 physical cores, SMT-free), async q1, N=100, one rep per point.
    Points here: 20w/4io and 18w/6io (16w/8io already measured in the _16w8io control).

    CONTEXT: baseline 24w/4io (28 threads, SMT-shared) = 12601 MB/s, p50 1.2 ms, p99 12.3.
    16w/8io (24 threads) = 11530 MB/s (-8.5%), p50 12.6 ms (queueing-dominated), p99 15.1.

    PREDICTION: io threads were never the bottleneck for warm file reads (4 sufficed), so
    within the fixed 24-thread budget MORE WORKERS should win monotonically:
    20w/4io > 18w/6io > 16w/8io in throughput (20w maybe ~12.0-12.4 GB/s, approaching the
    24w baseline) AND in median latency (more workers = more service capacity = less
    queueing; p50 should fall from 12.6 ms toward low-single-digit ms as workers rise).
    If 20w/4io matches the 24w baseline within noise, the whole 16w/8io deficit was worker
    count, and SMT sharing costs ~nothing (already suggested by the -8.5%-for--33%-workers
    ratio).

    GOTCHAS: all of source_parse_scaling_q1's apply. ONE rep per point (quick probe).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 600
  worker:
    query_engine:
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV }
    input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 6
  num_queries: 100

variants:
  - name: wio_split
    description: "q1, async File+SIMDCSV, N=100, fixed 24-thread budget: workers/io split"
    query: nexmark/q1_price
    axes:
      x:
        label: "workers/io split (24 threads total)"
        explicit:
          - name: 20w_4io
            overrides:
              worker.query_engine.number_of_worker_threads: 20
              worker.query_engine.number_of_io_threads: 4
          - name: 18w_6io
            overrides:
              worker.query_engine.number_of_worker_threads: 18
              worker.query_engine.number_of_io_threads: 6
    y:
      metric: throughput_mbps
      label: "Aggregate System Throughput (MB/s)"
    visualization:
      type: bar_chart
