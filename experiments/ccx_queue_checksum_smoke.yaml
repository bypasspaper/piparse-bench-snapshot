experiment:
  name: ccx_queue_checksum_smoke
  # CORRECTNESS SMOKE for the CCX-aware task-queue prototype: same query, Checksum sink, series
  # = ccx_aware_task_queues OFF vs ON, pinned W=11 (workers span CCX0+CCX1 so the ON arm really
  # shards + steals). The [checksum] count,checksum lines must be IDENTICAL between the series
  # arms per query (and person_projection must reproduce the recorded catalog checksum
  # 4000000,1444868000). Exercises: admission sharding, idle stealing, internal-queue
  # continuations (q5 window state), start/stop/termination drain across shards.
  # Queries: person_projection (recorded-checksum projection), q2_filter_proj (filter+proj),
  # q1_price (float codec), q5_window_join (STATEFUL - small-buffer pool per the known q5
  # requirement, repeat=1 event-time).
  # EXPECT: all four queries arm-EQUAL; NES_TASKQUEUE_STATS (worker.log) shows valveTrips=0.
  #
  # RESULTS (2026-07-09, 8/8 ok, steal-delay build): ALL FOUR queries arm-EQUAL, and the
  # recorded values reproduce exactly:
  #   person_projection 4000000,1444868000 (== recorded catalog checksum)
  #   q2_filter_proj    1511777,1499177125 (== recorded smoke value)
  #   q1_price          183991721,431495796659 (arms equal)
  #   q5_window_join    10589,23372488 (== recorded smoke value; stateful path + drain ok)
  # Correctness of the sharded queue (incl. stealing, W11 spanning CCX0+1) validated.
  description: "checksum equality smoke: CCX-sharded queue OFF vs ON, pinned W11"
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  completion_timeout_s: 600
  worker:
    query_engine:
      number_of_worker_threads: 11
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: true
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Checksum
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser: { uint64: TracedUINT64, int32: FastINT32, f64: EiselFloatF64 }
  worker_env:
    NES_TASKQUEUE_STATS: 1
  generator:
    repeat: 1

_series: &ccx_series
  label: "task queue"
  explicit:
    - name: single_queue
      baseline: true
      overrides: {}
    - name: ccx_sharded
      overrides:
        worker.query_engine.ccx_aware_task_queues: true

_axes_x: &w11_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [11]

_y: &time_y { metric: processing_time_s, label: "Processing time (s)" }

variants:
  - name: person_projection
    query: nexmark/person_projection
    axes: { x: *w11_x, series: *ccx_series }
    y: *time_y

  - name: q2_filter_proj
    query: nexmark/q2_filter_proj
    axes: { x: *w11_x, series: *ccx_series }
    y: *time_y

  - name: q1_price
    query: nexmark/q1_price
    axes: { x: *w11_x, series: *ccx_series }
    y: *time_y

  - name: q5_window_join
    query: nexmark/q5_window_join
    overrides:
      worker.default_query_execution.operator_buffer_size: 4096
      worker.number_of_buffers_in_global_buffer_manager: 2000000
    axes: { x: *w11_x, series: *ccx_series }
    y: *time_y
