# SPDX-License-Identifier: Apache-2.0
experiment:
  name: passthrough_ab
  description: >
    PASSTHROUGH BENEFIT in isolation. csv->json over mixed_n16 (15 FLOAT64 payload). Two queries, identical
    config: passthrough (SELECT f1..f15, raw text forwarded, no codec) vs materialize (SELECT f1*1..f15*1,
    parse+re-serialize with the FASTEST codec Eisel in / ZMIJ out). Benefit = how much the parse+serialize
    round-trip costs even at best-case codec. InMemory prefill, W1, Monitoring/JSON.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  cold_read: false
  completion_timeout_s: 300
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: {type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false}
    input_parser: {f64: EiselFloatF64}
    output_parser: {f64: ZMIJF64}
    output_formatter: {type: JSON}
  generator: {repeat: 4, mode: burst, rate: 1000000}
  worker_env: {NES_INMEM_PREFILL: 1, NES_INMEM_REPEAT: 4, NES_INMEM_BUFSIZE: 131072}
variants:
  - name: ab
    description: "passthrough vs materialize, csv->json, 15 floats"
    queries:
      - parsergrid/passthrough_f64
      - parsergrid/mixed_float_f64
    axes:
      x:
        label: "query"
        explicit:
          - {name: sweep, baseline: true, overrides: {}}
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
