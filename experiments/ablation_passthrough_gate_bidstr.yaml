experiment:
  name: ablation_passthrough_gate_bidstr
  description: >
    ANCHOR GATE for the passthrough-serde ablation split (do this BEFORE the full 10-query run).
    Three rungs -- r2 (interpreted, naive-bar floor), r3 (compiled lazy passthrough), r3_eager
    (compiled EAGER_PARSE=ON, materialises numeric+varsized) -- on three queries that span the
    behaviour space: q0 (SELECT * -> varsized+numeric passthrough), qproject (single FLOAT passthrough,
    biggest ZMIJ-reserialize win), q2og (5-way OR filter -> field consumed by predicate, so eager~=lazy,
    the flat control). PURPOSE:
      (1) confirm eager_parse renders + the engine accepts it (r3_eager runs, no error);
      (2) confirm r2 and r3 REPRODUCE the v7 table on the CURRENT binary (f6a7b98343 + uncommitted EAGER
          threading), so the new r3_eager point is measured on the same footing (NOT apples/oranges);
      (3) sanity: r3_eager << r3 on q0/qproject (passthrough disabled), r3_eager ~= r3 on q2og (control).
    ANCHOR TARGETS (throughput_mbps, from figures/ablation_ladder_v7_bidstr.csv, gate = within +-3%):
      q0       r2=313.57   r3=1322.52
      qproject r2=706.92   r3=3941.15
      q2og     r2=888.88   r3=2299.27
    Only once r2 & r3 clear the gate is the full {r2,r3,r3_eager} x 10 run (this + all 10 queries) trusted.
    BINARY: current cmake-build-release (worker + nes-cli mtime 2026-08-26T18:36, EAGER_PARSE compiled in,
    verified via `strings`). InMemory, NES_INMEM_REPEAT=1 => reported == true.
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_passthrough_gate_bidstr.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
    output_formatter: { type: JSONUncompiled }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 1
    NES_INMEM_BUFSIZE: 131072

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_ladder: &ladder
  label: "optimization (cumulative)"
  explicit:
    - name: r2_uncompiled
      baseline: true
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r3_compiled
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1
    - name: r3_eager
      overrides:
        query_config.source_type: InMemory
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false, eager_parse: true }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: q0
    description: "Q0: SELECT * FROM bid (varsized + numeric passthrough)"
    query: nexmark/matrix/bidstr_q0
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: qproject
    description: "SELECT price FROM bid (single FLOAT passthrough)"
    query: nexmark/matrix/bidstr_qproject
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2og
    description: "Q2 (PAPER shape): 5-way OR point selection (filter control, eager~=lazy)"
    query: nexmark/matrix/bidstr_q2og
    axes: { x: *noop_x, series: *ladder }
    y: *tput_y
    visualization: { type: grouped_bar }
