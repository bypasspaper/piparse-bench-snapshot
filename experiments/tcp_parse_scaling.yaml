experiment:
  name: tcp_parse_scaling
  description: >
    TCP edition of the source-parse scaling study (file edition: source_parse_scaling_q1
    + _ext + _n1000): how does INTERPRETED parsing in the connection thread (naive) scale
    with source count vs the fully optimized async setup, on Nexmark Q1. Config settled by
    tcp_parse_probe_n100 + tcp_parse_probe_n250_async (READ BOTH: method, gotchas,
    verdicts).

    METHOD (TCP_COLLAPSE_MECHANISM.md core-budget recipe, PHYSICAL CORES ONLY, directly
    comparable to its section-6 passthrough curve): ENGINE on cores 0-13 (14), GENERATOR =
    async-tcp-generator, FIXED 10-thread tokio pool on cores 14-23, ONE shared process
    (one in-RAM bid_1GB copy, -n N clients released together, -m 6 passes, chunk 128 KB,
    unthrottled). Run with --generator-bin .../async-tcp-generator.

    ARMS (both w=14 -- symmetric worker count, downstream identical):
      async_compiled      = TCP (asio, conns multiplexed on io=8) + SIMDCSV + Traced/Eisel
                            in + JIT CSV/ZMIJ out. Probe-validated: io8/w14 beats the
                            strict-budget io6/w8 by +18% on q1 (worker-bound workload; the
                            passthrough section-5 equivalence does NOT transfer).
      blocking_uncompiled = BlockingTCP (1 OS thread/conn) + SequentialUncompiledCSV
                            parsing INTERPRETED in the connection thread + CSVUncompiled
                            out (parser overrides FORBIDDEN on the uncompiled formatter).

    PROBE ANCHORS (1 rep): blocking N=1 = 407 MB/s (file ceiling 444 minus recv copy);
    async @100 = 7843, @250 = 7762 (FLAT, worker-bound); blocking @100 = 2857 (already
    deep in degradation -- passthrough blocking held 9.4 GB/s at 100).

    PREDICTIONS (write before running):
      - async: ~1.5-3 @1 (single conn, recv+parse pipeline), ~7-8 by N=10-50, flat 7.8
        through 250. p50 ms-scale rising slowly (16.9 @100 -> ~20 @250), p99 25-30.
      - blocking: 407 @1, near-linear to N~10 (~4 GB/s, 24 busy threads on 14 cores
        already SMT-less oversubscribed -> some droop vs file's clean linearity), peak
        somewhere N=10-50 (~4-5.5 GB/s), 2.9 @100 (probe), and @250 the open question:
        passthrough blocking floored at 3.3 via voluntary wake/park storm + backpressure;
        parse-hungry threads should make it WORSE (~1.5-2.5) and shift the mechanism
        toward file-style nonvoluntary preemption (always-runnable threads). If @250 it
        holds ~2.9 flat instead, backpressure is throttling the producer into a stable
        (slow) equilibrium rather than a churn collapse.
      - Gap: ~5x @1 (2 GB/s vs 0.4), narrowing to ~1.5-2x at the blocking peak, then
        rewidening to ~2.7x @100 and ~3-5x @250.

    GOTCHAS (load-bearing):
      - PIN BOTH SIDES (worker_cpus 0-13 + generator.cpus 14-23, disjoint); unpinned TCP
        numbers are generator-placement-confounded. pkill -x main AND -x async-tcp-gener
        between runs (runner does; 15-char comm truncation).
      - Loopback latency ABSOLUTES carry the recv-wait confound -- trust shape/contrast.
      - Arms run sequentially (thermal drift possible; do not over-read <5% deltas).
      - Do NOT probe the generator port (consumes a client slot). Runner syncs on
        "Listening on".
      - Requires the uncompiled sourceCreationTimestamp fix + the runner taskset/async-gen
        extension (both 2026-07-06/07).
      - Blocking N=250 moves 1.5 TB at a possibly-collapsed rate -> completion_timeout
        1800; a long tail is DATA not a hang (check generator CPU if unsure).
      - FOLLOW-UP PLANNED: extend to N=500/1000 (mind: blocking @500+ may drop queries
        like the passthrough study did past 250 -- n_ok < N -- and 1000 conns x 6 GB at
        ~1.5 GB/s is ~70 min/rep; use 1 rep and a bigger timeout there).

    RESULTS (2026-07-07, reps=3, 0 failures -- predictions held throughout):
      async_compiled:      N=1/10/50/100/250 = 2979 / 7483 / 7794 / 7931 / 7896 MB/s.
        Plateau ~7.8-7.9 GB/s from N=10, FLAT through 250 (worker-bound; io pool
        multiplexes connections for free, same as file). p50 0.2 -> ~17-19 ms (the ms
        scale is the loopback recv-wait confound + 14 workers), p99 <= 27, p999 <= 43.
      blocking_uncompiled: N=1/10/50/100/250 = 411 / 3611 / 3770 / 2839 / 1733 MB/s.
        N=1 = the interpreted ceiling minus recv copy. Mild droop ALREADY at N=10
        (361/src = 89% of solo -- 24 busy threads on 14 SMT-less cores), peak ~3.8 GB/s
        at N=10-50, then decline: 2.8 @100, 1.73 @250 -- BELOW passthrough-blocking's
        3.3 GB/s floor at the same point, confirming parse-hungry connection threads
        deepen the collapse (always-runnable -> preemption thrash + TCP backpressure).
        p50 0.5/0.6 -> 34 -> 50 -> 91 ms; p99 163 / p999 207 ms at 250.
      GAP: 7.2x @1, ~2.1x @10-50 (midrange narrowing, like file), 2.8x @100, 4.6x @250.
      TCP-vs-file contrast: the whole system is ~40% slower (7.9 vs 13.5 plateau; recv
      copy + 10 cores ceded to the generator), blocking's peak comes EARLIER (N~10-50 vs
      N=50) and its collapse is DEEPER (parse threads + backpressure).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  completion_timeout_s: 1800
  worker_cpus: "0-13"
  worker:
    query_engine:
      number_of_worker_threads: 14
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 32768
  query_config:
    sink_type: Monitoring
  generator:
    kind: async
    cpus: "14-23"
    threads: 10
    chunk_size_kb: 128
    repeat: 6
    rate: 1000000

variants:
  - name: parse_thread_model_tcp
    description: "q1 over TCP: async compiled (io8/w14) vs blocking uncompiled sequential (w14), core-budgeted 10/14"
    query: nexmark/q1_price
    axes:
      x:
        label: "Concurrent Queries (= Concurrent TCP Connections)"
        parameter: num_queries
        values: [1, 10, 50, 100, 250]
      series:
        label: "Ingestion + parse model"
        explicit:
          - name: async_compiled
            baseline: true
            overrides:
              worker.query_engine.number_of_io_threads: 8
              query_config.source_type: TCP
              query_config.input_formatter: { type: SIMDCSV }
              query_config.input_parser: { uint64: TracedUINT64, int32: TracedINT32, f64: EiselFloatF64 }
              query_config.output_formatter: { type: CSV }
              query_config.output_parser: { f64: ZMIJF64 }
          - name: blocking_uncompiled
            overrides:
              worker.query_engine.number_of_io_threads: 4
              query_config.source_type: BlockingTCP
              query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: sequential }
              query_config.output_formatter: { type: CSVUncompiled }
    y:
      metric: throughput_mbps
      label: "Aggregate System Throughput (MB/s)"
    visualization:
      type: line_chart
      x_scale: log
