experiment:
  name: ablation_q14_fast
  description: >
    FAST single-query probe of the NEW 8-rung ladder on nexmark/q14_calc (computed-float
    range filter: price*908/1000 in (1e6, 5e7)). Purpose: see whether each rung actually
    MOVES for a float-parse/arith/float-output query, and refine the ladder ordering.

    NEW LADDER vs the old v2 (ablation_stateless_v2): single-threading is
    number_of_worker_threads: 1 (user ruling 2026-07-17), NOT the threading_mode SEQUENTIAL
    shortcut at W16 -- so the r1->r2 (uncompiled indexer) and r2->r3 (compiled) steps no
    longer conflate the formatter's fuse-to-one-thread with downstream worker parallelism.
    (Sequential* formatters still REQUIRE threading_mode: SEQUENTIAL + BlockingFile; the
    knob that changed is the worker count, which single-threads the uncompiled arm's
    downstream ops too.)

    RUNGS (r1-r7 run on the CURRENT binary -- all runtime knobs; r8 needs an InlineTagConfig
    rebuild and is NOT in this file):
      r1 olduncompiled : SequentialUncompiledOldCSV  (scalar find indexer, interpreted)
      r2 uncompiled    : SequentialUncompiledCSV     (SIMD band indexer, interpreted)
      r3 compiled      : SequentialCSV, all JIT knobs OFF (default invoke, no inline, no tcb)
      r4 +fnattr       : invoke_mode_configuration -> fnattr
      r5 +inline       : inline_invoke_calls -> true
      r6 +tcb          : trace_constant_bytes -> true
      r7 parallel+ovl  : File + SIMDCSV PARALLEL, W16, overload true  (scale-out + overload)

    EXPECTED-INERT rungs on q14 (state this up front so a flat bar is not misread as a bug):
      - r6 (tcb): q14 has only NUMERIC literals (908/1000/1e6/5e7), no string/VARSIZED
        equality, so embedConstantBytes/bytesEqual are never exercised. Predict ~flat.
      - overload part of r7: q14 filters a COMPUTED value (price*908/1000 > 1e6), not a
        direct lazy-field==const, so lazy overloads likely do not engage. The SCALE-OUT
        (W1->W16, BlockingFile->File) part of r7 WILL move.
    Where q14 SHOULD move: r2->r3 (compiled: JIT + lazy elision + fused pipeline), r3->r4
    (fnattr), r4->r5 (proxy inline). v2 saw compiled 888 -> fnattr 1337 MB/s here (+50%).

    METRIC: throughput_mbps (repeat differs per rung -> time not comparable; MB/s is
    repeat-invariant, _compute_input_size multiplies by generator.repeat). 3 reps, median.
    DATA: medium (bid_1GB, ~1.09 GB real). Per-rung repeat tuned for ~5-7 s windows:
      r1-r6 (W1, ~0.7-1.3 GB/s): repeat 5  -> ~5.4 GB/run
      r7   (W16, ~5-7 GB/s)   : repeat 35 -> ~38 GB/run (~5-7 s, avoids the sub-second trap)

    PORT: --worker-port 9099 (host 8080 permanently held by an unrelated docker container).
    ENV: performance governor (sudo cpupower frequency-set -g performance; resets per reboot).
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
           experiments/ablation_q14_fast.yaml \
           --build-dir ~/work/nebulastream-public/cmake-build-release --worker-port 9099 --detach
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: default
      inline_invoke_calls: false
      trace_constant_bytes: false
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: SEQUENTIAL }
    output_formatter: { type: JSONUncompiled }
    input_parser: {}
    output_parser: {}
  generator:
    repeat: 5

_fast_parsers: &fast_parsers
  uint64: TracedUINT64
  int64: TracedINT64
  int32: FastINT32
  int16: TracedINT16
  uint32: TracedUINT32
  uint16: TracedUINT16
  bool: TracedBOOL
  f64: EiselFloatF64
  f32: EiselFloatF32
_fast_out: &fast_out { f64: ZMIJF64, f32: ZMIJF32 }

_ladder_q14: &ladder_q14
  label: "optimization (cumulative)"
  explicit:
    - name: r1_olduncompiled
      baseline: true
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledOldCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: r2_uncompiled
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialUncompiledCSV, threading_mode: SEQUENTIAL }
        query_config.output_formatter: { type: JSONUncompiled }
        query_config.input_parser: {}
        query_config.output_parser: {}
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: r3_compiled
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: default
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: r4_fnattr
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: false
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: r5_inline
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: false
        overload: false
        generator.repeat: 5
    - name: r6_tcb
      overrides:
        query_config.source_type: BlockingFile
        query_config.input_formatter: { type: SequentialCSV, threading_mode: SEQUENTIAL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 1
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: false
        generator.repeat: 5
    - name: r7_parallel_overload
      overrides:
        query_config.source_type: File
        query_config.input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
        query_config.input_parser: *fast_parsers
        query_config.output_parser: *fast_out
        worker.query_engine.number_of_worker_threads: 16
        worker.query_engine.ccx_aware_task_queues: true
        worker.query_engine.invoke_mode_configuration: fnattr
        worker.query_engine.inline_invoke_calls: true
        worker.query_engine.trace_constant_bytes: true
        overload: true
        generator.repeat: 35

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]

_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (MB/s)" }

variants:
  - name: nx_q14_calc
    description: "q14 (reduced): computed-float range filter, tunable selectivity"
    query: nexmark/q14_calc
    axes: { x: *noop_x, series: *ladder_q14 }
    y: *tput_y
    visualization: { type: grouped_bar }
