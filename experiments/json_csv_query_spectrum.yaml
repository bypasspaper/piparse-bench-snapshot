experiment:
  name: json_csv_query_spectrum
  description: >
    How close does JSON input (SchemaJSON) get to the CSV reference across a query spectrum from pure
    field-forwarding to real per-row compute (where lazy forwarding can't hide the parser)? Lean 4-arm
    matrix (input x output), grouped so the CSV reference is the yardstick within each output format:
      csv_c2c   = SIMDCSV(csv)  -> CSV   (reference: both raw-forward on passthrough)
      csv_c2j   = SIMDCSV(csv)  -> JSON  (reference)
      sjson_j2c = SchemaJSON    -> CSV   (= the json->csv goal direction)
      sjson_j2j = SchemaJSON    -> JSON  (= the json->json goal direction)
    All over bid_strings_3GB (6-field bid, 31.3M rows). csv arms read 3.60GB, json arms 5.57GB (SAME rows),
    so throughput_mbps is NOT comparable csv-vs-json -- the FAIR cross-input metric is Mrows/s (printed
    alongside MB/s); read Mrows/s across inputs, MB/s within an input. r6 fullopt, W1, single-node/FUSED,
    128KiB, governor performance, assume_clean_strings=true (default), n=5 median.
    QUERIES (forward -> compute spectrum):
      passthrough : SELECT auctionId,bidder,price,channel,url         (forwards all 5)
      star        : SELECT *                                          (forwards all 6, 2 varsized)
      q2_filter   : SELECT auctionId,price WHERE auctionId%123=0      (parses auctionId/row; ~0.8% survive)
      q1_compute  : SELECT timestamp,auctionId,bidder,price*908/1000  (price parsed+computed+ZMIJ/row)
    Correctness gated first by json_csv_query_spectrum_smoke.yaml (Checksum sink; all arms per query must
    agree -- value-identical across inputs AND outputs).
    RUN: cd ~/work/piparse-bench && PBENCH_KEEP_LOGS=1 uv run python bench.py run \
      experiments/json_csv_query_spectrum.yaml --build-dir ~/work/nebulastream-public/cmake-build-release \
      --worker-port 9099
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 5
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 1800
  overload: false
  worker:
    query_engine:
      number_of_worker_threads: 1
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: true
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: BlockingFile
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    output_formatter: { type: JSON }
    input_parser: { uint64: TracedUINT64, int64: TracedINT64, int32: FastINT32, int16: TracedINT16, uint32: TracedUINT32, uint16: TracedUINT16, bool: TracedBOOL, f64: EiselFloatF64, f32: EiselFloatF32 }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1

_noop_x: &noop_x
  label: "config"
  parameter: topology
  values: [single-node]
_tput_y: &tput_y { metric: throughput_mbps, label: "Throughput (compare csv-vs-json on Mrows/s)" }

_arm_series: &arm_series
  label: "arm"
  explicit:
    - name: csv_c2c
      baseline: true
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: CSV }
    - name: csv_c2j
      overrides:
        data_size: csv
        query_config.input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
        query_config.output_formatter: { type: JSON }
    - name: sjson_j2c
      overrides:
        data_size: large
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: CSV }
    - name: sjson_j2j
      overrides:
        data_size: large
        query_config.input_formatter: { type: SchemaJSON }
        query_config.output_formatter: { type: JSON }

variants:
  - name: passthrough
    description: "forward all 5 fields"
    query: nexmark/bid_json_passthrough
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: star
    description: "SELECT * (6 fields, 2 varsized)"
    query: nexmark/bid_json_star
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q2_filter
    description: "filter: parse auctionId/row, ~0.8% survive"
    query: nexmark/bidstr_iso_q2
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  - name: q1_compute
    description: "compute: price*908/1000 parsed+ZMIJ-serialized/row"
    query: nexmark/bidstr_iso_q1
    axes: { x: *noop_x, series: *arm_series }
    y: *tput_y
    visualization: { type: grouped_bar }
  # agg_sum (windowed SUM/COUNT) DROPPED 2026-07-30: the worker SIGSEGVs in
  # IngestionTimeWatermarkAssignerLogicalOperator::withInferredSchema at query registration -- a
  # pre-existing engine bug in ingestion-time windows on this branch (count-collapse patch was dropped),
  # unrelated to the formatter work. State-bound aggs are known format-irrelevant (YSB law) anyway.
