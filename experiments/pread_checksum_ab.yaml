# SPDX-License-Identifier: Apache-2.0
experiment:
  name: pread_checksum_ab
  description: >
    CORRECTNESS gate for the BlockingFileSource pread rewrite (session 2026-07-03): replaced
    std::ifstream with a raw ::read directly into the pool buffer. Compare the Checksum-sink output
    of BlockingFile (pread, SEQUENTIAL formatter) against the known-good async File source (io_uring
    family, unchanged) over the same query/data. The Checksum sink writes "count,checksum" over the
    fully-materialized output (order + content sensitive) -> the two arms MUST print identical
    count,checksum. Any off-by-one read, dropped tail, or mis-aligned buffer boundary would diverge.
    bid_1GB (medium), warm, repeat 1. NOTE: File (async) uses the PARALLEL formatter, BlockingFile
    uses SEQUENTIAL inline -- both must yield the same logical result regardless of execution model.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 1
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: medium
  topology: single-node
  cold_read: false
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 4
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 2048
  query_config:
    sink_type: Checksum
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator:
    repeat: 1
    mode: burst
    rate: 1000000

variants:
  - name: pread_checksum_ab
    description: "medium bid_1GB checksum: BlockingFile pread SEQUENTIAL vs async File PARALLEL"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "source"
        explicit:
          - name: "File_reference"
            baseline: true
            overrides:
              query_config.source_type: File
              query_config.input_formatter.type: SIMDCSV
          - name: "BlockingFile_pread_seq"
            overrides:
              query_config.source_type: BlockingFile
              query_config.input_formatter.type: SequentialCSV
              query_config.input_formatter.threading_mode: sequential
    y: {metric: throughput_mbps, label: "Throughput (MB/s)"}
    visualization: {type: bar_chart}
