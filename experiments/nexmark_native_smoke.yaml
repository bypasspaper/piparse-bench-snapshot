experiment:
  name: nexmark_native_smoke
  # PLUMBING SMOKE for nexmark_native_vs_csv (not a benchmark): does the SystemNative input path
  # run on the PRODUCTION worker-cli+MonitoringSink stack at all? Context (2026-07-08): in systest
  # mode the native path RETAINS pool buffers ~O(input size) until EoS (bid 4.4GB .nes exhausts a
  # 2GB pool in ~2s regardless of default_max_inflight_buffers; passes only with an 8.6GB pool and
  # then takes 31s) while the CSV path streams fine at ~5GB/s in a 2GB pool. This smoke checks the
  # same on worker-cli, where File sources get a PRIVATE pool (default_max_inflight_buffers): if
  # spanning staging pins raw buffers, the source should STALL/hang -> completion timeout (120s).
  # csv_optimized arm doubles as harness sanity (~expect multi-GB/s, valid monitoring CSV).
  description: "SMOKE: native vs csv single q0 run on the production worker-cli path"
  primary_metric: processing_time_s
  higher_is_better: false
  repetitions: 1
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  completion_timeout_s: 120
  worker:
    query_engine:
      number_of_worker_threads: 16
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      pin_threads: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, allow_commas_in_strings: false }
    input_parser: { uint64: TracedUINT64, int32: FastINT32, f64: EiselFloatF64 }
    output_formatter: { type: CSV }
    output_parser: { f64: ZMIJF64 }
  generator:
    repeat: 1
variants:
  - name: q0_bid_star_smoke
    description: "single-rep q0 both arms, repeat=1"
    query: nexmark/bid_star
    axes:
      x:
        label: "worker threads"
        parameter: worker.query_engine.number_of_worker_threads
        values: [16]
      series:
        label: "input format"
        explicit:
          - name: csv_optimized
            baseline: true
            overrides: {}
          - name: native
            overrides:
              data_size: native
              query_config.input_formatter: { type: SystemNative, string_length: "16,32,32,16,4,256" }
              query_config.input_parser: {}
    y: { metric: processing_time_s, label: "Processing time (s)" }
    visualization: { type: grouped_bar }
