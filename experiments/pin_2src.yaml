experiment:
  name: pin_2src
  description: >
    Give the 2nd io thread a source. IO=2/W=4 pinned (6 threads = full CCX0), File
    passthrough, num_queries 1 vs 2: with 1 source IOThread_1 is idle (= IO1/W4, 8.9
    GB/s); with 2 sources both io threads should read (one source each), ~2x read
    supply. Question: does aggregate jump above 8.9, and what's the NEW bottleneck?
    pidstat will show whether the 4 shared workers saturate (they were ~76% on one
    source -> ~100% would cap ~11-12) or the shared CCX0 32 MB L3 / DRAM caps it (2
    sources' working set may exceed L3). pool series {128=16MB, 256=32MB} since 2
    sources need more in-flight buffers.
    PREDICTION: 2 sources > 1 (both io threads now active), new limiter = the 4 shared
    workers (~100%) and/or the CCX L3 capacity, landing ~11-14 GB/s (not 17.8 = 2x,
    since only 4 workers and one shared L3). Companion to §21p (single-source = io-bound).
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median
defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: large
  topology: single-node
  worker:
    query_engine: {pin_threads: true, number_of_io_threads: 2, number_of_worker_threads: 4, invoke_mode_configuration: fnattr}
    default_query_execution: {operator_buffer_size: 131072, execution_mode: COMPILER}
  query_config:
    source_type: File
    sink_type: Monitoring
    input_formatter: {type: SIMDCSV}
    input_parser: {uint64: TracedUINT64, int32: TracedINT32, int64: TracedINT64}
    output_formatter: {type: CSV}
  generator: {repeat: 4, mode: burst, rate: 1000000}
variants:
  - name: pin_2src
    description: "IO=2/W=4 pinned, 1 vs 2 File sources (queries), pool 128/256"
    query: nexmark/bid_passthrough
    axes:
      x:
        label: "concurrent File sources (queries)"
        parameter: num_queries
        values: [1, 2]
      series:
        label: "pool"
        explicit:
          - {name: "p128_16MB", baseline: true, overrides: {worker.number_of_buffers_in_global_buffer_manager: 128}}
          - {name: "p256_32MB", overrides: {worker.number_of_buffers_in_global_buffer_manager: 256}}
    y: {metric: throughput_mbps, label: "Aggregate Throughput (MB/s)"}
    visualization: {type: line_chart}
