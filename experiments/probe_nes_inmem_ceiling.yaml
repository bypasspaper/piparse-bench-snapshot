# SPDX-License-Identifier: Apache-2.0
experiment:
  name: probe_nes_inmem_ceiling
  description: >
    Read-relieved NES ceiling on the CURRENT build: same config as the head-to-head stateless
    (W23 healthy, csv->json, SIMDCSV PARALLEL, Monitoring sink) but source_type InMemory (prefill
    once, replay from RAM zero-copy) so the file read is OFF the timed path -> measures NES's true
    processing rate. NES_INMEM_REPEAT=20, so TRUE throughput = reported x20 (pbench's MB/s uses
    size_of_input_data = 1x catalog while the engine replays 20x). Compare q0/q_project to the
    File-source probe (File ~6/~8 GB/s) and the matrix's csv->json q0 = 16.4 GB/s. Confirms
    whether the head-to-head ~6 GB/s is read-clipped (expected: InMemory ~2.5x higher). NES-only.
  primary_metric: throughput_mbps
  higher_is_better: true
  repetitions: 3
  aggregation: median

defaults:
  system: nebulastream
  branch: benchmark-piparse-lazyparse-fast-csv
  mode: worker-cli
  build: native
  data_size: csv
  topology: single-node
  warm_read: true
  completion_timeout_s: 900
  worker:
    query_engine:
      number_of_worker_threads: 23
      number_of_io_threads: 1
      invoke_mode_configuration: fnattr
      inline_invoke_calls: true
      trace_constant_bytes: true
      pin_threads: false
      ccx_aware_task_queues: false
      admission_queue_size: 1024
    default_query_execution:
      operator_buffer_size: 131072
      execution_mode: COMPILER
    number_of_buffers_in_global_buffer_manager: 16384
    dump_compilation_result: NONE
  query_config:
    source_type: InMemory
    sink_type: Monitoring
    input_formatter: { type: SIMDCSV, threading_mode: PARALLEL, allow_commas_in_strings: false }
    input_parser:
      uint64: TracedUINT64
      int64: TracedINT64
      int32: FastINT32
      int16: TracedINT16
      uint32: TracedUINT32
      uint16: TracedUINT16
      f64: EiselFloatF64
      f32: EiselFloatF32
      bool: TracedBOOL
    output_formatter: { type: JSON }
    output_parser: { f64: ZMIJF64, f32: ZMIJF32 }
  generator:
    repeat: 1
  worker_env:
    NES_INMEM_PREFILL: 1
    NES_INMEM_REPEAT: 20
    NES_INMEM_BUFSIZE: 131072

_axes_x: &w23_x
  label: "worker threads"
  parameter: worker.query_engine.number_of_worker_threads
  values: [23]

_y: &mbps_y { metric: throughput_mbps, label: "Throughput (MB/s; TRUE = reported x20)" }

variants:
  - name: q0
    description: "q0 SELECT * csv->json, InMemory (read-relieved). TRUE = reported x20."
    query: nexmark/matrix/bidstr_q0
    axes: { x: *w23_x }
    y: *mbps_y
    visualization: { type: bar_chart }
  - name: q_project
    description: "q_project SELECT price csv->json, InMemory (read-relieved). TRUE = reported x20."
    query: nexmark/matrix/bidstr_qproject
    axes: { x: *w23_x }
    y: *mbps_y
    visualization: { type: bar_chart }
