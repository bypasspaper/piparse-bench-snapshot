query:
  name: nexmark_q8_join
  description: "Nexmark Q8: person JOIN auction on seller = id, tumbling window 10s"

  sql: |
    SELECT start, end, id, name
    FROM (SELECT * FROM (SELECT * FROM person)
    INNER JOIN (SELECT * FROM auction)
    ON id = seller WINDOW TUMBLING (timestamp, size 10 sec))

  flink_sql: |
    SELECT CAST(TIMESTAMPDIFF(SECOND, TIMESTAMP '1970-01-01 00:00:00', CAST(p.window_start AS TIMESTAMP(3))) AS BIGINT) * 1000 AS `start`, CAST(TIMESTAMPDIFF(SECOND, TIMESTAMP '1970-01-01 00:00:00', CAST(p.window_end AS TIMESTAMP(3))) AS BIGINT) * 1000 AS `end`, p.id, p.name
    FROM (SELECT window_start, window_end, id, name
    FROM TABLE(TUMBLE(TABLE person, DESCRIPTOR(`__rt`), INTERVAL '10' SECOND))) p
    INNER JOIN (SELECT window_start, window_end, seller
    FROM TABLE(TUMBLE(TABLE auction, DESCRIPTOR(`__rt`), INTERVAL '10' SECOND))) a
    ON p.window_start = a.window_start AND p.window_end = a.window_end AND p.id = a.seller

  spark_sql: |
    SELECT unix_millis(p.w.start) AS `start`, unix_millis(p.w.end) AS `end`, p.id, p.name FROM (SELECT window(__rt, '10 seconds') AS w, id, name FROM person) p INNER JOIN (SELECT window(__rt, '10 seconds') AS w, seller FROM auction) a ON p.w = a.w AND p.id = a.seller
  sources:
    - name: person
      flink_rowtime: { column: timestamp, delay: "0.001 SECOND" }
      spark_rowtime: { column: timestamp, delay: "1 millisecond" }
      schema:
        - { name: id, type: INT32, not_null: true }
        - { name: name, type: VARSIZED, not_null: true }
        - { name: email_address, type: VARSIZED, not_null: true }
        - { name: credit_card, type: VARSIZED, not_null: true }
        - { name: city, type: VARSIZED, not_null: true }
        - { name: state, type: VARSIZED, not_null: true }
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: extra, type: VARSIZED, not_null: true }
      data:
        large:
          file: large/nexmark/person_840MB.csv
          size_bytes: 876941057
          rows: 4000000
        native:
          # 4,000,000 rows x 368 B; VARSIZED stored as fixed \x00-padded slots, schema-order
          # lengths string_length='16,32,32,16,4,256'. Generated via csv_to_binary.py.
          file: large/nexmark/person_840MB.nes
          size_bytes: 1472000000
          rows: 4000000

    - name: auction
      flink_rowtime: { column: timestamp, delay: "0.001 SECOND" }
      spark_rowtime: { column: timestamp, delay: "1 millisecond" }
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: id, type: INT32, not_null: true }
        - { name: initialbid, type: INT32, not_null: true }
        - { name: reserve, type: INT32, not_null: true }
        - { name: expires, type: UINT64, not_null: true }
        - { name: seller, type: INT32, not_null: true }
        - { name: category, type: INT32, not_null: true }
      data:
        large:
          # LF copy of auction_707MB.csv (which is CRLF): the trailing \r on the LAST column
          # (category INT32) crashes strict FastINT32 ("malformed"), the engine-default int32
          # parser hits the release-JIT __emutls crash, and TracedINT32 silently MIS-parses it
          # (wrong checksum). Values are identical (category materializes as int either way), so
          # recorded checksums stay valid. Regenerate if wiped:
          #   tr -d '\r' < <build>/nes-systests/testdata/large/nexmark/auction_707MB.csv \
          #     > <build>/nes-systests/testdata/large/nexmark/auction_707MB.csv
          # NOTE: pre-2026-07-08 recorded MB/s for q8 queries used the CRLF file (741852154 B,
          # ~1.6% larger denominator).
          file: large/nexmark/auction_707MB.csv
          size_bytes: 729852154
          rows: 12000000
        native:
          # 12,000,000 rows x 36 B (uint64,int32,int32,int32,uint64,int32,int32 packed LE)
          file: large/nexmark/auction_707MB.nes
          size_bytes: 432000000
          rows: 12000000

  sink_schema:
    - { name: personauction.start, type: UINT64, not_null: true }
    - { name: personauction.end, type: UINT64, not_null: true }
    - { name: person.id, type: INT32, not_null: true }
    - { name: person.name, type: VARSIZED, not_null: true }

  validation:
    large: { tuples: 10999751, checksum: 33652579169 }
    # native expected == large (strings roundtrip exactly: no quotes/NULs in person CSV,
    # converter enforces no truncation) — confirm via smoke before trusting
    native: { tuples: 10999751, checksum: 33652579169 }
