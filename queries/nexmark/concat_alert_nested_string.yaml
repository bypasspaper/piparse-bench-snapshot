query:
  name: nexmark_concat_alert_nested_string
  description: "Alert-string use case: CONCAT(constant-literal, varsized column) wrapped in two constants -> flattened 3-span rope."

  # The hospital alert-string pattern the user described: a constant prefix concatenated
  # with a runtime string value, emitted as JSON. The constant "alert: bid on channel " is
  # baked as a JIT const global (trace_constant_bytes); the fix lets LLVM constant-forward
  # its per-row copy into immediate stores instead of a volatile load-from-global.
  sql: |
    SELECT auctionId, bidder, price, CONCAT(CONCAT(VARSIZED("alert: bid on channel "), channel), VARSIZED(" -- END")) AS alert FROM bid

  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
        - { name: channel, type: VARSIZED, not_null: true }
        - { name: url, type: VARSIZED, not_null: true }
      data:
        large:
          file: large/nexmark/bid_strings_3GB.csv
          size_bytes: 3595281395
          rows: 31300000

  sink_schema:
    - { name: bid.auctionId, type: INT32, not_null: true }
    - { name: bid.bidder, type: INT32, not_null: true }
    - { name: bid.price, type: FLOAT64, not_null: true }
    - { name: alert, type: VARSIZED, not_null: true }
