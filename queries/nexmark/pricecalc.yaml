# Single COMPUTED float: SELECT price*908/1000 -- forces ZMIJ serialization (NOT lazy passthrough).
# Isolates the non-passthrough output path (the value is materialized in a register and must be
# serialized to decimal text), the counterpart to the lazy-passthrough bid_ts/bid_star probes.
query:
  name: nexmark_pricecalc
  description: "SELECT price*908/1000 -- 1 computed FLOAT64/row, ZMIJ serialize path"
  sql: "SELECT price * FLOAT64(908) / FLOAT64(1000) as price FROM bid"
  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
      data:
        tiny:
          file: small/nexmark/bid_5K.csv
          size_bytes: 8192
          rows: 165
        medium:
          file: large/nexmark/bid_1GB.csv
          size_bytes: 1089194961
          rows: 31300000
  sink_schema:
    - { name: price, type: FLOAT64, not_null: true }
