query:
  name: nexmark_bidstr_iso_q1
  description: >
    Nexmark Q1 (currency conversion) over the 6-field bid_strings dataset, for the JSON-input
    isolation study. SELECT timestamp, auctionId, bidder, price*908/1000. Every row materialises
    ALL FOUR numeric fields (3 forwarded + price computed) -> this is the "parse every numeric
    field" test (UINT64 + 2x INT32 + FLOAT64 per row), contrast q2 which parses only auctionId
    every row. channel/url present but not projected (JSON skips, CSV indexes, native reads).
    Three input representations of the IDENTICAL 31.3M logical rows:
      json   -> bid_strings_3GB.json  (JSON formatter, simdjson on-demand)
      csv    -> bid_strings_3GB.csv   (SIMDCSV formatter)
      native -> bid_strings_3GB.nes   (SystemNative, string_length "13,73"; NO parse = floor)
    Run at OUTPUT_FORMAT=NATIVE + Monitoring sink -> output serialization removed, INPUT parser
    dominates. Compare on processing_time_s / Mrows/s (rows identical across arms; byte
    denominators differ so MB/s is NOT cross-arm comparable).

  sql: "SELECT timestamp, auctionId, bidder, price * FLOAT64(908) / FLOAT64(1000) as price FROM bid"

  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
        - { name: channel, type: VARSIZED, not_null: true }
        - { name: url, type: VARSIZED, not_null: true }
      data:
        json:
          file: large/nexmark/bid_strings_3GB.json
          size_bytes: 5567181395
          rows: 31300000
        csv:
          file: large/nexmark/bid_strings_3GB.csv
          size_bytes: 3595281395
          rows: 31300000
        native:
          file: large/nexmark/bid_strings_3GB.nes
          size_bytes: 3443000000
          rows: 31300000

  sink_schema:
    - { name: bid.timestamp, type: UINT64, not_null: true }
    - { name: bid.auctionId, type: INT32, not_null: true }
    - { name: bid.bidder, type: INT32, not_null: true }
    - { name: price, type: FLOAT64, not_null: true }
