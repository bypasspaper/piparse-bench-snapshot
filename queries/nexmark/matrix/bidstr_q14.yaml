# GENERATED for the 16-cell input x output matrix (session 2026-08-04b). q14 computed-float range filter.
# Schema family bidstr; junk leaves not_null (interpreted rung has no NULL coercion).
query:
  name: matrix_bidstr_q14
  description: "q14 computed-float range filter"
  sql: |
    SELECT auctionId, bidder, price * FLOAT64(908) / FLOAT64(1000) AS price FROM bid WHERE price * FLOAT64(908) / FLOAT64(1000) > FLOAT64(1000000) AND price * FLOAT64(908) / FLOAT64(1000) < FLOAT64(50000000)
  flink_sql: |
    SELECT auctionId, bidder, price * CAST(908 AS DOUBLE) / CAST(1000 AS DOUBLE) AS price FROM bid WHERE price * CAST(908 AS DOUBLE) / CAST(1000 AS DOUBLE) > CAST(1000000 AS DOUBLE) AND price * CAST(908 AS DOUBLE) / CAST(1000 AS DOUBLE) < CAST(50000000 AS DOUBLE)
  spark_sql: |
    SELECT auctionId, bidder, price * CAST(908 AS DOUBLE) / CAST(1000 AS DOUBLE) AS price FROM bid WHERE price * CAST(908 AS DOUBLE) / CAST(1000 AS DOUBLE) > CAST(1000000 AS DOUBLE) AND price * CAST(908 AS DOUBLE) / CAST(1000 AS DOUBLE) < CAST(50000000 AS DOUBLE)
  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
        - { name: channel, type: VARSIZED, not_null: true }
        - { name: url, type: VARSIZED, not_null: true }
      data:
        csv:
          file: large/nexmark/bid_strings_3GB.csv
          size_bytes: 3595281395
          rows: 31300000
        json:
          file: large/nexmark/bid_strings_3GB.json
          size_bytes: 5567181395
          rows: 31300000
        native:
          file: large/nexmark/bid_strings_3GB.nes
          size_bytes: 3443000000
          rows: 31300000
  sink_schema:
    - { name: bid.auctionId, type: INT32, not_null: true }
    - { name: bid.bidder, type: INT32, not_null: true }
    - { name: price, type: FLOAT64, not_null: true }
