query:
  name: q2o_lt_probe
  description: "probe: signed+unsigned constantLt coverage (folded-digits rewrite validation)"
  sql: |
    SELECT auctionId, price FROM bid
    WHERE auctionId < INT32(1007) AND timestamp < UINT64(1746560850000)
  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
      data:
        medium:
          file: large/nexmark/bid_1GB.csv
          size_bytes: 1089194961
          rows: 31300000
  sink_schema:
    - { name: bid.auctionId, type: INT32, not_null: true }
    - { name: bid.price, type: FLOAT64, not_null: true }
