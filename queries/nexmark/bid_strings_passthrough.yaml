query:
  name: nexmark_bid_strings_passthrough
  description: >
    Varsized PASSTHROUGH -> CSV. SELECT auctionId, bidder, price, channel, url FROM bid over the
    bid_strings dataset (channel + url are VARSIZED). No CONCAT: this is the ORDINARY csv->csv
    serialization path. In the fused single-node topology the passthrough varsized fields stay LAZY
    at the formatter, so on the current binary they route through the generalized rope's
    writeEachChunk -> writeVarsizedSpan (single span), whereas the pre-rope baseline (29e213ba09)
    writes them via the old writeVarsized. This query is the primary probe for a CSV-serialization
    regression from the rope generalization (it is the common path every csv->csv query hits, not
    just CONCAT). Same bid_strings_3GB data as concat_alert so the two are directly comparable.

  sql: |
    SELECT auctionId, bidder, price, channel, url FROM bid

  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
        - { name: channel, type: VARSIZED, not_null: true }
        - { name: url, type: VARSIZED, not_null: true }
      data:
        large:
          file: large/nexmark/bid_strings_3GB.csv
          size_bytes: 3595281395
          rows: 31300000
        csv:
          file: large/nexmark/bid_strings_3GB.csv
          size_bytes: 3595281395
          rows: 31300000
        json:
          file: large/nexmark/bid_strings_3GB.json
          size_bytes: 5567181395
          rows: 31300000

  sink_schema:
    - { name: bid.auctionId, type: INT32, not_null: true }
    - { name: bid.bidder, type: INT32, not_null: true }
    - { name: bid.price, type: FLOAT64, not_null: true }
    - { name: bid.channel, type: VARSIZED, not_null: true }
    - { name: bid.url, type: VARSIZED, not_null: true }
