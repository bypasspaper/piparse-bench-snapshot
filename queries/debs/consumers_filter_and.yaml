query:
  name: debs_consumers_filter_and
  description: "DEBS consumers: WHERE consumedPower >= 400 and sectorId = 1"

  sql: "SELECT * FROM consumers WHERE consumedPower >= FLOAT64(400) and sectorId = INT32(1)"

  sources:
    - name: consumers
      schema:
        - { name: consumerId, type: INT32, not_null: true }
        - { name: sectorId, type: INT32, not_null: true }
        - { name: consumedPower, type: FLOAT64, not_null: true }
        - { name: consumerType, type: VARSIZED, not_null: true }
        - { name: timestamp, type: UINT64, not_null: true }
      data:
        large:
          file: large/debs/CONSUMERS_TOPIC_1G.csv
          size_bytes: 1073741824

  sink_schema:
    - { name: consumers.consumerId, type: INT32, not_null: true }
    - { name: consumers.sectorId, type: INT32, not_null: true }
    - { name: consumers.consumedPower, type: FLOAT64, not_null: true }
    - { name: consumers.consumerType, type: VARSIZED, not_null: true }
    - { name: consumers.timestamp, type: UINT64, not_null: true }

  validation:
    large: { tuples: 3556803, checksum: 9027432231 }