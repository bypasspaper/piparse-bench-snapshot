query:
  name: debs_solar_sliding_agg
  description: "DEBS: sliding window SUM(producedPower) grouped by groupId, 1 hour, 10 minute slide"

  sql: |
    SELECT start, end, groupId, SUM(producedPower) AS producedPower
    FROM solarPanels
    GROUP BY groupId
    WINDOW SLIDING(timestamp, SIZE 1 HOUR, ADVANCE BY 10 MINUTES)

  sources:
    - name: solarPanels
      schema:
        - { name: producerId, type: INT32, not_null: true }
        - { name: groupId, type: INT32, not_null: true }
        - { name: producedPower, type: FLOAT64, not_null: true }
        - { name: timestamp, type: UINT64, not_null: true }
      data:
        large:
          file: large/debs/SOLAR_PANELS_TOPIC_1G.csv
          size_bytes: 1073741824

  sink_schema:
    - { name: solarPanels.start, type: UINT64, not_null: true }
    - { name: solarPanels.end, type: UINT64, not_null: true }
    - { name: solarPanels.groupId, type: INT32, not_null: true }
    - { name: solarPanels.producedPower, type: FLOAT64, not_null: true }

  validation:
    large: { tuples: 11484119, checksum: 23389063574 }