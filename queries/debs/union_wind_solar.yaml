query:
  name: debs_union_wind_solar
  description: "DEBS: UNION of windTurbines and solarPanels"

  sql: |
    SELECT producerId, groupId, producedPower, timestamp AS ts
    FROM windTurbines
    UNION
    SELECT producerId, groupId, producedPower, timestamp AS ts
    FROM solarPanels

  sources:
    - name: windTurbines
      schema:
        - { name: producerId, type: INT32, not_null: true }
        - { name: groupId, type: INT32, not_null: true }
        - { name: producedPower, type: FLOAT64, not_null: true }
        - { name: timestamp, type: UINT64, not_null: true }
      data:
        large:
          file: large/debs/WIND_TURBINES_TOPIC_5M.csv
          size_bytes: 5078961

    - name: solarPanels
      schema:
        - { name: producerId, type: INT32, not_null: true }
        - { name: groupId, type: INT32, not_null: true }
        - { name: producedPower, type: FLOAT64, not_null: true }
        - { name: timestamp, type: UINT64, not_null: true }
      data:
        large:
          file: large/debs/SOLAR_PANELS_TOPIC_1G.csv
          size_bytes: 1073741824

  sink_schema:
    - { name: producerId, type: INT32, not_null: true }
    - { name: groupId, type: INT32, not_null: true }
    - { name: producedPower, type: FLOAT64, not_null: true }
    - { name: ts, type: UINT64, not_null: true }

  validation:
    large: { tuples: 42900001, checksum: 75003740240 }
