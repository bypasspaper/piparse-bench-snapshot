query:
  name: parsergrid_f32
  description: >
    Parser-function grid (f32). csv->json, materialises all 15 FLOAT32 payload fields (f_i * 1) so BOTH
    the input float parser (per field per row) AND the output float serializer are exercised -- codec-dominated,
    so the choice of parser function shows. Dataset large/multicol/mixed_n16.csv (1.59M rows). No filter.
  sql: "SELECT f1 * FLOAT32(1) AS f1, f2 * FLOAT32(1) AS f2, f3 * FLOAT32(1) AS f3, f4 * FLOAT32(1) AS f4, f5 * FLOAT32(1) AS f5, f6 * FLOAT32(1) AS f6, f7 * FLOAT32(1) AS f7, f8 * FLOAT32(1) AS f8, f9 * FLOAT32(1) AS f9, f10 * FLOAT32(1) AS f10, f11 * FLOAT32(1) AS f11, f12 * FLOAT32(1) AS f12, f13 * FLOAT32(1) AS f13, f14 * FLOAT32(1) AS f14, f15 * FLOAT32(1) AS f15 FROM t"
  sources:
    - name: t
      schema:
        - { name: f0, type: UINT64, not_null: true }
        - { name: f1, type: FLOAT32, not_null: true }
        - { name: f2, type: FLOAT32, not_null: true }
        - { name: f3, type: FLOAT32, not_null: true }
        - { name: f4, type: FLOAT32, not_null: true }
        - { name: f5, type: FLOAT32, not_null: true }
        - { name: f6, type: FLOAT32, not_null: true }
        - { name: f7, type: FLOAT32, not_null: true }
        - { name: f8, type: FLOAT32, not_null: true }
        - { name: f9, type: FLOAT32, not_null: true }
        - { name: f10, type: FLOAT32, not_null: true }
        - { name: f11, type: FLOAT32, not_null: true }
        - { name: f12, type: FLOAT32, not_null: true }
        - { name: f13, type: FLOAT32, not_null: true }
        - { name: f14, type: FLOAT32, not_null: true }
        - { name: f15, type: FLOAT32, not_null: true }
      data:
        large:
          file: large/multicol/mixed_n16.csv
          size_bytes: 250000054
  sink_schema:
    - { name: f1, type: FLOAT32, not_null: true }
    - { name: f2, type: FLOAT32, not_null: true }
    - { name: f3, type: FLOAT32, not_null: true }
    - { name: f4, type: FLOAT32, not_null: true }
    - { name: f5, type: FLOAT32, not_null: true }
    - { name: f6, type: FLOAT32, not_null: true }
    - { name: f7, type: FLOAT32, not_null: true }
    - { name: f8, type: FLOAT32, not_null: true }
    - { name: f9, type: FLOAT32, not_null: true }
    - { name: f10, type: FLOAT32, not_null: true }
    - { name: f11, type: FLOAT32, not_null: true }
    - { name: f12, type: FLOAT32, not_null: true }
    - { name: f13, type: FLOAT32, not_null: true }
    - { name: f14, type: FLOAT32, not_null: true }
    - { name: f15, type: FLOAT32, not_null: true }
