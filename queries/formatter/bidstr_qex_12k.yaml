# SPANNING twin of nexmark/matrix/bidstr_qex (figQ): the SAME q_ex SQL on bid_strings rows whose url is padded to
# 12,000 chars -> 12,040 B/row = 2.94 raw buffers @4 KiB (mirrors formatter/bigstr_id_pass_12k, figW). First 43,546 rows
# of bid_strings_3GB.csv (auctionId 1000..3855) -> the literal predicate matches 0 rows (figQ: 220 of 31.3M); the hot
# path is the filter either way (channel on every row, auctionId on the 20% google rows, price never). Generated by
# scratchpad gen_bidstr_url12k.py (session 2026-10-05); data is gitignored, symlinked into the build tree.
query:
  name: bidstr_qex_12k
  description: "q_ex (figQ SQL, unchanged) on url-padded 12 KB bid rows: ~3-buffer spans @4KiB, ~0 output."
  sql: |
    SELECT CONCAT(CONCAT(CONCAT(VARSIZED("Detected low price ("), price), VARSIZED(") [google] for auction ")), auctionId) AS alert, timestamp AS rowcount FROM bid WHERE channel == VARSIZED("google") AND (auctionId == INT32(885300) OR auctionId == INT32(213300)) AND price < FLOAT64(1000000.0)
  sources:
    - name: bid
      schema:
        - { name: timestamp, type: UINT64, not_null: true }
        - { name: auctionId, type: INT32, not_null: true }
        - { name: bidder, type: INT32, not_null: true }
        - { name: price, type: FLOAT64, not_null: true }
        - { name: channel, type: VARSIZED, not_null: true }
        - { name: url, type: VARSIZED, not_null: true }
      data:
        csv:
          file: large/formatter/bidstr_url12k_500m.csv
          size_bytes: 524279918
          rows: 43546
  sink_schema:
    - { name: alert, type: VARSIZED, not_null: true }
    - { name: rowcount, type: UINT64, not_null: true }
