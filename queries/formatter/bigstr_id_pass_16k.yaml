# (id UINT64, s VARSIZED ~16KB) rows. SELECT id: the string makes each row span ~4 buffers @4KiB
# (forcing the SequenceShredder to reassemble the span), but output is only the 8-byte id -> NO string
# output copy. Span-sweep sibling of bigstr_id_pass; one point on the spanning-tuple-size x-axis.
query:
  name: bigstr_id_pass_16k
  description: "SELECT id FROM (id, 16KB string): span ~4 buffers @4KiB, tiny id output (no varsized copy)."
  sql: "SELECT id FROM src"
  sources:
    - name: src
      schema:
        - { name: id, type: UINT64, not_null: true }
        - { name: s, type: VARSIZED, not_null: true }
      data:
        csv:
          file: large/formatter/bigstr_id_16k_500m.csv
          size_bytes: 524298175
          rows: 32755
  sink_schema:
    - { name: src.id, type: UINT64, not_null: true }
