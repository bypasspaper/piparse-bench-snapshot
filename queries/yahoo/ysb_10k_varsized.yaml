query:
  name: yahoo_ysb_10k_varsized
  description: "Yahoo Streaming Benchmark: varsized schema, 10k campaigns, COUNT aggregation"

  sql: |
    SELECT
    start,
    end,
    campaign_id,
    COUNT(user_id) AS count_user_id
    FROM ysb10k
    WHERE event_type == VARSIZED("view")
    GROUP BY campaign_id
    WINDOW TUMBLING(event_time, SIZE 30 SEC)

  flink_sql: |
    SELECT CAST(TIMESTAMPDIFF(SECOND, TIMESTAMP '1970-01-01 00:00:00', CAST(window_start AS TIMESTAMP(3))) AS BIGINT) * 1000 AS `start`, CAST(TIMESTAMPDIFF(SECOND, TIMESTAMP '1970-01-01 00:00:00', CAST(window_end AS TIMESTAMP(3))) AS BIGINT) * 1000 AS `end`, campaign_id, COUNT(user_id) AS count_user_id
    FROM TABLE(TUMBLE(TABLE ysb10k, DESCRIPTOR(`__rt`), INTERVAL '30' SECOND))
    WHERE event_type = 'view'
    GROUP BY window_start, window_end, campaign_id

  sources:
    - name: ysb10k
      flink_rowtime: { column: event_time, delay: "0.001 SECOND" }
      schema:
        - { name: user_id, type: VARSIZED, not_null: true }
        - { name: page_id, type: VARSIZED, not_null: true }
        - { name: campaign_id, type: VARSIZED, not_null: true }
        - { name: ad_id, type: VARSIZED, not_null: true }
        - { name: ad_type, type: VARSIZED, not_null: true }
        - { name: event_type, type: VARSIZED, not_null: true }
        - { name: event_time, type: UINT64, not_null: true }
        - { name: ip_address, type: VARSIZED, not_null: true }
      data:
        large:
          # actual on-disk size (the old 3221225472 was the name's "3GB"); LF file, no CRLF trap
          file: large/ysb/ysb10k_with_varsized_3GB.csv
          size_bytes: 3713333331
          rows: 20000000
        native:
          # 20M rows x 182 B, same tight slots as ysb_1k_varsized: string_length "37,37,37,37,9,9,8"
          file: large/ysb/ysb10k_with_varsized_3GB.nes
          size_bytes: 3640000000
          rows: 20000000

  sink_schema:
    - { name: ysb10k.start, type: UINT64, not_null: true }
    - { name: ysb10k.end, type: UINT64, not_null: true }
    - { name: ysb10k.campaign_id, type: VARSIZED, not_null: true }
    - { name: ysb10k.count_user_id, type: UINT64, not_null: true }

  validation:
    large: { tuples: 670000, checksum: 2725304985 }
