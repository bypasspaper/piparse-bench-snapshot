# serde-micro INT: SELECT * on K=2 int64 columns. CSV + SystemNative binary twin.
query:
  name: serde_micro_intk2
  description: "serde micro: SELECT * on 2 int64 cols (passthrough projection)"
  sql: |
    SELECT * FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: INT64, not_null: true }
        - { name: c1, type: INT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/intk2.csv
          size_bytes: 39555521
          rows: 2000000
        native:
          file: large/serde_micro/intk2.nes
          size_bytes: 32000000
          rows: 2000000
  sink_schema:
    - { name: src.c0, type: INT64, not_null: true }
    - { name: src.c1, type: INT64, not_null: true }
