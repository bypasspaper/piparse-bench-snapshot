# serde-micro INT: SELECT * on K=1 int64 columns. CSV + SystemNative binary twin.
query:
  name: serde_micro_intk1
  description: "serde micro: SELECT * on 1 int64 cols (passthrough projection)"
  sql: |
    SELECT * FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: INT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/intk1.csv
          size_bytes: 19777830
          rows: 2000000
        native:
          file: large/serde_micro/intk1.nes
          size_bytes: 16000000
          rows: 2000000
  sink_schema:
    - { name: src.c0, type: INT64, not_null: true }
