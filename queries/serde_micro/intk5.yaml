# serde-micro INT: SELECT * on K=5 int64 columns. CSV + SystemNative binary twin.
query:
  name: serde_micro_intk5
  description: "serde micro: SELECT * on 5 int64 cols (passthrough projection)"
  sql: |
    SELECT * FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: INT64, not_null: true }
        - { name: c1, type: INT64, not_null: true }
        - { name: c2, type: INT64, not_null: true }
        - { name: c3, type: INT64, not_null: true }
        - { name: c4, type: INT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/intk5.csv
          size_bytes: 98886263
          rows: 2000000
        native:
          file: large/serde_micro/intk5.nes
          size_bytes: 80000000
          rows: 2000000
  sink_schema:
    - { name: src.c0, type: INT64, not_null: true }
    - { name: src.c1, type: INT64, not_null: true }
    - { name: src.c2, type: INT64, not_null: true }
    - { name: src.c3, type: INT64, not_null: true }
    - { name: src.c4, type: INT64, not_null: true }
