# serde-micro MIXED i2f: TOFLOAT64 cast on K=3 INT64 columns -> FLOAT64 output.
# Reuses the pure-panel intk3 datasets; needs the TOFLOAT64 function plugin in the binary.
query:
  name: serde_micro_i2fk3
  description: "serde micro mixed: int64 in -> FLOAT64 out (cheap parse, expensive float serialize), K=3"
  sql: |
    SELECT TOFLOAT64(c0) AS c0, TOFLOAT64(c1) AS c1, TOFLOAT64(c2) AS c2 FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: INT64, not_null: true }
        - { name: c1, type: INT64, not_null: true }
        - { name: c2, type: INT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/intk3.csv
          size_bytes: 59332338
          rows: 2000000
        native:
          file: large/serde_micro/intk3.nes
          size_bytes: 48000000
          rows: 2000000
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
    - { name: c1, type: FLOAT64, not_null: true }
    - { name: c2, type: FLOAT64, not_null: true }
