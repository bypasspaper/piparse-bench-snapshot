# serde-micro MIXED f2i: TOINT64 cast on K=20 FLOAT64 columns -> INT64 output.
# Reuses the pure-panel floatk20 datasets; needs the TOINT64 function plugin in the binary.
query:
  name: serde_micro_f2ik20
  description: "serde micro mixed: float64 in -> INT64 out (expensive float parse, cheap int serialize), K=20"
  sql: |
    SELECT TOINT64(c0) AS c0, TOINT64(c1) AS c1, TOINT64(c2) AS c2, TOINT64(c3) AS c3, TOINT64(c4) AS c4, TOINT64(c5) AS c5, TOINT64(c6) AS c6, TOINT64(c7) AS c7, TOINT64(c8) AS c8, TOINT64(c9) AS c9, TOINT64(c10) AS c10, TOINT64(c11) AS c11, TOINT64(c12) AS c12, TOINT64(c13) AS c13, TOINT64(c14) AS c14, TOINT64(c15) AS c15, TOINT64(c16) AS c16, TOINT64(c17) AS c17, TOINT64(c18) AS c18, TOINT64(c19) AS c19 FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
        - { name: c4, type: FLOAT64, not_null: true }
        - { name: c5, type: FLOAT64, not_null: true }
        - { name: c6, type: FLOAT64, not_null: true }
        - { name: c7, type: FLOAT64, not_null: true }
        - { name: c8, type: FLOAT64, not_null: true }
        - { name: c9, type: FLOAT64, not_null: true }
        - { name: c10, type: FLOAT64, not_null: true }
        - { name: c11, type: FLOAT64, not_null: true }
        - { name: c12, type: FLOAT64, not_null: true }
        - { name: c13, type: FLOAT64, not_null: true }
        - { name: c14, type: FLOAT64, not_null: true }
        - { name: c15, type: FLOAT64, not_null: true }
        - { name: c16, type: FLOAT64, not_null: true }
        - { name: c17, type: FLOAT64, not_null: true }
        - { name: c18, type: FLOAT64, not_null: true }
        - { name: c19, type: FLOAT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/floatk20.csv
          size_bytes: 515552573
          rows: 2000000
        native:
          file: large/serde_micro/floatk20.nes
          size_bytes: 320000000
          rows: 2000000
  sink_schema:
    - { name: c0, type: INT64, not_null: true }
    - { name: c1, type: INT64, not_null: true }
    - { name: c2, type: INT64, not_null: true }
    - { name: c3, type: INT64, not_null: true }
    - { name: c4, type: INT64, not_null: true }
    - { name: c5, type: INT64, not_null: true }
    - { name: c6, type: INT64, not_null: true }
    - { name: c7, type: INT64, not_null: true }
    - { name: c8, type: INT64, not_null: true }
    - { name: c9, type: INT64, not_null: true }
    - { name: c10, type: INT64, not_null: true }
    - { name: c11, type: INT64, not_null: true }
    - { name: c12, type: INT64, not_null: true }
    - { name: c13, type: INT64, not_null: true }
    - { name: c14, type: INT64, not_null: true }
    - { name: c15, type: INT64, not_null: true }
    - { name: c16, type: INT64, not_null: true }
    - { name: c17, type: INT64, not_null: true }
    - { name: c18, type: INT64, not_null: true }
    - { name: c19, type: INT64, not_null: true }
