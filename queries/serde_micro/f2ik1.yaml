# serde-micro MIXED f2i: TOINT64 cast on K=1 FLOAT64 columns -> INT64 output.
# Reuses the pure-panel floatk1 datasets; needs the TOINT64 function plugin in the binary.
query:
  name: serde_micro_f2ik1
  description: "serde micro mixed: float64 in -> INT64 out (expensive float parse, cheap int serialize), K=1"
  sql: |
    SELECT TOINT64(c0) AS c0 FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/floatk1.csv
          size_bytes: 25777108
          rows: 2000000
        native:
          file: large/serde_micro/floatk1.nes
          size_bytes: 16000000
          rows: 2000000
  sink_schema:
    - { name: c0, type: INT64, not_null: true }
