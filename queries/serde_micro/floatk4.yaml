# serde-micro: SELECT * on K=4 float64 columns. CSV + SystemNative binary twin.
query:
  name: serde_micro_floatk4
  description: "serde micro: SELECT * on 4 float64 cols (passthrough projection)"
  sql: |
    SELECT * FROM src
  sources:
    - name: src
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
      data:
        csv:
          file: large/serde_micro/floatk4.csv
          size_bytes: 103109490
          rows: 2000000
        native:
          file: large/serde_micro/floatk4.nes
          size_bytes: 64000000
          rows: 2000000
  sink_schema:
    - { name: src.c0, type: FLOAT64, not_null: true }
    - { name: src.c1, type: FLOAT64, not_null: true }
    - { name: src.c2, type: FLOAT64, not_null: true }
    - { name: src.c3, type: FLOAT64, not_null: true }
