query:
  name: gridsweep_int_n16_w1
  description: >
    2-D grid point: input schema 16 field(s), each value exactly 1 digit(s) (~1 B/value); the query
    PROJECTS + parses ONLY field c0 (c0*UINT64(1) defeats lazy elision on that one field; the other 15 are
    indexed but neither parsed nor output). So INDEXING scales with N (all 16 delimiters written to the
    band) while parse+serialize stays constant at 1 UINT64 field. Throughput = full 16-field row bytes /
    time. Data large/multicol/n16_w1.csv (209715328 B). Delimiter density 1/(1+1); index degrades below ~8 B/value.
  sql: "SELECT c0 * UINT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: UINT64, not_null: true }
        - { name: c1, type: UINT64, not_null: true }
        - { name: c2, type: UINT64, not_null: true }
        - { name: c3, type: UINT64, not_null: true }
        - { name: c4, type: UINT64, not_null: true }
        - { name: c5, type: UINT64, not_null: true }
        - { name: c6, type: UINT64, not_null: true }
        - { name: c7, type: UINT64, not_null: true }
        - { name: c8, type: UINT64, not_null: true }
        - { name: c9, type: UINT64, not_null: true }
        - { name: c10, type: UINT64, not_null: true }
        - { name: c11, type: UINT64, not_null: true }
        - { name: c12, type: UINT64, not_null: true }
        - { name: c13, type: UINT64, not_null: true }
        - { name: c14, type: UINT64, not_null: true }
        - { name: c15, type: UINT64, not_null: true }
      data:
        large:
          file: large/multicol/n16_w1.csv
          size_bytes: 209715328
  sink_schema:
    - { name: c0, type: UINT64, not_null: true }
