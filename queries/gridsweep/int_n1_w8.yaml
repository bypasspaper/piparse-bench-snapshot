query:
  name: gridsweep_int_n1_w8
  description: >
    2-D grid point: input schema 1 field(s), each value exactly 8 digit(s) (~8 B/value); the query
    PROJECTS + parses ONLY field c0 (c0*UINT64(1) defeats lazy elision on that one field; the other 0 are
    indexed but neither parsed nor output). So INDEXING scales with N (all 1 delimiters written to the
    band) while parse+serialize stays constant at 1 UINT64 field. Throughput = full 1-field row bytes /
    time. Data large/multicol/n1_w8.csv (209715309 B). Delimiter density 1/(8+1); index degrades below ~8 B/value.
  sql: "SELECT c0 * UINT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: UINT64, not_null: true }
      data:
        large:
          file: large/multicol/n1_w8.csv
          size_bytes: 209715309
  sink_schema:
    - { name: c0, type: UINT64, not_null: true }
