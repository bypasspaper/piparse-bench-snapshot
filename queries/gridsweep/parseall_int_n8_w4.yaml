query:
  name: gridsweep_parseall_int_n8_w4
  description: >
    2-D grid point (PARSE-ALL companion of the projection grid): 8-field schema, 4-digit values; parse+
    serialize ALL 8 columns as UINT64 (cI*UINT64(1)). Index scales with N AND codec scales with N. Subtract the
    projection grid (parse 1) to isolate the pure per-field parse+serialize cost. Data n8_w4.csv (209715320 B).
  sql: "SELECT c0 * UINT64(1) AS c0, c1 * UINT64(1) AS c1, c2 * UINT64(1) AS c2, c3 * UINT64(1) AS c3, c4 * UINT64(1) AS c4, c5 * UINT64(1) AS c5, c6 * UINT64(1) AS c6, c7 * UINT64(1) AS c7 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: UINT64, not_null: true }
        - { name: c1, type: UINT64, not_null: true }
        - { name: c2, type: UINT64, not_null: true }
        - { name: c3, type: UINT64, not_null: true }
        - { name: c4, type: UINT64, not_null: true }
        - { name: c5, type: UINT64, not_null: true }
        - { name: c6, type: UINT64, not_null: true }
        - { name: c7, type: UINT64, not_null: true }
      data:
        large: { file: large/multicol/n8_w4.csv, size_bytes: 209715320 }
  sink_schema:
    - { name: c0, type: UINT64, not_null: true }
    - { name: c1, type: UINT64, not_null: true }
    - { name: c2, type: UINT64, not_null: true }
    - { name: c3, type: UINT64, not_null: true }
    - { name: c4, type: UINT64, not_null: true }
    - { name: c5, type: UINT64, not_null: true }
    - { name: c6, type: UINT64, not_null: true }
    - { name: c7, type: UINT64, not_null: true }
