query:
  name: gridsweep_parseall_int_n16_w2
  description: >
    2-D grid point (PARSE-ALL companion of the projection grid): 16-field schema, 2-digit values; parse+
    serialize ALL 16 columns as UINT64 (cI*UINT64(1)). Index scales with N AND codec scales with N. Subtract the
    projection grid (parse 1) to isolate the pure per-field parse+serialize cost. Data n16_w2.csv (209715312 B).
  sql: "SELECT c0 * UINT64(1) AS c0, c1 * UINT64(1) AS c1, c2 * UINT64(1) AS c2, c3 * UINT64(1) AS c3, c4 * UINT64(1) AS c4, c5 * UINT64(1) AS c5, c6 * UINT64(1) AS c6, c7 * UINT64(1) AS c7, c8 * UINT64(1) AS c8, c9 * UINT64(1) AS c9, c10 * UINT64(1) AS c10, c11 * UINT64(1) AS c11, c12 * UINT64(1) AS c12, c13 * UINT64(1) AS c13, c14 * UINT64(1) AS c14, c15 * UINT64(1) AS c15 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: UINT64, not_null: true }
        - { name: c1, type: UINT64, not_null: true }
        - { name: c2, type: UINT64, not_null: true }
        - { name: c3, type: UINT64, not_null: true }
        - { name: c4, type: UINT64, not_null: true }
