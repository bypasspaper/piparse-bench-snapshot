query:
  name: gridsweep_float_n16_w8
  description: >
    2-D grid point: input schema 16 field(s), each value exactly 8 digit(s) (~8 B/value); the query
    PROJECTS + parses ONLY field c0 (c0*FLOAT64(1) defeats lazy elision on that one field; the other 15 are
    indexed but neither parsed nor output). So INDEXING scales with N (all 16 delimiters written to the
    band) while parse+serialize stays constant at 1 FLOAT64 field. Throughput = full 16-field row bytes /
    time. Data large/multicol/n16_w8.csv (209715408 B). Delimiter density 1/(8+1); index degrades below ~8 B/value.
  sql: "SELECT c0 * FLOAT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
        - { name: c4, type: FLOAT64, not_null: true }
        - { name: c5, type: FLOAT64, not_null: true }
        - { name: c6, type: FLOAT64, not_null: true }
        - { name: c7, type: FLOAT64, not_null: true }
        - { name: c8, type: FLOAT64, not_null: true }
        - { name: c9, type: FLOAT64, not_null: true }
        - { name: c10, type: FLOAT64, not_null: true }
        - { name: c11, type: FLOAT64, not_null: true }
        - { name: c12, type: FLOAT64, not_null: true }
        - { name: c13, type: FLOAT64, not_null: true }
        - { name: c14, type: FLOAT64, not_null: true }
        - { name: c15, type: FLOAT64, not_null: true }
      data:
        large:
          file: large/multicol/n16_w8.csv
          size_bytes: 209715408
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
