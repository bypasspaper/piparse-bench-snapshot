query:
  name: gridsweep_int_n2_w2
  description: >
    2-D grid point: input schema 2 field(s), each value exactly 2 digit(s) (~2 B/value); the query
    PROJECTS + parses ONLY field c0 (c0*UINT64(1) defeats lazy elision on that one field; the other 1 are
    indexed but neither parsed nor output). So INDEXING scales with N (all 2 delimiters written to the
    band) while parse+serialize stays constant at 1 UINT64 field. Throughput = full 2-field row bytes /
    time. Data large/multicol/n2_w2.csv (209715306 B). Delimiter density 1/(2+1); index degrades below ~8 B/value.
  sql: "SELECT c0 * UINT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: UINT64, not_null: true }
        - { name: c1, type: UINT64, not_null: true }
      data:
        large:
          file: large/multicol/n2_w2.csv
          size_bytes: 209715306
  sink_schema:
    - { name: c0, type: UINT64, not_null: true }
