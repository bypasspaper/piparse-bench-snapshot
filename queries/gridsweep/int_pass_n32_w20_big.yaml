query:
  name: gridsweep_int_pass_n32_w20_big
  description: >
    Passthrough SELECT c0 (no parse) on the LARGE ~12GB n32_w20 file for a sustained cold read. Index 32 +
    byte-copy c0, zero codec. Used to test whether IoUringFile (O_DIRECT zero-copy DMA) hits the NVMe read
    ceiling (~6.9 GB/s) vs the ~8.7 GB/s InMemory compute ceiling. Data large/multicol/n32_w20_big.csv (12582944640 B).
  sql: "SELECT c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: UINT64, not_null: true }
        - { name: c1, type: UINT64, not_null: true }
