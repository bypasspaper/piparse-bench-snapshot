query:
  name: gridsweep_parseall_float_n8_w8
  description: >
    2-D grid point (PARSE-ALL companion of the projection grid): 8-field schema, 8-digit values; parse+
    serialize ALL 8 columns as FLOAT64 (cI*FLOAT64(1)). Index scales with N AND codec scales with N. Subtract the
    projection grid (parse 1) to isolate the pure per-field parse+serialize cost. Data n8_w8.csv (209715336 B).
  sql: "SELECT c0 * FLOAT64(1) AS c0, c1 * FLOAT64(1) AS c1, c2 * FLOAT64(1) AS c2, c3 * FLOAT64(1) AS c3, c4 * FLOAT64(1) AS c4, c5 * FLOAT64(1) AS c5, c6 * FLOAT64(1) AS c6, c7 * FLOAT64(1) AS c7 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
        - { name: c4, type: FLOAT64, not_null: true }
        - { name: c5, type: FLOAT64, not_null: true }
        - { name: c6, type: FLOAT64, not_null: true }
        - { name: c7, type: FLOAT64, not_null: true }
      data:
        large: { file: large/multicol/n8_w8.csv, size_bytes: 209715336 }
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
    - { name: c1, type: FLOAT64, not_null: true }
    - { name: c2, type: FLOAT64, not_null: true }
    - { name: c3, type: FLOAT64, not_null: true }
    - { name: c4, type: FLOAT64, not_null: true }
    - { name: c5, type: FLOAT64, not_null: true }
    - { name: c6, type: FLOAT64, not_null: true }
    - { name: c7, type: FLOAT64, not_null: true }
