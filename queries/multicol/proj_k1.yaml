query:
  name: multicol_proj_k1
  description: >
    STRICT PROJECTION variant of parse_k1: 16-FLOAT64-column input row (integer-valued, ~104 B/row) but
    the SELECT emits ONLY the 1 parsed column(s) (cI*FLOAT64(1)) -- the other 15 columns are neither
    output nor computed, so they are SKIPPED (not parsed, NOT passthrough-copied to output). Removes the
    passthrough byte-copy + wide-output-framing confound of parse_k1, isolating: index-the-row + parse 1
    + serialize 1 + emit a 1-wide output row. Data large/multicol/f16.csv (2.0M rows). Compare the fixed
    cost `a` to parse_k's 88.7 ns/row (the delta = passthrough copy + wide framing).
  sql: "SELECT c0 * FLOAT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
        - { name: c4, type: FLOAT64, not_null: true }
        - { name: c5, type: FLOAT64, not_null: true }
        - { name: c6, type: FLOAT64, not_null: true }
        - { name: c7, type: FLOAT64, not_null: true }
        - { name: c8, type: FLOAT64, not_null: true }
        - { name: c9, type: FLOAT64, not_null: true }
        - { name: c10, type: FLOAT64, not_null: true }
        - { name: c11, type: FLOAT64, not_null: true }
        - { name: c12, type: FLOAT64, not_null: true }
        - { name: c13, type: FLOAT64, not_null: true }
        - { name: c14, type: FLOAT64, not_null: true }
        - { name: c15, type: FLOAT64, not_null: true }
      data:
        large:
          file: large/multicol/f16.csv
          size_bytes: 209715304
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
