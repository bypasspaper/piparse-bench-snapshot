query:
  name: multicol_projf_n4
  description: >
    Field-count sweep point: 4-FLOAT64-column row (.6f floats), project+parse ONLY c0
    (c0*FLOAT64(1) forces parse+serialize of c0). All 4 delimiters are INDEXED; the COMPILED
    formatter parses only c0 (projection pushdown) while the UNCOMPILED formatter parses all 4
    (no pushdown). csv->json. Data large/multicol/nf4.csv (200000025 B, 4591417 rows).
  sql: "SELECT c0 * FLOAT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
      data:
        large:
          file: large/multicol/nf4.csv
          size_bytes: 200000025
          rows: 4591417
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
