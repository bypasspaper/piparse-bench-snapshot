query:
  name: multicol_projf_n2
  description: >
    Field-count sweep point: 2-FLOAT64-column row (.6f floats), project+parse ONLY c0
    (c0*FLOAT64(1) forces parse+serialize of c0). All 2 delimiters are INDEXED; the COMPILED
    formatter parses only c0 (projection pushdown) while the UNCOMPILED formatter parses all 2
    (no pushdown). csv->json. Data large/multicol/nf2.csv (200000009 B, 9182782 rows).
  sql: "SELECT c0 * FLOAT64(1) AS c0 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
      data:
        large:
          file: large/multicol/nf2.csv
          size_bytes: 200000009
          rows: 9182782
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
