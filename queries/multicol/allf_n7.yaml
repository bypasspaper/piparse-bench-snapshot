# Fig2: SELECT * over N=7 equi-width FLOAT64 (.6f) columns. Every field is *FLOAT64(1) to
# FORCE parse+serialize of all N (defeats passthrough elision) -> real per-field work. csv->json.
# Constant ~200MB total; bytes/row scales ~10.9*N so rows/s spans ~10x at ~constant MB/s.
query:
  name: multicol_allf_n7
  description: "Fig2 field-count point: parse+serialize all 7 FLOAT64 columns (csv->json)."
  sql: "SELECT c0 * FLOAT64(1) AS c0, c1 * FLOAT64(1) AS c1, c2 * FLOAT64(1) AS c2, c3 * FLOAT64(1) AS c3, c4 * FLOAT64(1) AS c4, c5 * FLOAT64(1) AS c5, c6 * FLOAT64(1) AS c6 FROM t"
  # Flink dialect (2026-09-03, Fig2-on-Flink): same shape; Flink has no passthrough elision, so the
  # *1 is symmetry only (every column is parsed by Flink's csv format and re-serialized by json).
  flink_sql: "SELECT c0 * CAST(1 AS DOUBLE) AS c0, c1 * CAST(1 AS DOUBLE) AS c1, c2 * CAST(1 AS DOUBLE) AS c2, c3 * CAST(1 AS DOUBLE) AS c3, c4 * CAST(1 AS DOUBLE) AS c4, c5 * CAST(1 AS DOUBLE) AS c5, c6 * CAST(1 AS DOUBLE) AS c6 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
        - { name: c4, type: FLOAT64, not_null: true }
        - { name: c5, type: FLOAT64, not_null: true }
        - { name: c6, type: FLOAT64, not_null: true }
      data:
        large:
          file: large/multicol/nf7.csv
          size_bytes: 200000047
          rows: 2623639
        xlarge:
          # nf7.csv concatenated 10x (2026-09-03, Fig2-on-Flink: JVM-length run; same bytes/row)
          file: large/multicol/nf7_x10.csv
          size_bytes: 2000000470
          rows: 26236390
  sink_schema:
    - { name: c0, type: FLOAT64, not_null: true }
    - { name: c1, type: FLOAT64, not_null: true }
    - { name: c2, type: FLOAT64, not_null: true }
    - { name: c3, type: FLOAT64, not_null: true }
    - { name: c4, type: FLOAT64, not_null: true }
    - { name: c5, type: FLOAT64, not_null: true }
    - { name: c6, type: FLOAT64, not_null: true }
