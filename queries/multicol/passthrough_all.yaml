query:
  name: multicol_passthrough_all
  description: >
    PURE passthrough: SELECT c0,...,c15 FROM t on the 16-col row -- NO computed field, so every output field
    is a non-nullable lazy passthrough -> CSVOutputFormatter::tryWriteCoalescedRecord FIRES (whole row emitted
    as ONE memmove + tuple delim). Contrast with parse_k1 (c0*1 computed -> coalescing DECLINES -> 15 per-field
    passthrough memmoves). Confirms the "one computed field disables whole-record coalescing" finding: expect
    __memmove to collapse from ~15 tiny copies/row to ~1, and throughput to jump vs parse_k1's 897 MB/s.
  sql: "SELECT c0, c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12, c13, c14, c15 FROM t"
  sources:
    - name: t
      schema:
        - { name: c0, type: FLOAT64, not_null: true }
        - { name: c1, type: FLOAT64, not_null: true }
        - { name: c2, type: FLOAT64, not_null: true }
        - { name: c3, type: FLOAT64, not_null: true }
        - { name: c4, type: FLOAT64, not_null: true }
        - { name: c5, type: FLOAT64, not_null: true }
        - { name: c6, type: FLOAT64, not_null: true }
        - { name: c7, type: FLOAT64, not_null: true }
        - { name: c8, type: FLOAT64, not_null: true }
        - { name: c9, type: FLOAT64, not_null: true }
        - { name: c10, type: FLOAT64, not_null: true }
        - { name: c11, type: FLOAT64, not_null: true }
        - { name: c12, type: FLOAT64, not_null: true }
        - { name: c13, type: FLOAT64, not_null: true }
        - { name: c14, type: FLOAT64, not_null: true }
        - { name: c15, type: FLOAT64, not_null: true }
      data:
        large:
          file: large/multicol/f16.csv
          size_bytes: 209715304
  sink_schema:
    - { name: t.c0, type: FLOAT64, not_null: true }
    - { name: t.c1, type: FLOAT64, not_null: true }
    - { name: t.c2, type: FLOAT64, not_null: true }
    - { name: t.c3, type: FLOAT64, not_null: true }
    - { name: t.c4, type: FLOAT64, not_null: true }
    - { name: t.c5, type: FLOAT64, not_null: true }
    - { name: t.c6, type: FLOAT64, not_null: true }
    - { name: t.c7, type: FLOAT64, not_null: true }
    - { name: t.c8, type: FLOAT64, not_null: true }
    - { name: t.c9, type: FLOAT64, not_null: true }
    - { name: t.c10, type: FLOAT64, not_null: true }
    - { name: t.c11, type: FLOAT64, not_null: true }
    - { name: t.c12, type: FLOAT64, not_null: true }
    - { name: t.c13, type: FLOAT64, not_null: true }
    - { name: t.c14, type: FLOAT64, not_null: true }
    - { name: t.c15, type: FLOAT64, not_null: true }
